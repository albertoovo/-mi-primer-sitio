<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Feedback</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 40px 20px;
  }

  .contenedor {
    max-width: 900px;
    margin: auto;
  }

  h1 {
    text-align: center;
  }

  .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  input, select, button {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    cursor: pointer;
    background: #3E63C7;
    color: white;
    border: none;
  }

  button:hover {
    opacity: 0.9;
  }

  .estadisticas {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .stat {
    flex: 1;
    min-width: 150px;
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
  }

  .numero {
    font-size: 28px;
    font-weight: bold;
  }

  .feedback {
    border-top: 1px solid #ddd;
    padding: 15px 0;
  }

  .rating {
    font-weight: bold;
  }

  .fecha {
    color: #777;
    font-size: 13px;
  }

  #mensaje {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="contenedor">

  <h1>Panel de Feedback</h1>

  <div class="panel">

    <input
      type="password"
      id="password"
      placeholder="Contraseña de administrador"
    >

    <button onclick="cargarFeedbacks()">
      Cargar feedbacks
    </button>

    <button onclick="exportarCSV()">
      Exportar CSV
    </button>

    <button onclick="cargarFeedbacks()">
      Actualizar
    </button>

    <div id="mensaje"></div>

  </div>

  <div class="panel">

    <div class="estadisticas">

      <div class="stat">
        <div>Promedio</div>
        <div class="numero" id="promedio">-</div>
      </div>

      <div class="stat">
        <div>Total</div>
        <div class="numero" id="total">0</div>
      </div>

      <div class="stat">
        <div>5 estrellas</div>
        <div class="numero" id="cinco">0</div>
      </div>

      <div class="stat">
        <div>1 estrella</div>
        <div class="numero" id="uno">0</div>
      </div>

    </div>

  </div>

  <div class="panel">

    <select id="filtroRating" onchange="mostrarFeedbacks()">
      <option value="todos">Todas las calificaciones</option>
      <option value="5">5 estrellas</option>
      <option value="4">4 estrellas</option>
      <option value="3">3 estrellas</option>
      <option value="2">2 estrellas</option>
      <option value="1">1 estrella</option>
    </select>

    <select id="orden" onchange="mostrarFeedbacks()">
      <option value="reciente">Más recientes</option>
      <option value="antiguo">Más antiguos</option>
    </select>

    <input
      type="text"
      id="busqueda"
      placeholder="Buscar en comentarios..."
      oninput="mostrarFeedbacks()"
    >

  </div>

  <div class="panel">
    <div id="listaFeedbacks">
      No hay feedbacks cargados.
    </div>
  </div>

</div>

<script>

const WORKER =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";

let todosLosFeedbacks = [];


async function cargarFeedbacks() {

  const password =
    document.getElementById("password").value;

  if (!password) {
    document.getElementById("mensaje").textContent =
      "Escribe la contraseña.";
    return;
  }

  try {

    const respuesta = await fetch(
      WORKER +
      "?accion=feedbacks&password=" +
      encodeURIComponent(password)
    );

    const datos = await respuesta.json();

    if (datos.error) {
      document.getElementById("mensaje").textContent =
        datos.error;
      return;
    }

    todosLosFeedbacks = datos.feedbacks || [];

    document.getElementById("mensaje").textContent =
      "Feedbacks cargados correctamente.";

    actualizarEstadisticas();
    mostrarFeedbacks();

  } catch (error) {

    document.getElementById("mensaje").textContent =
      "Error al cargar los feedbacks.";

    console.error(error);
  }
}


function actualizarEstadisticas() {

  const total = todosLosFeedbacks.length;

  document.getElementById("total").textContent = total;

  if (total === 0) {
    document.getElementById("promedio").textContent = "-";
    document.getElementById("uno").textContent = "0";
    document.getElementById("cinco").textContent = "0";
    return;
  }

  const suma = todosLosFeedbacks.reduce(
    (total, feedback) =>
      total + Number(feedback.rating || 0),
    0
  );

  const promedio = suma / total;

  document.getElementById("promedio").textContent =
    promedio.toFixed(1);

  document.getElementById("uno").textContent =
    todosLosFeedbacks.filter(
      feedback => Number(feedback.rating) === 1
    ).length;

  document.getElementById("cinco").textContent =
    todosLosFeedbacks.filter(
      feedback => Number(feedback.rating) === 5
    ).length;
}


function mostrarFeedbacks() {

  const filtro =
    document.getElementById("filtroRating").value;

  const orden =
    document.getElementById("orden").value;

  const busqueda =
    document.getElementById("busqueda").value
      .toLowerCase()
      .trim();

  let feedbacks = [...todosLosFeedbacks];


  if (filtro !== "todos") {

    feedbacks = feedbacks.filter(
      feedback =>
        Number(feedback.rating) === Number(filtro)
    );

  }


  if (busqueda) {

    feedbacks = feedbacks.filter(
      feedback =>
        (feedback.comentario || "")
          .toLowerCase()
          .includes(busqueda)
    );

  }


  feedbacks.sort((a, b) => {

    const fechaA = new Date(a.fecha || 0);
    const fechaB = new Date(b.fecha || 0);

    return orden === "reciente"
      ? fechaB - fechaA
      : fechaA - fechaB;

  });


  const lista =
    document.getElementById("listaFeedbacks");


  if (feedbacks.length === 0) {

    lista.innerHTML =
      "No hay feedbacks que coincidan.";

    return;
  }


  lista.innerHTML = feedbacks.map(feedback => {

    const rating =
      Number(feedback.rating || 0);

    const comentario =
      feedback.comentario || "Sin comentario";

    const fecha =
      feedback.fecha
        ? new Date(feedback.fecha).toLocaleString("es-MX")
        : "Sin fecha";


    return `
      <div class="feedback">

        <div class="rating">
          ⭐ ${rating}/5
        </div>

        <div>
          ${comentario}
        </div>

        <div class="fecha">
          ${fecha}
        </div>

      </div>
    `;

  }).join("");

}


function exportarCSV() {

  if (todosLosFeedbacks.length === 0) {

    alert("Primero carga los feedbacks.");

    return;
  }


  const filas = [];

  filas.push([
    "Calificación",
    "Comentario",
    "Fecha"
  ]);


  todosLosFeedbacks.forEach(feedback => {

    filas.push([
      feedback.rating || "",
      feedback.comentario || "",
      feedback.fecha || ""
    ]);

  });


  const csv = filas.map(fila => {

    return fila.map(campo => {

      const texto =
        String(campo)
          .replace(/"/g, '""');

      return `"${texto}"`;

    }).join(",");

  }).join("\n");


  const blob = new Blob(
    ["\uFEFF" + csv],
    {
      type: "text/csv;charset=utf-8;"
    }
  );


  const url =
    URL.createObjectURL(blob);


  const enlace =
    document.createElement("a");

  enlace.href = url;

  enlace.download =
    "feedback_negociacion.csv";

  document.body.appendChild(enlace);

  enlace.click();

  document.body.removeChild(enlace);

  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
