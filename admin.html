<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Feedback</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px;
    }

    input {
      width: 250px;
    }

    button {
      background-color: #3E63C7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    #resumen {
      display: none;
      background: white;
      padding: 20px;
      margin: 25px 0;
      border-radius: 10px;
    }

    .numero {
      font-size: 28px;
      font-weight: bold;
    }

    #controles {
      display: none;
      margin: 20px 0;
    }

    #resultado {
      margin-top: 25px;
      text-align: left;
    }

    .feedback {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 10px;
    }

    .rating {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Panel de Feedback</h1>

    <p>Introduce tu contraseña de administrador.</p>

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <br>

    <button onclick="cargarFeedbacks()">
      Ver feedbacks
    </button>

    <p id="mensaje"></p>

    <div id="resumen">

      <div>
        <div>Promedio</div>
        <div class="numero" id="promedio">0/5</div>
      </div>

      <br>

      <div>
        <div>Total de respuestas</div>
        <div class="numero" id="total">0</div>
      </div>

    </div>

    <div id="controles">

      <select id="filtroRating" onchange="mostrarFeedbacks()">
        <option value="todos">Todas las calificaciones</option>
        <option value="5">5 estrellas</option>
        <option value="4">4 estrellas</option>
        <option value="3">3 estrellas</option>
        <option value="2">2 estrellas</option>
        <option value="1">1 estrella</option>
      </select>

      <select id="orden" onchange="mostrarFeedbacks()">
        <option value="recientes">Más recientes</option>
        <option value="antiguos">Más antiguos</option>
      </select>

      <br>

      <button onclick="mostrarFeedbacks()">
        Actualizar lista
      </button>

    </div>

    <div id="resultado"></div>

  </div>

  <script>

    const WORKER =
      "https://academia-negociacion-api.aispuroalberto546.workers.dev/";

    let todosLosFeedbacks = [];

    async function cargarFeedbacks() {

      const password =
        document.getElementById("password").value;

      if (password.trim() === "") {
        document.getElementById("mensaje").innerText =
          "Escribe la contraseña.";
        return;
      }

      document.getElementById("mensaje").innerText =
        "Cargando feedbacks...";

      document.getElementById("resultado").innerHTML = "";

      try {

        const url =
          WORKER +
          "?accion=feedbacks" +
          "&password=" +
          encodeURIComponent(password);

        const respuesta =
          await fetch(url);

        const datos =
          await respuesta.json();

        if (!respuesta.ok) {

          document.getElementById("mensaje").innerText =
            "Contraseña incorrecta.";

          return;
        }

        todosLosFeedbacks =
          datos.feedbacks || [];

        document.getElementById("total").innerText =
          todosLosFeedbacks.length;

        if (todosLosFeedbacks.length > 0) {

          const suma =
            todosLosFeedbacks.reduce(
              (total, feedback) =>
                total + Number(feedback.rating),
              0
            );

          const promedio =
            (suma / todosLosFeedbacks.length).toFixed(1);

          document.getElementById("promedio").innerText =
            promedio + "/5";

        } else {

          document.getElementById("promedio").innerText =
            "0/5";
        }

        document.getElementById("resumen").style.display =
          "block";

        document.getElementById("controles").style.display =
          "block";

        document.getElementById("mensaje").innerText =
          "Feedbacks cargados correctamente.";

        mostrarFeedbacks();

      } catch (error) {

        document.getElementById("mensaje").innerText =
          "Hubo un error conectando con el servidor.";
      }
    }

    function mostrarFeedbacks() {

      let feedbacks =
        [...todosLosFeedbacks];

      const filtro =
        document.getElementById("filtroRating").value;

      const orden =
        document.getElementById("orden").value;

      if (filtro !== "todos") {

        feedbacks =
          feedbacks.filter(
            feedback =>
              Number(feedback.rating) === Number(filtro)
          );
      }

      feedbacks.sort((a, b) => {

        const fechaA =
          new Date(a.fecha).getTime();

        const fechaB =
          new Date(b.fecha).getTime();

        return orden === "recientes"
          ? fechaB - fechaA
          : fechaA - fechaB;
      });

      if (feedbacks.length === 0) {

        document.getElementById("resultado").innerHTML =
          "<p>No hay feedbacks que coincidan con el filtro.</p>";

        return;
      }

      document.getElementById("resultado").innerHTML =
        feedbacks.map(feedback => `

          <div class="feedback">

            <div class="rating">
              ⭐ ${feedback.rating}/5
            </div>

            <p>
              <strong>Comentario:</strong>
              ${feedback.comentario || "Sin comentario"}
            </p>

            <p>
              <small>
                Fecha:
                ${new Date(feedback.fecha).toLocaleString()}
              </small>
            </p>

          </div>

        `).join("");
    }

  </script>

</body>
</html>
