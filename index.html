<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia de Negociación</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
  padding: 40px 20px;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1, h2, h3 {
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #3E63C7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.secondary {
  background: #555;
}

.training-button {
  background: #111;
}

.danger {
  background: #b42318;
}

.mensaje {
  padding: 12px;
  border-radius: 8px;
  background: #eee;
  margin-top: 15px;
}

.error {
  background: #ffe5e5;
  color: #8b0000;
}

.success-box {
  background: #e8f7e8;
  color: #176b17;
}

.chat {
  margin-top: 20px;
}

.oponente {
  background: #eeeeee;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.usuario {
  background: #dfe8ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.score {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.skill {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
}

.skill strong {
  display: block;
  margin-bottom: 5px;
}

.debil {
  border: 3px solid #3E63C7;
  background: #eef2ff;
}

.skill-bar {
  height: 8px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.skill-fill {
  height: 100%;
  background: #3E63C7;
}

.training-exercise {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
  border-left: 5px solid #3E63C7;
}

.training-exercise h3 {
  text-align: left;
  margin-top: 0;
}

.challenge {
  background: #111;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.challenge textarea {
  color: #222;
}

.progress-box {
  background: #f7f7f7;
  padding: 20px;
  border-radius: 12px;
  margin-top: 15px;
}

.progress-bar {
  height: 16px;
  background: #ddd;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

.progress-fill {
  height: 100%;
  background: #3E63C7;
  transition: width 0.3s ease;
}

.xp-number {
  font-size: 34px;
  font-weight: bold;
  text-align: center;
}

.rank {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 5px;
}

.hidden {
  display: none;
}

.small {
  font-size: 14px;
  color: #666;
}

.divider {
  height: 1px;
  background: #ddd;
  margin: 25px 0;
}

@media (max-width: 600px) {
  .skill-grid {
    grid-template-columns: 1fr;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Práctica de Negociación</h1>

<!-- =========================
     CONFIGURACIÓN
========================= -->

<div class="card" id="configuracion">

<h2>Configura tu negociación</h2>

<label>Idioma</label>
<select id="idioma">
  <option value="es">Español</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="pt">Português</option>
</select>

<label>¿Qué quieres conseguir?</label>
<input
  id="objetivo"
  placeholder="Ejemplo: Comprar por $1,000"
>

<label>¿Qué estás negociando?</label>
<input
  id="articulo"
  placeholder="Ejemplo: Una computadora"
>

<label>Dificultad</label>
<select id="dificultad">
  <option value="facil">Fácil</option>
  <option value="media" selected>Media</option>
  <option value="dificil">Difícil</option>
  <option value="experto">Experto</option>
</select>

<label>Tipo de negociación</label>
<input
  id="tipo"
  placeholder="Ejemplo: Compra, venta, salario, negocio"
>

<label>Presupuesto</label>
<input
  id="presupuesto"
  placeholder="Opcional"
>

<label>Cantidad</label>
<input
  id="cantidad"
  placeholder="Opcional"
>

<label>Contexto</label>
<textarea
  id="contexto"
  placeholder="Opcional"
></textarea>

<label>Condiciones</label>
<textarea
  id="condiciones"
  placeholder="Opcional"
></textarea>

<button id="btnIniciar" onclick="iniciarNegociacion()">
  Comenzar negociación
</button>

<div id="mensajeInicio"></div>

</div>


<!-- =========================
     NEGOCIACIÓN
========================= -->

<div class="card hidden" id="negociacion">

<h2>Negociación</h2>

<div id="chat" class="chat"></div>

<label>Tu respuesta</label>

<textarea
  id="respuesta"
  placeholder="Escribe lo que responderías..."
  onkeydown="manejarEnter(event)"
></textarea>

<button id="btnEnviar" onclick="enviarRespuesta()">
  Enviar respuesta
</button>

<button
  id="btnFinalizar"
  class="secondary"
  onclick="finalizarNegociacion()"
>
  Finalizar negociación
</button>

<div id="mensajeRespuesta"></div>

</div>


<!-- =========================
     RESULTADO
========================= -->

<div class="card hidden" id="resultado">

<h2>Resultado</h2>

<div class="score" id="puntaje"></div>

<div id="feedback"></div>

<div id="habilidades"></div>

<button
  id="btnEntrenamiento"
  class="training-button"
  onclick="obtenerEntrenamiento()"
>
  🎯 Entrenar mi habilidad más débil
</button>

<div id="mensajeEntrenamiento"></div>

</div>


<!-- =========================
     ENTRENAMIENTO
========================= -->

<div class="card hidden" id="entrenamiento">

<h2>Entrenamiento personalizado</h2>

<div id="contenidoEntrenamiento"></div>

</div>


<!-- =========================
     PROGRESO
========================= -->

<div class="card" id="progreso">

<h2>Mi progreso</h2>

<div class="progress-box">

<div class="xp-number" id="xpTotal">
  0 XP
</div>

<div class="rank" id="nivelActual">
  Nivel 1 · Novato
</div>

<div class="progress-bar">
  <div
    class="progress-fill"
    id="xpBar"
    style="width:0%"
  ></div>
</div>

<p
  id="xpSiguiente"
  class="small"
  style="text-align:center;"
>
  100 XP para el siguiente nivel
</p>

</div>

<div
  id="estadisticas"
  class="mensaje"
></div>

<div id="evolucion"></div>

<button
  class="danger"
  onclick="reiniciar()"
>
  Reiniciar progreso
</button>

</div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";


/* =========================
   VARIABLES
========================= */

let historial = [];

let contador = 0;

let sessionId = null;

let ultimaFrase = "";

let trainingData = null;


/* =========================
   XP
========================= */

const XP_NIVELES = [
  0,
  100,
  250,
  450,
  700,
  1000,
  1400,
  1850,
  2400,
  3000
];


const SKILL_LABELS = {

  preparacion: "Preparación",

  anclaje: "Anclaje",

  preguntas: "Preguntas",

  argumentacion: "Argumentación",

  manejoPresion: "Manejo de presión",

  concesiones: "Concesiones",

  cierre: "Cierre"

};


/* =========================
   UTILIDADES
========================= */

function escapeHtml(text) {

  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function getXP() {

  return Number(
    localStorage.getItem("xpTotal") || 0
  );

}


function getXPEvents() {

  return new Set(
    JSON.parse(
      localStorage.getItem("xpEventos") || "[]"
    )
  );

}


function saveXPEvents(events) {

  localStorage.setItem(
    "xpEventos",
    JSON.stringify([...events])
  );

}


function addXP(amount, eventId) {

  const events = getXPEvents();

  if (events.has(eventId)) {

    return false;

  }

  events.add(eventId);

  localStorage.setItem(
    "xpTotal",
    String(getXP() + amount)
  );

  saveXPEvents(events);

  actualizarProgreso();

  return true;

}


function getLevel(xp = getXP()) {

  for (
    let i = XP_NIVELES.length - 1;
    i >= 0;
    i--
  ) {

    if (xp >= XP_NIVELES[i]) {

      return i + 1;

    }

  }

  return 1;

}


function xpForNextLevel(level) {

  if (level < XP_NIVELES.length) {

    return XP_NIVELES[level];

  }

  return (
    XP_NIVELES[XP_NIVELES.length - 1]
    +
    (level - 10) * 600
  );

}


function xpForCurrentLevel(level) {

  if (level <= XP_NIVELES.length) {

    return XP_NIVELES[level - 1];

  }

  return (
    XP_NIVELES[XP_NIVELES.length - 1]
    +
    (level - 11) * 600
  );

}


function getRank(level) {

  if (level === 1) return "Novato";

  if (level === 2) return "Aprendiz";

  if (level <= 4) return "Negociador";

  if (level <= 6) return "Estratega";

  if (level <= 8) return "Experto";

  if (level <= 10) return "Maestro";

  return "Élite";

}


/* =========================
   PROGRESO
========================= */

function actualizarProgreso() {

  const xp = getXP();

  const nivel = getLevel(xp);

  const rango = getRank(nivel);

  const actual = xpForCurrentLevel(nivel);

  const siguiente = xpForNextLevel(nivel);

  let porcentaje = 100;

  if (siguiente > actual) {

    porcentaje =
      Math.max(
        0,
        Math.min(
          100,
          ((xp - actual) /
          (siguiente - actual)) * 100
        )
      );

  }

  document.getElementById(
    "xpTotal"
  ).textContent =
    `${xp} XP`;

  document.getElementById(
    "nivelActual"
  ).textContent =
    `Nivel ${nivel} · ${rango}`;

  document.getElementById(
    "xpBar"
  ).style.width =
    `${porcentaje}%`;

  if (siguiente > xp) {

    document.getElementById(
      "xpSiguiente"
    ).textContent =
      `${siguiente - xp} XP para el siguiente nivel`;

  } else {

    document.getElementById(
      "xpSiguiente"
    ).textContent =
      "Nivel máximo alcanzado. Sigue acumulando XP para avanzar.";

  }

}


/* =========================
   API
========================= */

async function apiJson(url, options = {}) {

  const response =
    await fetch(url, options);

  let data;

  try {

    data = await response.json();

  } catch {

    throw new Error(
      "El servidor devolvió una respuesta inválida."
    );

  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Ocurrió un error en el servidor."
    );

  }

  return data;

}


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  const idioma =
    document.getElementById("idioma").value;

  const objetivo =
    document.getElementById("objetivo").value.trim();

  const articulo =
    document.getElementById("articulo").value.trim();

  const dificultad =
    document.getElementById("dificultad").value;

  const tipo =
    document.getElementById("tipo").value.trim();

  const presupuesto =
    document.getElementById("presupuesto").value.trim();

  const cantidad =
    document.getElementById("cantidad").value.trim();

  const contexto =
    document.getElementById("contexto").value.trim();

  const condiciones =
    document.getElementById("condiciones").value.trim();


  if (!objetivo && !articulo) {

    document.getElementById(
      "mensajeInicio"
    ).innerHTML =
      `<div class="mensaje">
        Escribe al menos qué quieres conseguir
        o qué estás negociando.
      </div>`;

    return;

  }


  const btn =
    document.getElementById("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";


  try {

    const params =
      new URLSearchParams({

        accion: "frase",

        idioma,

        objetivo,

        articulo,

        dificultad,

        tipo,

        presupuesto,

        cantidad,

        contexto,

        condiciones

      });


    const datos =
      await apiJson(
        `${API_URL}?${params.toString()}`
      );


    sessionId =
      datos.sessionId;

    historial = [];

    ultimaFrase = "";


    document.getElementById(
      "chat"
    ).innerHTML = "";


    agregarOponente(
      datos.respuesta
    );


    document.getElementById(
      "configuracion"
    ).classList.add("hidden");


    document.getElementById(
      "resultado"
    ).classList.add("hidden");


    document.getElementById(
      "entrenamiento"
    ).classList.add("hidden");


    document.getElementById(
      "negociacion"
    ).classList.remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    document.getElementById(
      "mensajeInicio"
    ).innerHTML =
      `<div class="mensaje error">
        Error: ${escapeHtml(error.message)}
      </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   CHAT
========================= */

function agregarOponente(texto) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "oponente";

  div.innerHTML =
    `<strong>Oponente:</strong><br>
     ${escapeHtml(texto)}`;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


function agregarUsuario(texto) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "usuario";

  div.innerHTML =
    `<strong>Tú:</strong><br>
     ${escapeHtml(texto)}`;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  if (!sessionId) {

    return;

  }


  const area =
    document.getElementById("respuesta");

  const texto =
    area.value.trim();


  if (!texto) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =
      `<div class="mensaje">
        Escribe algo antes de enviar.
      </div>`;

    return;

  }


  const btn =
    document.getElementById("btnEnviar");

  btn.disabled = true;

  btn.textContent =
    "Pensando...";


  document.getElementById(
    "mensajeRespuesta"
  ).innerHTML = "";


  agregarUsuario(texto);

  area.value = "";


  try {

    const data =
      await apiJson(
        `${API_URL}?accion=continuar`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            sessionId,

            mensaje: texto

          })

        }
      );


    agregarOponente(
      data.respuesta
    );


  } catch (error) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =
      `<div class="mensaje error">
        Error: ${escapeHtml(error.message)}
      </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion() {

  if (!sessionId) {

    return;

  }


  const btn =
    document.getElementById(
      "btnFinalizar"
    );

  btn.disabled = true;

  btn.textContent =
    "Evaluando...";


  try {

    const data =
      await apiJson(
        `${API_URL}?accion=evaluar`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            sessionId
          })

        }
      );


    mostrarResultado(
      data.evaluacion
    );


    const eventId =
      `negociacion:${sessionId}`;


    const awarded =
      addXP(
        50,
        eventId
      );


    if (awarded) {

      const box =
        document.getElementById(
          "feedback"
        );

      box.innerHTML +=
        `<div class="mensaje success-box">
          +50 XP por completar la negociación.
        </div>`;

    }


    document.getElementById(
      "negociacion"
    ).classList.add("hidden");


    document.getElementById(
      "resultado"
    ).classList.remove("hidden");


    actualizarEstadisticas();

    actualizarEvolucion();


    document.getElementById(
      "resultado"
    ).scrollIntoView({
      behavior: "smooth"
    });


  } catch (error) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =
      `<div class="mensaje error">
        Error: ${escapeHtml(error.message)}
      </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   RESULTADO
========================= */

function mostrarResultado(evaluacion) {

  if (!evaluacion) {

    return;

  }


  const score =
    Number(
      evaluacion.puntaje || 0
    );


  document.getElementById(
    "puntaje"
  ).textContent =
    `${score}/100`;


  let html = "";


  if (
    evaluacion.queHizoBien?.length
  ) {

    html +=
      `<h3>✅ Qué hiciste bien</h3>
       <ul>
       ${
         evaluacion.queHizoBien
           .map(
             item =>
               `<li>${escapeHtml(item)}</li>`
           )
           .join("")
       }
       </ul>`;

  }


  if (
    evaluacion.queHizoMal?.length
  ) {

    html +=
      `<h3>❌ Qué hiciste mal</h3>
       <ul>
       ${
         evaluacion.queHizoMal
           .map(
             item =>
               `<li>${escapeHtml(item)}</li>`
           )
           .join("")
       }
       </ul>`;

  }


  if (evaluacion.mayorError) {

    html +=
      `<h3>⚠️ Tu mayor error</h3>
       <p>
       ${escapeHtml(
         evaluacion.mayorError
       )}
       </p>`;

  }


  if (evaluacion.deberiaMejorar) {

    const texto =
      Array.isArray(
        evaluacion.deberiaMejorar
      )
        ? evaluacion.deberiaMejorar.join(" ")
        : evaluacion.deberiaMejorar;


    html +=
      `<h3>📈 Qué debes mejorar</h3>
       <p>
       ${escapeHtml(texto)}
       </p>`;

  }


  if (evaluacion.consejo) {

    html +=
      `<h3>💡 Consejo para la siguiente</h3>
       <p>
       ${escapeHtml(
         evaluacion.consejo
       )}
       </p>`;

  }


  document.getElementById(
    "feedback"
  ).innerHTML = html;


  mostrarHabilidades(
    evaluacion
  );


  historialResultadosGuardar(
    score,
    evaluacion
  );

}


/* =========================
   HABILIDADES
========================= */

function mostrarHabilidades(evaluacion) {

  const habilidades =
    evaluacion.habilidades || {};


  let weakest = null;

  let weakestValue =
    Infinity;


  Object.keys(
    SKILL_LABELS
  ).forEach(key => {

    const value =
      Number(
        habilidades[key] ?? 0
      );


    if (value < weakestValue) {

      weakestValue =
        value;

      weakest =
        key;

    }

  });


  let html =
    `<h3>Habilidades</h3>
     <div class="skill-grid">`;


  Object.keys(
    SKILL_LABELS
  ).forEach(key => {

    const value =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            habilidades[key] ?? 0
          )
        )
      );


    html +=
      `<div class="skill ${
        key === weakest
          ? "debil"
          : ""
      }">

        <strong>
          ${SKILL_LABELS[key]}
        </strong>

        <span>
          ${value}/100
        </span>

        <div class="skill-bar">
          <div
            class="skill-fill"
            style="width:${value}%"
          ></div>
        </div>

        ${
          key === weakest
            ? "<p class='small'><strong>Habilidad más débil</strong></p>"
            : ""
        }

      </div>`;

  });


  html +=
    "</div>";


  document.getElementById(
    "habilidades"
  ).innerHTML = html;

}


/* =========================
   ENTRENAMIENTO
========================= */

async function obtenerEntrenamiento() {

  if (!sessionId) {

    alert(
      "No se encontró la sesión."
    );

    return;

  }


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );

  const mensaje =
    document.getElementById(
      "mensajeEntrenamiento"
    );


  boton.disabled = true;

  boton.textContent =
    "🎯 Creando entrenamiento...";


  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu desempeño y creando ejercicios personalizados...
    </div>`;


  try {

    const data =
      await apiJson(
        `${API_URL}?accion=entrenamiento`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            sessionId
          })

        }
      );


    trainingData =
      data.entrenamiento;


    mostrarEntrenamiento(
      trainingData
    );


    localStorage.setItem(
      "ultimoEntrenamiento",
      JSON.stringify(
        trainingData
      )
    );


    mensaje.innerHTML = "";


  } catch (error) {

    mensaje.innerHTML =
      `<div class="mensaje error">
        Error:
        ${escapeHtml(
          error.message
        )}
      </div>`;

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================
   MOSTRAR ENTRENAMIENTO
========================= */

function mostrarEntrenamiento(
  entrenamiento
) {

  if (!entrenamiento) {

    return;

  }


  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  let html = "";


  html +=
    `<div class="mensaje">

      <strong>
        Habilidad:
      </strong>

      ${escapeHtml(
        entrenamiento.nombreHabilidad ||
        entrenamiento.habilidad ||
        ""
      )}

      <br><br>

      <strong>
        Puntaje actual:
      </strong>

      ${Number(
        entrenamiento.puntajeActual || 0
      )}/100

    </div>`;


  if (entrenamiento.objetivo) {

    html +=
      `<h3>🎯 Objetivo</h3>
       <p>
       ${escapeHtml(
         entrenamiento.objetivo
       )}
       </p>`;

  }


  if (entrenamiento.explicacion) {

    html +=
      `<h3>📚 Aprende primero</h3>
       <p>
       ${escapeHtml(
         entrenamiento.explicacion
       )}
       </p>`;

  }


  if (
    entrenamiento.ejercicios &&
    entrenamiento.ejercicios.length
  ) {

    html +=
      `<h3>🥊 Ejercicios</h3>`;


    entrenamiento.ejercicios
      .forEach(ejercicio => {

        html +=
          `<div class="training-exercise">

            <h3>
              Ejercicio
              ${ejercicio.numero}:
              ${escapeHtml(
                ejercicio.titulo
              )}
            </h3>

            <p>
              <strong>Instrucción:</strong><br>
              ${escapeHtml(
                ejercicio.instruccion
              )}
            </p>

            <p>
              <strong>Situación:</strong><br>
              ${escapeHtml(
                ejercicio.situacion
              )}
            </p>

            <p>
              <strong>Qué debes hacer:</strong><br>
              ${escapeHtml(
                ejercicio.queDebeHacer
              )}
            </p>

            <textarea
              id="ejercicioRespuesta${ejercicio.numero}"
              placeholder="Escribe aquí tu respuesta..."
            ></textarea>

            <button
              id="btnEjercicio${ejercicio.numero}"
              onclick="resolverEjercicio(${ejercicio.numero})"
            >
              Enviar ejercicio
            </button>

            <div
              id="resultadoEjercicio${ejercicio.numero}"
            ></div>

          </div>`;

      });

  }


  if (entrenamiento.retoFinal) {

    const reto =
      entrenamiento.retoFinal;


    html +=
      `<div class="challenge">

        <h3>🏆 Reto final</h3>

        <h3>
          ${escapeHtml(
            reto.titulo
          )}
        </h3>

        <p>
          <strong>Situación:</strong><br>
          ${escapeHtml(
            reto.situacion
          )}
        </p>

        <p>
          <strong>Instrucción:</strong><br>
          ${escapeHtml(
            reto.instruccion
          )}
        </p>

        <p>
          <strong>Criterio de éxito:</strong><br>
          ${escapeHtml(
            reto.criterioExito
          )}
        </p>

        <textarea
          id="retoRespuesta"
          placeholder="Escribe tu estrategia y respuesta final..."
        ></textarea>

        <button
          id="btnReto"
          onclick="resolverRetoFinal()"
        >
          Enviar reto final
        </button>

        <div id="resultadoReto"></div>

      </div>`;

  }


  contenedor.innerHTML =
    html;


  document.getElementById(
    "entrenamiento"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "entrenamiento"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   EJERCICIOS
========================= */

async function resolverEjercicio(numero) {

  if (!sessionId) {

    return;

  }


  const area =
    document.getElementById(
      `ejercicioRespuesta${numero}`
    );


  const answer =
    area.value.trim();


  const btn =
    document.getElementById(
      `btnEjercicio${numero}`
    );


  const out =
    document.getElementById(
      `resultadoEjercicio${numero}`
    );


  if (!answer) {

    out.innerHTML =
      `<div class="mensaje error">
        Escribe tu respuesta.
      </div>`;

    return;

  }


  const eventId =
    `ejercicio:${sessionId}:${numero}`;


  const already =
    getXPEvents()
      .has(eventId);


  btn.disabled = true;

  btn.textContent =
    "Evaluando...";


  try {

    const data =
      await apiJson(
        `${API_URL}?accion=ejercicio`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            sessionId,

            numero,

            respuesta: answer

          })

        }
      );


    const r =
      data.resultado;


    let html =
      `<div class="mensaje ${
        r.puntaje >= 70
          ? "success-box"
          : ""
      }">

        <strong>
          ${Number(r.puntaje || 0)}/100
        </strong>

        <br>

        ${escapeHtml(
          r.retroalimentacion || ""
        )}

      </div>`;


    if (
      r.queHizoBien?.length
    ) {

      html +=
        `<p>
          <strong>Bien:</strong>
        </p>

        <ul>

          ${
            r.queHizoBien
              .map(
                x =>
                  `<li>${escapeHtml(x)}</li>`
              )
              .join("")
          }

        </ul>`;

    }


    if (
      r.queMejorar?.length
    ) {

      html +=
        `<p>
          <strong>Mejorar:</strong>
        </p>

        <ul>

          ${
            r.queMejorar
              .map(
                x =>
                  `<li>${escapeHtml(x)}</li>`
              )
              .join("")
          }

        </ul>`;

    }


    if (r.mejorVersion) {

      html +=
        `<p>
          <strong>Mejor versión:</strong>
          ${escapeHtml(
            r.mejorVersion
          )}
        </p>`;

    }


    if (r.consejo) {

      html +=
        `<p>
          <strong>Consejo:</strong>
          ${escapeHtml(
            r.consejo
          )}
        </p>`;

    }


    out.innerHTML =
      html;


    if (!already) {

      addXP(
        15,
        eventId
      );

      out.innerHTML +=
        `<p class="small">
          +15 XP por completar este ejercicio.
        </p>`;

    }


    btn.textContent =
      "Ejercicio completado";


  } catch (error) {

    out.innerHTML =
      `<div class="mensaje error">
        Error:
        ${escapeHtml(
          error.message
        )}
      </div>`;

    btn.disabled = false;

    btn.textContent =
      "Enviar ejercicio";

  }

}


/* =========================
   RETO FINAL
========================= */

async function resolverRetoFinal() {

  if (!sessionId) {

    return;

  }


  const area =
    document.getElementById(
      "retoRespuesta"
    );


  const answer =
    area.value.trim();


  const btn =
    document.getElementById(
      "btnReto"
    );


  const out =
    document.getElementById(
      "resultadoReto"
    );


  if (!answer) {

    out.innerHTML =
      `<div class="mensaje error">
        Escribe tu respuesta.
      </div>`;

    return;

  }


  btn.disabled = true;

  btn.textContent =
    "Evaluando reto...";


  try {

    const data =
      await apiJson(
        `${API_URL}?accion=retoFinal`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            sessionId,

            respuesta: answer,

            idioma:
              document.getElementById(
                "idioma"
              ).value

          })

        }
      );


    const r =
      data.resultado;


    const score =
      Number(
        r.puntaje || 0
      );


    const eventId =
      `retoFinal:${sessionId}`;


    const xpAmount =
      r.superado
        ? 100
        : 40;


    const awarded =
      addXP(
        xpAmount,
        eventId
      );


    let html =
      `<div class="mensaje ${
        r.superado
          ? "success-box"
          : ""
      }">

        <strong>
          ${score}/100 ·
          ${
            r.superado
              ? "¡Reto superado!"
              : "Reto no superado"
          }
        </strong>

        <br>

        ${escapeHtml(
          r.evaluacion || ""
        )}

      </div>`;


    if (
      r.queHizoBien?.length
    ) {

      html +=
        `<h4>Qué hiciste bien</h4>

        <ul>

          ${
            r.queHizoBien
              .map(
                x =>
                  `<li>${escapeHtml(x)}</li>`
              )
              .join("")
          }

        </ul>`;

    }


    if (
      r.queDebeMejorar?.length
    ) {

      html +=
        `<h4>Qué debes mejorar</h4>

        <ul>

          ${
            r.queDebeMejorar
              .map(
                x =>
                  `<li>${escapeHtml(x)}</li>`
              )
              .join("")
          }

        </ul>`;

    }


    if (r.errorPrincipal) {

      html +=
        `<p>
          <strong>Error principal:</strong>
          ${escapeHtml(
            r.errorPrincipal
          )}
        </p>`;

    }


    if (r.mejorVersion) {

      html +=
        `<p>
          <strong>Mejor versión:</strong>
          ${escapeHtml(
            r.mejorVersion
          )}
        </p>`;

    }


    if (r.consejo) {

      html +=
        `<p>
          <strong>Consejo:</strong>
          ${escapeHtml(
            r.consejo
          )}
        </p>`;

    }


    if (awarded) {

      html +=
        `<p class="small">
          +${xpAmount} XP
        </p>`;

    }


    out.innerHTML =
      html;


    btn.textContent =
      "Reto evaluado";


    actualizarProgreso();


  } catch (error) {

    out.innerHTML =
      `<div class="mensaje error">
        Error:
        ${escapeHtml(
          error.message
        )}
      </div>`;

    btn.disabled = false;

    btn.textContent =
      "Enviar reto final";

  }

}


/* =========================
   GUARDAR RESULTADOS
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  let resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  resultados.push({

    fecha:
      new Date().toISOString(),

    puntaje,

    evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(
      resultados
    )
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(
      historial
    )
  );


  localStorage.setItem(
    "contador",
    String(contador)
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  if (!resultados.length) {

    document.getElementById(
      "estadisticas"
    ).innerHTML =
      "Negociaciones: 0<br>Promedio: 0/100";

    return;

  }


  const suma =
    resultados.reduce(
      (total, resultado) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );


  const promedio =
    Math.round(
      (
        suma /
        resultados.length
      ) * 10
    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        r =>
          r.puntaje
      )
      .join(", ");


  document.getElementById(
    "estadisticas"
  ).innerHTML =

    `<strong>
      Negociaciones:
    </strong>
    ${resultados.length}

    <br>

    <strong>
      Promedio:
    </strong>
    ${promedio}/100

    <br>

    <strong>
      Últimos resultados:
    </strong>
    ${escapeHtml(ultimos)}`;

}


/* =========================
   EVOLUCIÓN
========================= */

function actualizarEvolucion() {

  const datos =
    JSON.parse(
      localStorage.getItem(
        "evolucion"
      ) || "[]"
    );


  const el =
    document.getElementById(
      "evolucion"
    );


  if (!datos.length) {

    el.innerHTML = "";

    return;

  }


  const ult =
    datos.slice(-5);


  let html =
    `<div class="divider"></div>

     <h3>
       Evolución de habilidades
     </h3>

     <p class="small">
       Comparación de tus últimas evaluaciones.
     </p>

     <div class="skill-grid">`;


  Object.keys(
    SKILL_LABELS
  ).forEach(key => {

    const vals =
      ult.map(
        x =>
          Number(
            x.habilidades?.[key] || 0
          )
      );


    const actual =
      vals[
        vals.length - 1
      ] || 0;


    const anterior =
      vals.length > 1
        ? vals[
            vals.length - 2
          ]
        : actual;


    const delta =
      actual - anterior;


    html +=
      `<div class="skill">

        <strong>
          ${SKILL_LABELS[key]}
        </strong>

        <span>
          ${actual}/100

          ${
            delta > 0
              ? `↑ ${delta}`
              : delta < 0
              ? `↓ ${Math.abs(delta)}`
              : "—"
          }

        </span>

        <div class="skill-bar">

          <div
            class="skill-fill"
            style="width:${actual}%"
          ></div>

        </div>

      </div>`;

  });


  html +=
    "</div>";


  el.innerHTML =
    html;

}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar tus negociaciones, resultados y prácticas? Tu XP, nivel y rango se conservarán."
    );


  if (!confirmar) {

    return;

  }


  [
    "historial",
    "contador",
    "resultados",
    "ultimoEntrenamiento",
    "evolucion"
  ].forEach(
    key =>
      localStorage.removeItem(
        key
      )
  );


  historial = [];

  contador = 0;

  sessionId = null;

  trainingData = null;


  document.getElementById(
    "chat"
  ).innerHTML = "";


  document.getElementById(
    "configuracion"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "negociacion"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "resultado"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "entrenamiento"
  ).classList.add(
    "hidden"
  );


  actualizarEstadisticas();

  actualizarEvolucion();

  actualizarProgreso();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   CARGAR DATOS
========================= */

historial =
  JSON.parse(
    localStorage.getItem(
      "historial"
    ) || "[]"
  );


contador =
  Number(
    localStorage.getItem(
      "contador"
    ) || 0
  );


actualizarEstadisticas();

actualizarEvolucion();

actualizarProgreso();


</script>
