<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
      background-color: #f2f2f2;
    }
    button {
      background-color: #3E63C7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px;
    }
    #chat {
      max-width: 500px;
      margin: 20px auto;
      text-align: left;
      background: white;
      border-radius: 8px;
      padding: 15px;
      min-height: 100px;
    }
    .cliente { color: #b03030; margin: 8px 0; }
    .usuario { color: #3E63C7; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Práctica de Negociación</h1>
  <select id="filtro">
    <option value="todos">Todos los contextos</option>
    <option value="Negociación de precio">Negociación de precio</option>
    <option value="Buscando acuerdo">Buscando acuerdo</option>
    <option value="Cerrando el trato">Cerrando el trato</option>
  </select>
  <select id="dificultad">
    <option value="facil">Fácil</option>
    <option value="medio" selected>Medio</option>
    <option value="dificil">Difícil</option>
  </select>
  <br>
  <button onclick="iniciarNegociacion()">Iniciar negociación</button>

  <div id="chat"></div>

  <textarea id="mensaje" placeholder="Escribe tu respuesta aquí..."></textarea><br>
  <button onclick="enviarMensaje()">Enviar</button>

  <script>
    let conversacion = [];
    const WORKER = "https://academia-negociacion-api.aispuroalberto546.workers.dev/";

    function renderChat() {
      document.getElementById("chat").innerHTML = conversacion.map(m =>
        `<p class="${m.rol}"><strong>${m.rol === "cliente" ? "Cliente" : "Tú"}:</strong> ${m.texto}</p>`
      ).join("");
    }

    async function iniciarNegociacion() {
      conversacion = [];
      renderChat();
      document.getElementById("chat").innerText = "Iniciando negociación...";
      try {
        const contexto = document.getElementById("filtro").value;
        const dificultad = document.getElementById("dificultad").value;
        const respuesta = await fetch(WORKER + "?contexto=" + encodeURIComponent(contexto) + "&dificultad=" + encodeURIComponent(dificultad));
        const texto = await respuesta.text();
        conversacion.push({ rol: "cliente", texto: texto });
        renderChat();
      } catch (error) {
        document.getElementById("chat").innerText = "Hubo un error iniciando la negociación. Intenta de nuevo.";
      }
    }

    async function enviarMensaje() {
      const texto = document.getElementById("mensaje").value;
      if (texto.trim() === "") return;

      conversacion.push({ rol: "usuario", texto: texto });
      renderChat();
      document.getElementById("mensaje").value = "";

      try {
        const dificultad = document.getElementById("dificultad").value;
        const url = WORKER + "?accion=continuar&dificultad=" + encodeURIComponent(dificultad)
          + "&historial=" + encodeURIComponent(JSON.stringify(conversacion));
        const respuesta = await fetch(url);
        const respuestaCliente = await respuesta.text();
        conversacion.push({ rol: "cliente", texto: respuestaCliente });
        renderChat();
      } catch (error) {
        document.getElementById("chat").innerHTML += "<p>Hubo un error continuando la negociación. Intenta de nuevo.</p>";
      }
    }
  </script>
</body>
</html>
