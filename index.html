<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
      background-color: #f2f2f2;
    }
    #frase {
      font-size: 20px;
      margin: 20px;
    }
    button {
      background-color: #3E63C7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Práctica de Negociación</h1>
  <p id="frase">Aquí va a aparecer una frase</p>
  <button onclick="nuevaFrase()">Nueva frase</button>
  <p id="contador">Frases practicadas: 0</p>

  <textarea id="respuesta" placeholder="Escribe tu respuesta aquí..."></textarea>
  <button onclick="verRespuesta()">Enviar respuesta</button>
  <p id="mostrarRespuesta"></p>

  <script>
    let contador = 0;
    let ultimaFrase = "";
    const frases = [
      "Entiendo su posición, pero necesito revisar el precio.",
      "¿Qué tal si encontramos un punto medio?",
      "Esta es mi oferta final, ¿qué piensa?"
    ];

    function nuevaFrase() {
      let random;
      do {
        random = frases[Math.floor(Math.random() * frases.length)];
      } while (random === ultimaFrase);

      ultimaFrase = random;
      document.getElementById("frase").innerText = random;
      contador = contador + 1;
      document.getElementById("contador").innerText = "Frases practicadas: " + contador;
    }

    function verRespuesta() {
      const texto = document.getElementById("respuesta").value;

      if (texto.trim() === "") {
        document.getElementById("mostrarRespuesta").innerText = "Por favor escribe algo antes de enviar.";
      } else {
        document.getElementById("mostrarRespuesta").innerText = "Escribiste: " + texto;
        document.getElementById("respuesta").value = "";
        nuevaFrase();
      }
    }
  </script>
</body>
</html>
