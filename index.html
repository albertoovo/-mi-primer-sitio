<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica de Negociación</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
  padding: 40px 20px;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1, h2, h3 {
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #3E63C7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.secondary {
  background: #555;
}

.training-button {
  background: #111;
}

.danger {
  background: #b42318;
}

.mensaje {
  padding: 12px;
  border-radius: 8px;
  background: #eee;
  margin-top: 15px;
}

.chat {
  margin-top: 20px;
}

.oponente {
  background: #eee;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.usuario {
  background: #dfe8ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.score {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.skill {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
}

.skill strong {
  display: block;
  margin-bottom: 5px;
}

.debil {
  border: 3px solid #3E63C7;
  background: #eef2ff;
}

.training-exercise {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
  border-left: 5px solid #3E63C7;
}

.training-exercise h3 {
  text-align: left;
  margin-top: 0;
}

.training-progress {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.exercise-feedback {
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  background: #eef2ff;
}

.exercise-feedback h3 {
  text-align: left;
  margin-top: 0;
}

.improvement {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.success-message {
  background: #e8f5e9;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.challenge {
  background: #111;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.challenge textarea {
  background: white;
  color: #222;
}

.evolution {
  margin-top: 20px;
}

.small {
  font-size: 14px;
  color: #666;
}

.hidden {
  display: none;
}

@media (max-width:600px) {
  .skill-grid {
    grid-template-columns: 1fr;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Práctica de Negociación</h1>

<!-- CONFIGURACIÓN -->

<div class="card" id="configuracion">

<h2>Configura tu negociación</h2>

<label>Idioma</label>

<select id="idioma">
  <option value="auto" selected>Automático</option>
  <option value="es">Español</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="pt">Português</option>
</select>

<label>¿Qué quieres conseguir?</label>
<input id="objetivo" placeholder="Ejemplo: Comprar por $1,000">

<label>¿Qué estás negociando?</label>
<input id="articulo" placeholder="Ejemplo: Una computadora">

<label>Dificultad</label>

<select id="dificultad">
  <option value="facil">Fácil</option>
  <option value="media" selected>Media</option>
  <option value="dificil">Difícil</option>
  <option value="experto">Experto</option>
</select>

<label>Tipo de negociación</label>
<input id="tipo" placeholder="Ejemplo: Compra, venta, salario, negocio">

<label>Presupuesto</label>
<input id="presupuesto" placeholder="Opcional">

<label>Cantidad</label>
<input id="cantidad" placeholder="Opcional">

<label>Contexto</label>
<textarea id="contexto" placeholder="Opcional"></textarea>

<label>Condiciones</label>
<textarea id="condiciones" placeholder="Opcional"></textarea>

<button id="btnIniciar" onclick="iniciarNegociacion()">
Comenzar negociación
</button>

<div id="mensajeInicio"></div>

</div>


<!-- NEGOCIACIÓN -->

<div class="card hidden" id="negociacion">

<h2>Negociación</h2>

<div id="chat" class="chat"></div>

<label>Tu respuesta</label>

<textarea
id="respuesta"
placeholder="Escribe lo que responderías..."
onkeydown="manejarEnter(event)"
></textarea>

<button id="btnEnviar" onclick="enviarRespuesta()">
Enviar respuesta
</button>

<button
id="btnFinalizar"
class="secondary"
onclick="finalizarNegociacion()"
>
Finalizar negociación
</button>

<div id="mensajeRespuesta"></div>

</div>


<!-- RESULTADO -->

<div class="card hidden" id="resultado">

<h2>Resultado</h2>

<div class="score" id="puntaje"></div>

<div id="feedback"></div>

<div id="evaluacion"></div>

<button
id="btnEntrenamiento"
class="training-button hidden"
onclick="obtenerEntrenamiento()"
>
🎯 Entrenar mi habilidad más débil
</button>

<div id="mensajeEntrenamiento"></div>

</div>


<!-- ENTRENAMIENTO -->

<div class="card hidden" id="entrenamiento">

<h2>🎯 Entrenamiento personalizado</h2>

<div id="contenidoEntrenamiento"></div>

<div id="evolucionEntrenamiento"></div>

</div>


<!-- PROGRESO -->

<div class="card">

<h2>Mi progreso</h2>

<p id="estadisticas"></p>

<button class="danger" onclick="reiniciar()">
Reiniciar progreso
</button>

</div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";

let historial = [];
let contador = 0;

let sessionId = null;

let idiomaActual = "auto";

let entrenamientoActual = null;
let ejercicioActual = 0;
let resultadosEjercicios = [];


/* =========================
   CARGAR PROGRESO
========================= */

historial = JSON.parse(
  localStorage.getItem("historial") || "[]"
);

contador = Number(
  localStorage.getItem("contador") || 0
);

actualizarEstadisticas();


/* =========================
   IDIOMA
========================= */

function obtenerIdioma() {

  const seleccionado =
    document.getElementById("idioma").value;

  if (seleccionado !== "auto") {
    return seleccionado;
  }

  const navegador =
    navigator.language || "es";

  return navegador
    .split("-")[0]
    .toLowerCase();
}


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  idiomaActual = obtenerIdioma();

  const objetivo =
    document.getElementById("objetivo").value.trim();

  const articulo =
    document.getElementById("articulo").value.trim();

  const dificultad =
    document.getElementById("dificultad").value;

  const tipo =
    document.getElementById("tipo").value.trim();

  const presupuesto =
    document.getElementById("presupuesto").value.trim();

  const cantidad =
    document.getElementById("cantidad").value.trim();

  const contexto =
    document.getElementById("contexto").value.trim();

  const condiciones =
    document.getElementById("condiciones").value.trim();


  if (!objetivo || !articulo) {

    document.getElementById("mensajeInicio").innerHTML =
    `<div class="mensaje">
      Escribe el objetivo y lo que estás negociando.
    </div>`;

    return;
  }


  const btn =
    document.getElementById("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";


  try {

    const url =
      API_URL +
      "?accion=frase" +
      "&objetivo=" + encodeURIComponent(objetivo) +
      "&articulo=" + encodeURIComponent(articulo) +
      "&dificultad=" + encodeURIComponent(dificultad) +
      "&tipo=" + encodeURIComponent(tipo) +
      "&presupuesto=" + encodeURIComponent(presupuesto) +
      "&cantidad=" + encodeURIComponent(cantidad) +
      "&contexto=" + encodeURIComponent(contexto) +
      "&condiciones=" + encodeURIComponent(condiciones) +
      "&idioma=" + encodeURIComponent(idiomaActual);


    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo iniciar la negociación."
      );

    }


    sessionId =
      datos.sessionId;

    historial = [];

    document.getElementById("chat").innerHTML = "";

    agregarOponente(
      datos.respuesta
    );


    document.getElementById("configuracion")
      .classList.add("hidden");

    document.getElementById("resultado")
      .classList.add("hidden");

    document.getElementById("entrenamiento")
      .classList.add("hidden");

    document.getElementById("negociacion")
      .classList.remove("hidden");


  } catch (error) {

    document.getElementById("mensajeInicio").innerHTML =
    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   CHAT
========================= */

function agregarOponente(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
  `<div class="oponente">
    <strong>🤖 Oponente:</strong><br>
    ${texto}
  </div>`;

}


function agregarUsuario(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
  `<div class="usuario">
    <strong>🧑 Tú:</strong><br>
    ${texto}
  </div>`;

}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  const textarea =
    document.getElementById("respuesta");

  const texto =
    textarea.value.trim();


  if (!texto) {

    document.getElementById("mensajeRespuesta").innerHTML =
    `<div class="mensaje">
      Por favor escribe algo antes de enviar.
    </div>`;

    return;
  }


  if (!sessionId) {

    document.getElementById("mensajeRespuesta").innerHTML =
    `<div class="mensaje">
      No hay una negociación activa.
    </div>`;

    return;
  }


  agregarUsuario(texto);

  historial.push({
    rol: "usuario",
    texto: texto
  });

  textarea.value = "";


  const btn =
    document.getElementById("btnEnviar");

  btn.disabled = true;

  btn.textContent =
    "El oponente está respondiendo...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=continuar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            historial: historial,
            idioma: idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo continuar."
      );

    }


    historial.push({
      rol: "oponente",
      texto: datos.respuesta
    });


    agregarOponente(
      datos.respuesta
    );


  } catch (error) {

    document.getElementById("mensajeRespuesta").innerHTML =
    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER CHAT
========================= */

function manejarEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion() {

  if (!sessionId) return;


  const btn =
    document.getElementById("btnFinalizar");

  btn.disabled = true;

  btn.textContent =
    "Evaluando negociación...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evaluar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            historial: historial,
            idioma: idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar."
      );

    }


    mostrarResultado(
      datos.puntaje,
      datos.feedback,
      datos.evaluacion
    );


  } catch (error) {

    alert(
      "Error al evaluar: " +
      error.message
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   RESULTADO
========================= */

function mostrarResultado(
  puntaje,
  feedback,
  evaluacion
) {

  document.getElementById("negociacion")
    .classList.add("hidden");

  document.getElementById("resultado")
    .classList.remove("hidden");


  document.getElementById("puntaje")
    .textContent =
    puntaje + "/100";


  document.getElementById("feedback")
    .innerHTML =
    `<div class="mensaje">
      ${feedback || ""}
    </div>`;


  mostrarEvaluacion(
    evaluacion
  );


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );


  if (
    evaluacion &&
    evaluacion.habilidadMasDebil
  ) {

    boton.classList.remove(
      "hidden"
    );

    boton.textContent =
      "🎯 Entrenar " +
      evaluacion.habilidadMasDebil.nombre;

  } else {

    boton.classList.add(
      "hidden"
    );

  }


  contador++;

  guardarResultado(
    puntaje,
    evaluacion
  );

  actualizarEstadisticas();

}


/* =========================
   MOSTRAR EVALUACIÓN
========================= */

function mostrarEvaluacion(
  evaluacion
) {

  const contenedor =
    document.getElementById(
      "evaluacion"
    );


  if (!evaluacion) {

    contenedor.innerHTML = "";

    return;
  }


  let html = "";


  if (
    evaluacion.habilidadMasDebil
  ) {

    html +=
    `<div class="mensaje">
      <strong>
        🎯 Tu habilidad más débil:
      </strong><br>

      ${evaluacion.habilidadMasDebil.nombre}

      (${evaluacion.habilidadMasDebil.puntaje}/100)

    </div>`;

  }


  const habilidades = {

    preparacion: "Preparación",

    anclaje: "Anclaje",

    preguntas: "Preguntas",

    argumentacion: "Argumentación",

    manejoPresion: "Manejo de presión",

    concesiones: "Concesiones",

    cierre: "Cierre"

  };


  if (evaluacion.habilidades) {

    html +=
      "<h3>Habilidades</h3>";

    html +=
      '<div class="skill-grid">';


    for (
      const clave in habilidades
    ) {

      const puntaje =
        evaluacion.habilidades[clave] ?? 0;


      const debil =
        evaluacion.habilidadMasDebil &&
        evaluacion.habilidadMasDebil.clave === clave;


      html +=
      `<div class="skill ${debil ? "debil" : ""}">

        <strong>
          ${habilidades[clave]}
        </strong>

        ${puntaje}/100

        ${debil ? " 🎯" : ""}

      </div>`;

    }


    html +=
      "</div>";

  }


  if (
    evaluacion.queHizoBien?.length
  ) {

    html +=
    `<h3>✅ Qué hiciste bien</h3>
     <ul>`;

    evaluacion.queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html += "</ul>";

  }


  if (
    evaluacion.queHizoMal?.length
  ) {

    html +=
    `<h3>❌ Qué hiciste mal</h3>
     <ul>`;

    evaluacion.queHizoMal
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html += "</ul>";

  }


  if (
    evaluacion.mayorError
  ) {

    html +=
    `<h3>⚠️ Tu mayor error</h3>
     <p>
       ${evaluacion.mayorError}
     </p>`;

  }


  if (
    evaluacion.deberiaMejorar
  ) {

    html +=
    `<h3>📈 Qué debes mejorar</h3>
     <p>
       ${evaluacion.deberiaMejorar}
     </p>`;

  }


  if (
    evaluacion.consejo
  ) {

    html +=
    `<h3>💡 Consejo</h3>
     <p>
       ${evaluacion.consejo}
     </p>`;

  }


  contenedor.innerHTML =
    html;

}


/* =========================
   ENTRENAMIENTO
========================= */

async function obtenerEntrenamiento() {

  if (!sessionId) {

    alert(
      "No se encontró la sesión."
    );

    return;
  }


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );


  const mensaje =
    document.getElementById(
      "mensajeEntrenamiento"
    );


  boton.disabled = true;

  boton.textContent =
    "🎯 Creando entrenamiento...";


  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu desempeño y creando ejercicios personalizados...
    </div>`;


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=entrenamiento&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            idioma: idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo generar el entrenamiento."
      );

    }


    mostrarEntrenamiento(
      datos.entrenamiento
    );


  } catch (error) {

    mensaje.innerHTML =
    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================
   MOSTRAR ENTRENAMIENTO
========================= */

function mostrarEntrenamiento(
  entrenamiento
) {

  if (!entrenamiento) return;


  entrenamientoActual =
    entrenamiento;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  localStorage.setItem(
    "ultimoEntrenamiento",
    JSON.stringify(
      entrenamiento
    )
  );


  document.getElementById(
    "entrenamiento"
  ).classList.remove("hidden");


  mostrarEjercicioActual();


  document.getElementById(
    "entrenamiento"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   EJERCICIO ACTUAL
========================= */

function mostrarEjercicioActual() {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  const ejercicios =
    entrenamientoActual.ejercicios || [];


  if (
    ejercicioActual >=
    ejercicios.length
  ) {

    mostrarResumenEntrenamiento();

    return;
  }


  const ejercicio =
    ejercicios[ejercicioActual];


  let html = "";


  html +=
  `<div class="mensaje">

    <strong>Habilidad:</strong>
    ${entrenamientoActual.nombreHabilidad || entrenamientoActual.habilidad}

    <br><br>

    <strong>Puntaje inicial:</strong>
    ${entrenamientoActual.puntajeActual}/100

  </div>`;


  if (
    entrenamientoActual.objetivo
  ) {

    html +=
    `<h3>🎯 Objetivo</h3>
     <p>
       ${entrenamientoActual.objetivo}
     </p>`;

  }


  if (
    entrenamientoActual.explicacion &&
    ejercicioActual === 0
  ) {

    html +=
    `<h3>📚 Aprende primero</h3>
     <p>
       ${entrenamientoActual.explicacion}
     </p>`;

  }


  html +=
  `<div class="training-progress">

    Ejercicio
    ${ejercicioActual + 1}
    de
    ${ejercicios.length}

  </div>`;


  html +=
  `<div class="training-exercise">

    <h3>
      🥊 ${ejercicio.titulo || "Ejercicio"}
    </h3>

    <p>
      <strong>Instrucción:</strong><br>
      ${ejercicio.instruccion || ""}
    </p>

    <p>
      <strong>Situación:</strong><br>
      ${ejercicio.situacion || ""}
    </p>

    <p>
      <strong>Qué debes hacer:</strong><br>
      ${ejercicio.queDebeHacer || ""}
    </p>

    <label>Tu respuesta</label>

    <textarea
      id="respuestaEjercicio"
      placeholder="Escribe exactamente lo que responderías..."
      onkeydown="manejarEnterEjercicio(event)"
    ></textarea>

    <button
      id="btnResponderEjercicio"
      onclick="evaluarEjercicio()"
    >
      Evaluar mi respuesta
    </button>

    <div id="mensajeEjercicio"></div>

  </div>`;


  contenedor.innerHTML =
    html;

}


/* =========================
   EVALUAR EJERCICIO
========================= */

async function evaluarEjercicio() {

  if (
    !sessionId ||
    !entrenamientoActual
  ) return;


  const textarea =
    document.getElementById(
      "respuestaEjercicio"
    );


  const respuesta =
    textarea.value.trim();


  if (!respuesta) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML =
    `<div class="mensaje">
      Escribe una respuesta antes de continuar.
    </div>`;

    return;
  }


  const ejercicio =
    entrenamientoActual
      .ejercicios[
        ejercicioActual
      ];


  const btn =
    document.getElementById(
      "btnResponderEjercicio"
    );


  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";


  try {

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=ejercicio&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            numeroEjercicio:
              Number(ejercicio.numero),

            respuesta:
              respuesta,

            idioma:
              idiomaActual
          })
        }
      );


    const datos =
      await respuestaAPI.json();


    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el ejercicio."
      );

    }


    const resultado =
      datos.resultado;


    resultadosEjercicios.push(
      resultado
    );


    mostrarFeedbackEjercicio(
      resultado
    );


  } catch (error) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML =
    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

    btn.disabled = false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}


/* =========================
   FEEDBACK EJERCICIO
========================= */

function mostrarFeedbackEjercicio(
  resultado
) {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  let html =
  `<div class="training-progress">

    Ejercicio
    ${resultado.numeroEjercicio}
    completado

  </div>`;


  html +=
  `<div class="exercise-feedback">

    <h3>📊 Tu resultado</h3>

    <div class="score">
      ${resultado.puntaje}/100
    </div>

    <p>
      <strong>Evaluación:</strong><br>
      ${resultado.evaluacion || ""}
    </p>`;


  if (
    resultado.queHizoBien?.length
  ) {

    html +=
    `<h3>✅ Qué hiciste bien</h3>
     <ul>`;

    resultado.queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html +=
      "</ul>";

  }


  if (
    resultado.queDebeMejorar?.length
  ) {

    html +=
    `<h3>📈 Qué debes mejorar</h3>
     <ul>`;

    resultado.queDebeMejorar
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html +=
      "</ul>";

  }


  if (
    resultado.errorPrincipal
  ) {

    html +=
    `<p>
      <strong>⚠️ Error principal:</strong><br>
      ${resultado.errorPrincipal}
    </p>`;

  }


  if (
    resultado.mejorVersion
  ) {

    html +=
    `<div class="improvement">

      <strong>
        💡 Una versión más fuerte:
      </strong>

      <p>
        ${resultado.mejorVersion}
      </p>

    </div>`;

  }


  if (
    resultado.consejo
  ) {

    html +=
    `<p>
      <strong>🎯 Consejo:</strong><br>
      ${resultado.consejo}
    </p>`;

  }


  html +=
  `<button onclick="siguienteEjercicio()">

    ${
      ejercicioActual + 1 <
      (entrenamientoActual.ejercicios || []).length
        ? "Siguiente ejercicio →"
        : "Ver resultado del entrenamiento →"
    }

  </button>

  </div>`;


  contenedor.innerHTML =
    html;


  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   SIGUIENTE EJERCICIO
========================= */

function siguienteEjercicio() {

  ejercicioActual++;

  mostrarEjercicioActual();

}


/* =========================
   ENTER EJERCICIO
========================= */

function manejarEnterEjercicio(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarEjercicio();

  }

}


/* =========================
   RESUMEN ENTRENAMIENTO
========================= */

function mostrarResumenEntrenamiento() {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  const resultados =
    resultadosEjercicios;


  let promedio = 0;


  if (resultados.length) {

    const suma =
      resultados.reduce(
        (total, resultado) =>
          total +
          Number(
            resultado.puntaje || 0
          ),
        0
      );


    promedio =
      Math.round(
        (suma / resultados.length) *
        10
      ) / 10;

  }


  let html =
  `<div class="success-message">

    <h3>
      🎉 Ejercicios completados
    </h3>

    <p>
      Terminaste los
      ${resultados.length}
      ejercicios.
    </p>

    <p>
      <strong>
        Promedio:
      </strong>
      ${promedio}/100
    </p>

  </div>`;


  if (
    entrenamientoActual.retoFinal
  ) {

    const reto =
      entrenamientoActual.retoFinal;


    html +=
    `<div class="challenge">

      <h3>🏆 Reto final</h3>

      <h3>
        ${reto.titulo || ""}
      </h3>

      <p>
        <strong>Situación:</strong><br>
        ${reto.situacion || ""}
      </p>

      <p>
        <strong>Instrucción:</strong><br>
        ${reto.instruccion || ""}
      </p>

      <p>
        <strong>Criterio de éxito:</strong><br>
        ${reto.criterioExito || ""}
      </p>

      <label style="color:white;">
        Tu respuesta
      </label>

      <textarea
        id="respuestaRetoFinal"
        placeholder="Escribe exactamente lo que responderías..."
      ></textarea>

      <button
        id="btnRetoFinal"
        onclick="evaluarRetoFinal()"
      >
        Evaluar reto final
      </button>

      <div id="mensajeRetoFinal"></div>

      <div id="resultadoRetoFinal"></div>

    </div>`;

  }


  contenedor.innerHTML =
    html;


  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   RETO FINAL
========================= */

async function evaluarRetoFinal() {

  if (
    !sessionId ||
    !entrenamientoActual ||
    !entrenamientoActual.retoFinal
  ) return;


  const textarea =
    document.getElementById(
      "respuestaRetoFinal"
    );


  const respuesta =
    textarea.value.trim();


  const btn =
    document.getElementById(
      "btnRetoFinal"
    );


  const mensaje =
    document.getElementById(
      "mensajeRetoFinal"
    );


  const resultadoContenedor =
    document.getElementById(
      "resultadoRetoFinal"
    );


  if (!respuesta) {

    mensaje.innerHTML =
    `<div class="mensaje">
      Escribe una respuesta antes de evaluarla.
    </div>`;

    return;
  }


  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";


  mensaje.innerHTML =
  `<div class="mensaje">
    Analizando tu reto final...
  </div>`;


  try {

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=retoFinal&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            respuesta:
              respuesta,

            idioma:
              idiomaActual
          })
        }
      );


    const datos =
      await respuestaAPI.json();


    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el reto final."
      );

    }


    const resultado =
      datos.resultado || {};


    let html =
    `<div class="exercise-feedback">

      <h3>
        🏆 Resultado del reto final
      </h3>

      <div class="score">
        ${resultado.puntaje || 0}/100
      </div>

      <p>
        <strong>Evaluación:</strong><br>
        ${resultado.evaluacion || ""}
      </p>`;


    if (
      resultado.queHizoBien?.length
    ) {

      html +=
      `<h3>✅ Qué hiciste bien</h3>
       <ul>`;

      resultado.queHizoBien
        .forEach(item => {

          html +=
            `<li>${item}</li>`;

        });

      html += "</ul>";

    }


    if (
      resultado.queDebeMejorar?.length
    ) {

      html +=
      `<h3>📈 Qué debes mejorar</h3>
       <ul>`;

      resultado.queDebeMejorar
        .forEach(item => {

          html +=
            `<li>${item}</li>`;

        });

      html += "</ul>";

    }


    if (
      resultado.errorPrincipal
    ) {

      html +=
      `<p>
        <strong>
          ⚠️ Error principal:
        </strong><br>

        ${resultado.errorPrincipal}

      </p>`;

    }


    if (
      resultado.mejorVersion
    ) {

      html +=
      `<div class="improvement">

        <strong>
          💡 Una versión más fuerte:
        </strong>

        <p>
          ${resultado.mejorVersion}
        </p>

      </div>`;

    }


    if (
      resultado.consejo
    ) {

      html +=
      `<p>
        <strong>🎯 Consejo:</strong><br>
        ${resultado.consejo}
      </p>`;

    }


    html +=
    `<div class="${
      resultado.superado
        ? "success-message"
        : "mensaje"
    }">

      <strong>
        ${
          resultado.superado
            ? "🎉 Reto superado"
            : "💪 Sigue entrenando"
        }
      </strong>

    </div>

    </div>`;


    resultadoContenedor.innerHTML =
      html;


    mensaje.innerHTML = "";

    textarea.disabled = true;

    btn.textContent =

    await cargarEvolucion();


  } catch (error) {

    mensaje.innerHTML =
    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

    btn.disabled = false;

    btn.textContent =
      "Evaluar reto final";

  }

}


/* =========================
   EVOLUCIÓN
========================= */

async function cargarEvolucion() {

  if (!sessionId) return;


  const contenedor =
    document.getElementById(
      "evolucionEntrenamiento"
    );


  contenedor.innerHTML =
  `<div class="mensaje">
    Cargando evolución...
  </div>`;


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evolucion&sessionId=" +
        encodeURIComponent(sessionId)
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo cargar la evolución."
      );

    }


    const evolucion =
      datos.evolucion || {};


    const nombres = {

      preparacion: "Preparación",

      anclaje: "Anclaje",

      preguntas: "Preguntas",

      argumentacion: "Argumentación",

      manejoPresion:
        "Manejo de presión",

      concesiones:
        "Concesiones",

      cierre:
        "Cierre"

    };


    let html =
    `<div class="exercise-feedback">

      <h3>
        📈 Evolución de habilidades
      </h3>`;


    let hayDatos = false;


    for (
      const clave in evolucion
    ) {

      if (
        !Array.isArray(
          evolucion[clave]
        ) ||
        !evolucion[clave].length
      ) continue;


      hayDatos = true;


      const valores =
        evolucion[clave];


      const primero =
        Number(
          valores[0].puntaje || 0
        );


      const ultimo =
        Number(
          valores[
            valores.length - 1
          ].puntaje || 0
        );


      const cambio =
        ultimo - primero;


      const historial =
        valores
          .slice(-5)
          .map(
            item =>
              item.puntaje
          )
          .join(" → ");


      html +=
      `<div class="skill">

        <strong>
          ${nombres[clave] || clave}
        </strong>

        ${historial}/100

        <br>

        <span class="small">

          ${
            cambio > 0
              ? "↗"
              : cambio < 0
                ? "↘"
                : "→"
          }

          Cambio:
          ${cambio >= 0 ? "+" : ""}
          ${cambio}

        </span>

      </div>`;

    }


    if (!hayDatos) {

      html +=
      `<p>
        Aún no hay suficiente historial.
      </p>`;

    }


    html +=
      "</div>";


    contenedor.innerHTML =
      html;


  } catch (error) {

    contenedor.innerHTML =
    `<div class="mensaje">
      No se pudo cargar la evolución:
      ${error.message}
    </div>`;

  }

}


/* =========================
   GUARDAR RESULTADOS
========================= */

function guardarResultado(
  puntaje,
  evaluacion
) {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  resultados.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      puntaje,

    evaluacion:
      evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(resultados)
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(historial)
  );


  localStorage.setItem(
    "contador",
    contador
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  if (!resultados.length) {

    document.getElementById(
      "estadisticas"
    ).innerHTML =
      "Negociaciones: 0<br>Promedio: 0/100";

    return;
  }


  const suma =
    resultados.reduce(
      (total, resultado) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );


  const promedio =
    Math.round(
      (suma / resultados.length) *
      10
    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        resultado =>
          resultado.puntaje
      )
      .join(", ");


  document.getElementById(
    "estadisticas"
  ).innerHTML =
  `
    <strong>
      Negociaciones:
    </strong>
    ${resultados.length}

    <br>

    <strong>
      Promedio:
    </strong>
    ${promedio}/100

    <br>

    <strong>
      Últimos resultados:
    </strong>
    ${ultimos}
  `;

}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar todo tu progreso?"
    );


  if (!confirmar) return;


  localStorage.removeItem(
    "historial"
  );

  localStorage.removeItem(
    "contador"
  );

  localStorage.removeItem(
    "resultados"
  );

  localStorage.removeItem(
    "ultimoEntrenamiento"
  );


  historial = [];

  contador = 0;

  sessionId = null;

  idiomaActual = "auto";

  entrenamientoActual = null;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  actualizarEstadisticas();


  document.getElementById(
    "chat"
  ).innerHTML = "";


  document.getElementById(
    "configuracion"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "negociacion"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "resultado"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "entrenamiento"
  ).classList.add(
    "hidden"
  );

}

   FIN
