<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica de Negociación</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
  padding:40px 20px;
}

.container{
  max-width:850px;
  margin:auto;
}

h1,h2,h3{
  text-align:center;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:#3E63C7;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.secondary{
  background:#555;
}

.training-button{
  background:#111;
}

.danger{
  background:#b42318;
}

.mensaje{
  padding:12px;
  border-radius:8px;
  background:#eee;
  margin-top:15px;
  white-space:pre-wrap;
}

.chat{
  margin-top:20px;
  max-height:520px;
  overflow:auto;
}

.oponente,
.usuario{
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  white-space:pre-wrap;
}

.oponente{
  background:#eee;
}

.usuario{
  background:#dfe8ff;
}

.score{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:20px 0;
}

.skill-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}

.skill{
  background:#f5f5f5;
  padding:15px;
  border-radius:10px;
}

.skill strong{
  display:block;
  margin-bottom:5px;
}

.debil{
  border:3px solid #3E63C7;
  background:#eef2ff;
}

ul{
  padding-left:20px;
}

.training-exercise{
  background:#f7f7f7;
  padding:18px;
  border-radius:12px;
  margin-top:15px;
  border-left:5px solid #3E63C7;
}

.training-exercise h3{
  text-align:left;
  margin-top:0;
}

.challenge{
  background:#111;
  color:#fff;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.hidden{
  display:none;
}

.small{
  font-size:14px;
  color:#666;
}

.topbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:15px;
}

.topbar label{
  margin:0;
  min-width:100px;
}

.topbar select{
  max-width:180px;
}

.xpbar{
  height:12px;
  background:#ddd;
  border-radius:99px;
  overflow:hidden;
  margin:10px 0;
}

.xpfill{
  height:100%;
  background:#3E63C7;
  width:0;
}

.training-progress{
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.exercise-feedback{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#eef2ff;
}

.exercise-feedback h3{
  text-align:left;
  margin-top:0;
}

.improvement{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.success-message{
  background:#e8f5e9;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.muted{
  color:#666;
  font-size:14px;
}

.config-help{
  background:#f7f7f7;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:600px){

  .skill-grid,
  .row{
    grid-template-columns:1fr;
  }

  .topbar{
    display:block;
  }

  .topbar select{
    max-width:none;
  }

  body{
    padding:20px 12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <label for="idioma">
      Idioma
    </label>

    <select
      id="idioma"

  <!-- CONFIGURACIÓN -->

      Configura tu negociación

    <div

      Puedes escribir solo el objetivo.
      Si dejas el artículo vacío,

      Ejemplo:
      <strong>
        Quiero comprar una casa por $1,000,000
      </strong>
    </div>


    <label id="lblObjetivo">
      ¿Qué quieres conseguir?
    </label>

    <input
      id="objetivo"
      placeholder="Ejemplo: Comprar una casa por $1,000,000"
    >


    <label id="lblArticulo">
      ¿Qué estás negociando?
    </label>

    <input
      id="articulo"
      placeholder="Ejemplo: Una casa"
    >


    <div class="row">

      <div>

        <label id="lblDificultad">
          Dificultad
        </label>

        <select id="dificultad">

          <option value="facil">
            Fácil
          </option>

          <option
            value="media"
            selected
          >
            Media
          </option>

          <option value="dificil">
            Difícil
          </option>

          <option value="experto">
            Experto
          </option>

        </select>

      </div>


      <div>

        <label id="lblTipo">
          Tipo de negociación
        </label>

        <input
          id="tipo"
          placeholder="Ejemplo: Compra, venta, salario"
        >

      </div>

    </div>


    <div class="row">

      <div>

          Presupuesto / límite
        </label>

        <input

      <div>

          Cantidad

    </div>


    <label id="lblContexto">
      Contexto
    </label>

    <textarea
      id="contexto"
      placeholder="Ejemplo: La propiedad lleva 4 meses en venta."
    ></textarea>


    <label id="lblCondiciones">
      Condiciones
    </label>

    <textarea
      id="condiciones"
      placeholder="Ejemplo: Necesito cerrar esta semana."
    ></textarea>


    <button
      id="btnIniciar"
      onclick="iniciarNegociacion()"
    >
      Comenzar negociación
    </button>


    <div id="mensajeInicio"></div>

  </div>


  <!-- NEGOCIACIÓN -->

  <div
    class="card hidden"
    id="negociacion"
  >

    <h2 id="negTitulo">
      Negociación
    </h2>


    <div
      id="chat"
      class="chat"
    ></div>


    <label id="lblRespuesta">
      Tu respuesta
    </label>


    <textarea
      id="respuesta"
      placeholder="Escribe lo que responderías..."
      onkeydown="manejarEnter(event)"
    ></textarea>


    <button
      id="btnEnviar"
      onclick="enviarRespuesta()"
    >
      Enviar respuesta
    </button>


    <button
      id="btnFinalizar"
      class="secondary"
      onclick="finalizarNegociacion()"
    >
      Finalizar negociación
    </button>


    <div id="mensajeRespuesta"></div>

  </div>


  <!-- RESULTADO -->

  <div
    class="card hidden"
    id="resultado"
  >

    <h2 id="resTitulo">
      Resultado
    </h2>


    <div
      class="score"
      id="puntaje"
    ></div>


    <div id="feedback"></div>

    <div id="evaluacion"></div>


    <button
      id="btnEntrenamiento"
      class="training-button hidden"
      onclick="obtenerEntrenamiento()"
    >
      🎯 Entrenar mi habilidad más débil
    </button>


    <div
      id="mensajeEntrenamiento"
    ></div>

  </div>


  <!-- ENTRENAMIENTO -->

  <div
    class="card hidden"
    id="entrenamiento"
  >

    <h2 id="entTitulo">
      🎯 Entrenamiento personalizado
    </h2>


    <div
      id="contenidoEntrenamiento"
    ></div>

  </div>


  <!-- PROGRESO -->

  <div class="card">

    <h2 id="progTitulo">
      Mi progreso
    </h2>


    <p id="estadisticas"></p>


    <div id="xpInfo"></div>


    <button
      class="danger"
      onclick="reiniciar()"
      id="btnReiniciar"
    >
      Reiniciar progreso
    </button>

  </div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";


const XP_NIVELES = [
  0,
  100,
  250,
  450,
  700,
  1000,
  1400,
  1850,
  2400,
  3000
];


let historial = [];

let contador = 0;

let sessionId = null;

let idiomaActual =
  localStorage.getItem(
    "idioma"
  ) || "es";

let entrenamientoActual =
  null;

let ejercicioActual = 0;

let resultadosEjercicios = [];


const $ = id =>
  document.getElementById(id);


function safeParse(
  value,
  fallback
) {

  try {
    return JSON.parse(value);

  } catch {

    return fallback;

  }

}


function esc(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


const t = {

  es: {

    titulo:
      "Práctica de Negociación",

    config:
      "Configura tu negociación",

    help:
      'Puedes escribir solo el objetivo. Si dejas el artículo vacío, la aplicación intentará identificarlo. Ejemplo: <strong>Quiero comprar una casa por $1,000,000</strong>.',

    objetivo:

    dificultad:

      "Ejemplo: La propiedad lleva 4 meses en venta.",

    condiciones:
      "Condiciones",

    condicionesPh:

    iniciar:
      "Comenzar negociación",

    neg:
      "Negociación",

    respuesta:

    respuestaPh:
      "Escribe lo que responderías...",

    enviar:
      "Enviar respuesta",

    finalizar:
      "Finalizar negociación",

    resultado:
      "Resultado",

    entrenar:
      "🎯 Entrenar mi habilidad más débil",

    progreso:
      "Mi progreso",

    reiniciar:
      "Reiniciar progreso",

    preparando:
      "Preparando negociación...",

    respondiendo:
      "El oponente está respondiendo...",

    evaluando:
      "Evaluando negociación...",

    vacio:
      "Por favor escribe algo antes de enviar.",

    sinSesion:
      "No hay una negociación activa."

  },


  en: {

    titulo:
      "Negotiation Practice",

    config:
      "Configure your negotiation",

    help:
      'You can enter only the objective. If you leave the item blank, the app will try to identify it. Example: <strong>I want to buy a house for $1,000,000</strong>.',

    objetivo:

function cambiarIdioma() {

  idiomaActual =
    $("idioma").value;

  localStorage.setItem(
    "idioma",
    idiomaActual
  );

  aplicarIdioma();

}


function aplicarIdioma() {

  const x =
    t[idiomaActual];


  $("titulo").textContent =
    x.titulo;

  $("configTitulo").textContent =
    x.config;

  $("configHelp").innerHTML =
    x.help;

  $("lblObjetivo").textContent =
    x.objetivo;

  $("objetivo").placeholder =
    x.objetivoPh;

  $("lblArticulo").textContent =
    x.articulo;

  $("articulo").placeholder =
    x.articuloPh;

  $("lblDificultad").textContent =
    x.dificultad;

  $("lblTipo").textContent =
    x.tipo;

  $("tipo").placeholder =
    x.tipoPh;

  $("lblPresupuesto").textContent =
    x.presupuesto;

  $("presupuesto").placeholder =
    x.presupuestoPh;

  $("lblCantidad").textContent =
    x.cantidad;

  $("cantidad").placeholder =
    x.cantidadPh;

  $("lblContexto").textContent =
    x.contexto;

  $("contexto").placeholder =
    x.contextoPh;

  $("lblCondiciones").textContent =
    x.condiciones;

  $("condiciones").placeholder =
    x.condicionesPh;

  $("btnIniciar").textContent =
    x.iniciar;

  $("negTitulo").textContent =
    x.neg;

  $("lblRespuesta").textContent =
    x.respuesta;

  $("respuesta").placeholder =
    x.respuestaPh;

  $("btnEnviar").textContent =
    x.enviar;

  $("btnFinalizar").textContent =
    x.finalizar;

  $("resTitulo").textContent =
    x.resultado;

  $("progTitulo").textContent =
    x.progreso;

  $("btnReiniciar").textContent =
    x.reiniciar;

  $("idioma").value =
    idiomaActual;

  actualizarXP();

  actualizarEstadisticas();

}


function cargar() {

  historial =
    safeParse(
      localStorage.getItem(
        "historial"
      ),
      []
    );

  contador =
    Number(
      localStorage.getItem(
        "contador"
      ) || 0
    );

  aplicarIdioma();

}


function xpTotal() {

  return Number(
    localStorage.getItem(
      "xpTotal"
    ) || 0
  );

}


function xpEventos() {

  return safeParse(
    localStorage.getItem(
      "xpEventos"
    ),
    []
  );

}


function ganarXP(
  cantidad
) {

  localStorage.setItem(
    "xpTotal",
    xpTotal() +
      Number(cantidad)
  );

  actualizarXP();

}


function otorgarXPUnico(
  evento,
  cantidad
) {

  const eventos =
    xpEventos();

  if (
    eventos.includes(
      evento
    )
  ) {
    return false;
  }

  eventos.push(
    evento
  );

  localStorage.setItem(
    "xpEventos",
    JSON.stringify(
      eventos
    )
  );

  ganarXP(
    cantidad
  );

  return true;

}


function nivelDeXP(
  xp
) {

  let nivel = 1;

  for (
    let i = 0;
    i < XP_NIVELES.length;
    i++
  ) {

    if (
      xp >=
      XP_NIVELES[i]
    ) {
      nivel =
        i + 1;
    }

  }


  if (
    xp >=
    XP_NIVELES[
      XP_NIVELES.length - 1
    ]
  ) {

    nivel =
      10 +
      Math.floor(
        (
          xp -
          XP_NIVELES[9]
        ) / 600
      );

  }


  return nivel;

}


function rango(
  nivel
) {

  if (
    nivel <= 1
  ) {
    return idiomaActual === "en"
      ? "Beginner"
      : "Novato";
  }

  if (
    nivel === 2
  ) {
    return idiomaActual === "en"
      ? "Apprentice"
      : "Aprendiz";
  }

  if (
    nivel <= 4
  ) {
    return idiomaActual === "en"
      ? "Negotiator"
      : "Negociador";
  }

  if (
    nivel <= 6
  ) {
    return idiomaActual === "en"
      ? "Strategist"
      : "Estratega";
  }

  if (
    nivel <= 8
  ) {
    return idiomaActual === "en"
      ? "Expert"
      : "Experto";
  }

  if (
    nivel <= 10
  ) {
    return idiomaActual === "en"
      ? "Master"
      : "Maestro";
  }

  return idiomaActual === "en"
    ? "Elite"
    : "Élite";

}


function datosNivel() {

  const xp =
    xpTotal();

  const nivel =
    nivelDeXP(
      xp
    );


  if (
    nivel >= 10
  ) {

    const base =
      XP_NIVELES[9];

    const progreso =
      xp - base;

    const actual =
      progreso % 600;

    return {
      nivel,
      xp,
      actual,
      siguiente: 600,
      restante:
        600 - actual
    };

  }


  const actual =
    XP_NIVELES[
      nivel - 1
    ];

  const siguiente =
    XP_NIVELES[nivel] ??
    actual + 600;


  return {
    nivel,
    xp,
    actual:
      xp - actual,
    siguiente:
      siguiente - actual,
    restante:
      siguiente - xp
  };

}


function actualizarXP() {

  const d =
    datosNivel();


  const porcentaje =
    Math.max(
      0,
      Math.min(
        100,
        (
          d.actual /
          d.siguiente
        ) * 100
      )
    );


  $("xpInfo").innerHTML = `

    <strong>XP:</strong>
    ${d.xp}

    &nbsp;

    <strong>
      ${
        idiomaActual === "en"
          ? "Level"
          : "Nivel"
      }:
    </strong>

    ${d.nivel}

    &nbsp;

    <strong>
      ${
        idiomaActual === "en"
          ? "Rank"
          : "Rango"
      }:
    </strong>

    ${rango(d.nivel)}

    <div class="xpbar">
      <div
        class="xpfill"
        style="width:${porcentaje}%"
      ></div>
    </div>

    <span class="muted">

      ${d.restante}

      XP

      ${
        idiomaActual === "en"
          ? "to next level"
          : "para el siguiente nivel"
      }

    </span>
  `;

}


async function api(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      options
    );


  const data =
    await response
      .json()
      .catch(
        () => ({})
      );


  if (
    !response.ok
  ) {

    throw new Error(
      data.error ||
      `Error HTTP ${response.status}`
    );

  }


  return data;

}


function addOpponent(
  texto
) {

  $("chat")
    .insertAdjacentHTML(
      "beforeend",

      `
      <div class="oponente">

        <strong>
          🤖
          ${
            idiomaActual === "en"
              ? "Opponent"
              : "Oponente"
          }:
        </strong>

        <br>

        ${esc(texto)}

      </div>
      `
    );


  $("chat").scrollTop =
    $("chat").scrollHeight;

}


function addUser(
  texto
) {

  $("chat")
    .insertAdjacentHTML(
      "beforeend",

      `
      <div class="usuario">

        <strong>
          🧑
          ${
            idiomaActual === "en"
              ? "You"
              : "Tú"
          }:
        </strong>

        <br>

        ${esc(texto)}

      </div>
      `
    );


  $("chat").scrollTop =
    $("chat").scrollHeight;

}


async function iniciarNegociacion() {

  const x =
    t[idiomaActual];


  const objetivo =
    $("objetivo")
      .value
      .trim();


  if (!objetivo) {

    $("mensajeInicio")
      .innerHTML = `

      <div class="mensaje">

        ${
          idiomaActual === "en"
            ? "Enter your objective."
            : "Escribe tu objetivo."
        }

      </div>

      `;

    return;

  }


  const btn =
    $("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    x.preparando;


  try {

    const params =
      new URLSearchParams({

        accion:
          "frase",

        objetivo,

        articulo:
          $("articulo")
            .value
            .trim(),

        dificultad:
          $("dificultad")
            .value,

        tipo:
          $("tipo")
            .value
            .trim(),

        presupuesto:
          $("presupuesto")
            .value
            .trim(),

        cantidad:
          $("cantidad")
            .value
            .trim(),

        contexto:
          $("contexto")
            .value
            .trim(),

        condiciones:
          $("condiciones")
            .value
            .trim(),

        idioma:
          idiomaActual

      });


    const data =
      await api(
        API_URL +
        "?" +
        params.toString()
      );


    sessionId =
      data.sessionId;


    historial = [
      {
        rol:
          "oponente",

        texto:
          data.respuesta
      }
    ];


    $("chat").innerHTML =
      "";


    addOpponent(
      data.respuesta
    );


    $("configuracion")
      .classList
      .add("hidden");


    $("resultado")
      .classList
      .add("hidden");


    $("entrenamiento")
      .classList
      .add("hidden");


    $("negociacion")
      .classList
      .remove("hidden");


    $("respuesta")
      .focus();


    $("mensajeInicio")
      .innerHTML =
      "";

  } catch (
    error
  ) {

    $("mensajeInicio")
      .innerHTML = `

      <div class="mensaje">

        ${esc(error.message)}

      </div>

      `;

  } finally {

    btn.disabled =
      false;

    btn.textContent =
      x.iniciar;

  }

}


async function enviarRespuesta() {

  const x =
    t[idiomaActual];


  const texto =
    $("respuesta")
      .value
      .trim();


  if (!texto) {

    $("mensajeRespuesta")
      .innerHTML = `

      <div class="mensaje">

        ${x.vacio}

      </div>

      `;

    return;

  }


  if (!sessionId) {

    $("mensajeRespuesta")
      .innerHTML = `

      <div class="mensaje">

        ${x.sinSesion}

      </div>

      `;

    return;

  }


  $("mensajeRespuesta")
    .innerHTML =
    "";


  addUser(
    texto
  );


  historial.push({
    rol:
      "usuario",

    texto
  });


  $("respuesta")
    .value =
    "";


  const btn =
    $("btnEnviar");

  btn.disabled =
    true;

  btn.textContent =
    x.respondiendo;


  try {

    const data =
      await api(

        API_URL +
        "?accion=continuar&sessionId=" +
        encodeURIComponent(
          sessionId
        ),

        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              historial,

              idioma:
                idiomaActual

            })

        }

      );


    historial.push({

      rol:
        "oponente",

      texto:
        data.respuesta

    });


    addOpponent(
      data.respuesta
    );


  } catch (
    error
  ) {

    $("mensajeRespuesta")
      .innerHTML = `

      <div class="mensaje">

        ${esc(error.message)}

      </div>

      `;


    historial.pop();

  } finally {

    btn.disabled =
      false;

    btn.textContent =
      x.enviar;

  }

}


function manejarEnter(

function mostrarEvaluacion(
  evaluacion
) {

  const contenedor =
    $("evaluacion");


  if (!evaluacion) {

    contenedor.innerHTML =
      "";

    return;

  }


  const nombres = {

    preparacion:
      "Preparación",

    anclaje:
      "Anclaje",

    preguntas:
      "Preguntas",

    argumentacion:
      "Argumentación",

    manejoPresion:
      "Manejo de presión",

    concesiones:
      "Concesiones",

    cierre:
      "Cierre"

  };


  let html = "";


  if (
    evaluacion
      .habilidadMasDebil
  ) {

    html += `

      <div class="mensaje">

        <strong>
          🎯
          ${
            idiomaActual === "en"
              ? "Weakest skill"
              : "Tu habilidad más débil"
          }:
        </strong>

        <br>

        ${esc(
          evaluacion
            .habilidadMasDebil
            .nombre
        )}

        (
        ${
          evaluacion
            .habilidadMasDebil
            .puntaje
        }/100
        )

      </div>

    `;

  }


  html += `
    <h3>Habilidades</h3>
    <div class="skill-grid">
  `;


  for (
    const key in nombres
  ) {

    const score =
      Number(
        evaluacion
          .habilidades?.[
            key
          ] || 0
      );


    const weak =
      evaluacion
        .habilidadMasDebil
        ?.clave === key;


    html += `

      <div
        class="skill
        ${
          weak
            ? "debil"
            : ""
        }"
      >

        <strong>
          ${nombres[key]}
        </strong>

        ${score}/100

        ${
          weak
            ? " 🎯"
            : ""
        }

      </div>

    `;

  }


  html +=
    "</div>";


  if (
    evaluacion.queHizoBien
      ?.length
  ) {

    html += `

      <h3>
        ✅
        ${
          idiomaActual === "en"
            ? "What you did well"
            : "Qué hiciste bien"
        }
      </h3>

      <ul>

        ${evaluacion
          .queHizoBien
          .map(
            x =>
              `<li>${esc(x)}</li>`
          )
          .join("")}

      </ul>

    `;

  }


  if (
    evaluacion.queHizoMal
      ?.length
  ) {

    html += `

      <h3>
        ❌
        ${
          idiomaActual === "en"
            ? "What to improve"
            : "Qué debes mejorar"
        }
      </h3>

      <ul>

        ${evaluacion
          .queHizoMal
          .map(
            x =>
              `<li>${esc(x)}</li>`
          )
          .join("")}

      </ul>

    `;

  }


  if (
    evaluacion.mayorError
  ) {

    html += `

      <h3>
        ⚠️
        ${
          idiomaActual === "en"
            ? "Main error"
            : "Mayor error"
        }
      </h3>

      <p>
        ${esc(
          evaluacion.mayorError
        )}
      </p>

    `;

  }


  if (
    evaluacion.consejo
  ) {

    html += `

      <h3>
        💡
        ${
          idiomaActual === "en"
            ? "Next step"
            : "Consejo"
        }
      </h3>

      <p>
        ${esc(
          evaluacion.consejo
        )}
      </p>

    `;

  }


  contenedor.innerHTML =
    html;

}

async function evaluarEjercicio() {

  const respuesta =
    $("respuestaEjercicio")
      .value
      .trim();


  if (!respuesta) {

    $("mensajeEjercicio")
      .innerHTML = `

      <div class="mensaje">

        ${
          idiomaActual === "en"
            ? "Write a response first."
            : "Escribe una respuesta antes de continuar."
        }

      </div>

      `;

    return;

  }


  const btn =
    $("btnResponderEjercicio");

  btn.disabled =
    true;

  btn.textContent =
    "Evaluando...";


  try {

    const ejercicio =
      entrenamientoActual
        .ejercicios[
          ejercicioActual
        ];


    const data =
      await api(

        API_URL +
        "?accion=ejercicio&sessionId=" +
        encodeURIComponent(
          sessionId
        ),

        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              numeroEjercicio:
                Number(
                  ejercicio.numero
                ),

              respuesta

            })

        }

      );


    resultadosEjercicios
      .push(
        data.resultado
      );


    otorgarXPUnico(
      `ejercicio:${sessionId}:${ejercicio.numero}`,
      15
    );


    mostrarFeedbackEjercicio(
      data.resultado
    );


  } catch (
    error
  ) {

    $("mensajeEjercicio")
      .innerHTML = `

      <div class="mensaje">

        ${esc(
          error.message
        )}

      </div>

      `;


    btn.disabled =
      false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}

                  )}
                </p>

              </div>

            `

            : ""
        }

      </div>

      `;


    actualizarXP();


  } catch (
    error
  ) {

    $("resultadoReto")
      .innerHTML = `

      <div class="mensaje">

        ${esc(
          error.message
        )}

      </div>

      `;

  } finally {

    btn.disabled =
      false;

    btn.textContent =
      "Evaluar reto final";

  }

}


function manejarEnterReto(
  event
) {

  if (
    event.key ===
      "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarRetoFinal();

  }

}


function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  const resultados =
    safeParse(
      localStorage.getItem(
        "resultados"
      ),
      []
    );


  resultados.push({

    fecha:
      new Date()
        .toISOString(),

    puntaje,

    evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(
      resultados
    )
  );

}


function actualizarEstadisticas() {

  const resultados =
    safeParse(
      localStorage.getItem(
        "resultados"
      ),
      []
    );


  if (
    !resultados.length
  ) {

    $("estadisticas")
      .innerHTML =
      idiomaActual === "en"

        ? "Negotiations: 0<br>Average: 0/100"

        : "Negociaciones: 0<br>Promedio: 0/100";

    return;

  }


  const promedio =
    Math.round(

      resultados.reduce(
        (
          total,
          resultado
        ) =>
          total +
          Number(
            resultado
              .puntaje ||
            0
          ),
        0
      ) /
        resultados.length *
        10

    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        resultado =>
          resultado.puntaje
      )
      .join(", ");


  $("estadisticas")
    .innerHTML = `

      <strong>

        ${
          idiomaActual === "en"
            ? "Negotiations"
            : "Negociaciones"
        }:

      </strong>

      ${resultados.length}

      <br>

      <strong>

        ${
          idiomaActual === "en"
            ? "Average"
            : "Promedio"
        }:

      </strong>

      ${promedio}/100

      <br>

      <strong>

        ${
          idiomaActual === "en"
            ? "Latest scores"
            : "Últimos resultados"
        }:

      </strong>

      ${ultimos}

    `;

}


function reiniciar() {

  const confirmar =
    confirm(

      idiomaActual === "en"

        ? "Reset negotiations, results and training? XP, level and rank will be preserved."

        : "¿Borrar negociaciones, resultados y entrenamiento? Tu XP, nivel y rango se conservarán."

    );


  if (!confirmar) {
    return;
  }


  [
    "historial",
    "contador",
    "resultados",
    "ultimoEntrenamiento",
    "retosFinales"
  ]
    .forEach(
      key =>
        localStorage.removeItem(
          key
        )
    );


  historial = [];

  contador = 0;

  sessionId = null;

  entrenamientoActual =
    null;

  ejercicioActual = 0;

  resultadosEjercicios =
    [];


  $("chat")
    .innerHTML =
    "";


  $("configuracion")
    .classList
    .remove("hidden");


  $("negociacion")
    .classList
    .add("hidden");


  $("resultado")
    .classList
    .add("hidden");


  $("entrenamiento")
    .classList
    .add("hidden");


  actualizarEstadisticas();

  actualizarXP();

}


$("idioma").value =
  idiomaActual;

cargar();

</script>

</body>
</html>
