<script>

/* =========================
   API
========================= */

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";


/* =========================
   VARIABLES
========================= */

let historial = [];

let contador = 0;

let sessionId = null;

let idiomaActual = "es";

let entrenamientoActual = null;

let ejercicioActual = 0;

let resultadosEjercicios = [];


/* =========================
   XP / PROGRESO
========================= */

let xp = Number(
  localStorage.getItem("xp") || 0
);

let nivelAnterior =
  Number(
    localStorage.getItem("nivel") || 1
  );

let negociacionesXP =
  Number(
    localStorage.getItem("negociacionesXP") || 0
  );

let ejerciciosXP =
  Number(
    localStorage.getItem("ejerciciosXP") || 0
  );

let retosXP =
  Number(
    localStorage.getItem("retosXP") || 0
  );

let xpSesiones =
  JSON.parse(
    localStorage.getItem("xpSesiones") || "[]"
  );


/* =========================
   CONFIGURACIÓN XP
========================= */

const XP_POR_NEGOCIACION = 50;

const XP_POR_EJERCICIO = 15;

const XP_RETO_SUPERADO = 100;

const XP_RETO_NO_SUPERADO = 40;


/* =========================
   RANGOS
========================= */

function obtenerNivel(xpActual) {

  return Math.floor(
    xpActual / 100
  ) + 1;

}


function obtenerXPInicioNivel(nivel) {

  return (
    (nivel - 1) * 100
  );

}


function obtenerRango(nivel) {

  if (nivel >= 20) {
    return "Maestro de Negociación";
  }

  if (nivel >= 15) {
    return "Estratega";
  }

  if (nivel >= 10) {
    return "Experto";
  }

  if (nivel >= 7) {
    return "Negociador Avanzado";
  }

  if (nivel >= 4) {
    return "Negociador";
  }

  if (nivel >= 2) {
    return "Aprendiz";
  }

  return "Principiante";

}


function obtenerXPParaSiguienteNivel(
  nivel
) {

  return nivel * 100;

}


/* =========================
   GUARDAR XP
========================= */

function guardarXP() {

  localStorage.setItem(
    "xp",
    xp
  );

  localStorage.setItem(
    "nivel",
    obtenerNivel(xp)
  );

  localStorage.setItem(
    "negociacionesXP",
    negociacionesXP
  );

  localStorage.setItem(
    "ejerciciosXP",
    ejerciciosXP
  );

  localStorage.setItem(
    "retosXP",
    retosXP
  );

  localStorage.setItem(
    "xpSesiones",
    JSON.stringify(xpSesiones)
  );

}


/* =========================
   AGREGAR XP
========================= */

function agregarXP(
  cantidad,
  motivo,
  identificador = null
) {

  if (
    identificador &&
    xpSesiones.includes(identificador)
  ) {

    return false;

  }

  const nivelAntes =
    obtenerNivel(xp);

  xp += Number(cantidad || 0);

  if (identificador) {

    xpSesiones.push(
      identificador
    );

  }

  const nivelDespues =
    obtenerNivel(xp);

  if (motivo === "negociacion") {
    negociacionesXP++;
  }

  if (motivo === "ejercicio") {
    ejerciciosXP++;
  }

  if (motivo === "reto") {
    retosXP++;
  }

  guardarXP();

  actualizarProgreso();

  if (
    nivelDespues > nivelAntes
  ) {

    mostrarSubidaNivel(
      nivelDespues
    );

  }

  return true;

}


/* =========================
   SUBIDA DE NIVEL
========================= */

function mostrarSubidaNivel(
  nivel
) {

  const contenedor =
    document.getElementById(
      "recompensasXP"
    );

  contenedor.innerHTML = `

    <div class="level-up">

      🎉 <strong>¡SUBISTE DE NIVEL!</strong>

      <br><br>

      Ahora eres:

      <br>

      <strong>
        Nivel ${nivel}
      </strong>

      <br>

      ${obtenerRango(nivel)}

    </div>

  `;

}


/* =========================
   ACTUALIZAR PROGRESO
========================= */

function actualizarProgreso() {

  const nivel =
    obtenerNivel(xp);

  const rango =
    obtenerRango(nivel);

  const inicioNivel =
    obtenerXPInicioNivel(nivel);

  const siguienteNivel =
    obtenerXPParaSiguienteNivel(nivel);

  const xpDentroNivel =
    xp - inicioNivel;

  const xpNecesaria =
    siguienteNivel - inicioNivel;

  let porcentaje =
    (
      xpDentroNivel /
      xpNecesaria
    ) * 100;

  if (porcentaje < 0) {
    porcentaje = 0;
  }

  if (porcentaje > 100) {
    porcentaje = 100;
  }

  document.getElementById(
    "nivelActual"
  ).textContent =
    "Nivel " + nivel;

  document.getElementById(
    "rangoActual"
  ).textContent =
    rango;

  document.getElementById(
    "xpActual"
  ).textContent =
    xp + " XP";

  document.getElementById(
    "barraXP"
  ).style.width =
    porcentaje + "%";

  const faltante =
    siguienteNivel - xp;

  document.getElementById(
    "xpSiguiente"
  ).textContent =
    faltante > 0
      ? faltante +
        " XP para el siguiente nivel"
      : "¡Nivel completado!";

  const nivelGuardado =
    Number(
      localStorage.getItem("nivel") || 1
    );

  if (
    nivel > nivelGuardado
  ) {

    localStorage.setItem(
      "nivel",
      nivel
    );

  }

  actualizarEstadisticas();

}


/* =========================
   CARGAR PROGRESO
========================= */

historial =
JSON.parse(
  localStorage.getItem("historial") || "[]"
);

contador =
Number(
  localStorage.getItem("contador") || 0
);

actualizarProgreso();


/* =========================
   OBTENER IDIOMA
========================= */

function obtenerIdioma() {

  return document
    .getElementById("idioma")
    .value;

}


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  const objetivo =
    document
      .getElementById("objetivo")
      .value
      .trim();

  const articulo =
    document
      .getElementById("articulo")
      .value
      .trim();

  const dificultad =
    document
      .getElementById("dificultad")
      .value;

  const dificultadWorker =
    dificultad === "media"
      ? "medio"
      : dificultad;

  const tipo =
    document
      .getElementById("tipo")
      .value
      .trim();

  const presupuesto =
    document
      .getElementById("presupuesto")
      .value
      .trim();

  const cantidad =
    document
      .getElementById("cantidad")
      .value
      .trim();

  const contexto =
    document
      .getElementById("contexto")
      .value
      .trim();

  const condiciones =
    document
      .getElementById("condiciones")
      .value
      .trim();

  idiomaActual =
    obtenerIdioma();

  if (!objetivo || !articulo) {

    document.getElementById(
      "mensajeInicio"
    ).innerHTML = `
      <div class="mensaje">
        Escribe el objetivo y lo que estás negociando.
      </div>
    `;

    return;

  }

  const btn =
    document.getElementById("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";

  document.getElementById(
    "mensajeInicio"
  ).innerHTML = "";

  try {

    const url =
      API_URL +
      "?accion=frase" +
      "&objetivo=" +
      encodeURIComponent(objetivo) +
      "&articulo=" +
      encodeURIComponent(articulo) +
      "&dificultad=" +
      encodeURIComponent(dificultadWorker) +
      "&tipo=" +
      encodeURIComponent(tipo) +
      "&presupuesto=" +
      encodeURIComponent(presupuesto) +
      "&cantidad=" +
      encodeURIComponent(cantidad) +
      "&contexto=" +
      encodeURIComponent(contexto) +
      "&condiciones=" +
      encodeURIComponent(condiciones) +
      "&idioma=" +
      encodeURIComponent(idiomaActual);

    console.log(
      "Idioma seleccionado:",
      idiomaActual
    );

    console.log(
      "URL enviada:",
      url
    );

    const respuesta =
      await fetch(url);

    const datos =
      await respuesta.json();

    console.log(
      "Respuesta del Worker:",
      datos
    );

    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo iniciar la negociación."
      );

    }

    if (!datos.respuesta) {

      throw new Error(
        "El Worker no devolvió una respuesta de Gemini."
      );

    }

    sessionId =
      datos.sessionId;

    historial = [];

    document.getElementById(
      "chat"
    ).innerHTML = "";

    agregarOponente(
      datos.respuesta
    );

    document.getElementById(
      "configuracion"
    ).classList.add("hidden");

    document.getElementById(
      "resultado"
    ).classList.add("hidden");

    document.getElementById(
      "entrenamiento"
    ).classList.add("hidden");

    document.getElementById(
      "evolucion"
    ).classList.add("hidden");

    document.getElementById(
      "negociacion"
    ).classList.remove("hidden");

  } catch (error) {

    console.error(
      "Error iniciando:",
      error
    );

    document.getElementById(
      "mensajeInicio"
    ).innerHTML = `
      <div class="mensaje">
        <strong>Error:</strong>
        ${error.message}
      </div>
    `;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   OPONENTE
========================= */

function agregarOponente(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `
    <div class="oponente">
      <strong>🤖 Oponente:</strong>
      <br>
      ${texto}
    </div>
  `;

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   USUARIO
========================= */

function agregarUsuario(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML += `
    <div class="usuario">
      <strong>🧑 Tú:</strong>
      <br>
      ${texto}
    </div>
  `;

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  const textarea =
    document.getElementById("respuesta");

  const texto =
    textarea.value.trim();

  if (!texto) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML = `
      <div class="mensaje">
        Por favor escribe algo antes de enviar.
      </div>
    `;

    return;

  }

  if (!sessionId) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML = `
      <div class="mensaje">
        No hay una negociación activa.
      </div>
    `;

    return;

  }

  agregarUsuario(texto);

  historial.push({
    rol: "usuario",
    texto: texto
  });

  textarea.value = "";

  const btn =
    document.getElementById("btnEnviar");

  btn.disabled = true;

  btn.textContent =
    "El oponente está respondiendo...";

  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=continuar" +
        "&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            historial: historial,
            idioma: idiomaActual
          })
        }
      );

    const datos =
      await respuesta.json();

    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo continuar."
      );

    }

    if (!datos.respuesta) {

      throw new Error(
        "El Worker no devolvió respuesta."
      );

    }

    historial.push({
      rol: "oponente",
      texto: datos.respuesta
    });

    agregarOponente(
      datos.respuesta
    );

  } catch (error) {

    console.error(error);

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML = `
      <div class="mensaje">
        <strong>Error:</strong>
        ${error.message}
      </div>
    `;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event) {

  if (

async function finalizarNegociacion() {

  if (!sessionId) {
    return;
  }

  const btn =
    document.getElementById(
      "btnFinalizar"
    );

  btn.disabled = true;

  btn.textContent =
    "Evaluando negociación...";

  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evaluar" +
        "&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            historial: historial,
            idioma: idiomaActual
          })
        }
      );

    const datos =
      await respuesta.json();

    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar."
      );

    }

    mostrarResultado(
      datos.puntaje,
      datos.feedback,
      datos.evaluacion
    );

  } catch (error) {

    alert(
      "Error al evaluar: " +
      error.message
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   RESULTADO
========================= */

function mostrarResultado(
  puntaje,
  feedback,
  evaluacion
) {

  document.getElementById(
    "negociacion"
  ).classList.add("hidden");

  document.getElementById(
    "resultado"
  ).classList.remove("hidden");

  document.getElementById(
    "puntaje"
  ).textContent =
    puntaje + "/100";

  document.getElementById(
    "feedback"
  ).innerHTML = `
    <div class="mensaje">
      ${feedback || ""}
    </div>
  `;

  mostrarEvaluacion(evaluacion);

  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );

  if (
    evaluacion &&
    evaluacion.habilidadMasDebil
  ) {

    boton.classList.remove("hidden");

    boton.textContent =
      "🎯 Entrenar " +
      evaluacion.habilidadMasDebil.nombre;

  } else {

    boton.classList.add("hidden");

  }

  contador++;

  historialResultadosGuardar(
    puntaje,
    evaluacion
  );

  /*
    XP POR COMPLETAR NEGOCIACIÓN

    Se utiliza sessionId para impedir
    que una misma negociación dé XP
    dos veces.
  */

  const xpGanado =
    agregarXP(
      XP_POR_NEGOCIACION,
      "negociacion",
      "negociacion_" + sessionId
    );

  if (xpGanado) {

    document.getElementById(
      "xpRecompensaResultado"
    ).innerHTML = `

      <div class="xp-reward">

        ⭐ +${XP_POR_NEGOCIACION} XP
        por completar la negociación

      </div>

    `;

  }

  actualizarProgreso();

}


/* =========================
   EVALUACIÓN
========================= */

function mostrarEvaluacion(evaluacion) {

  const contenedor =
    document.getElementById(
      "evaluacion"
    );

  if (!evaluacion) {

    contenedor.innerHTML = "";

    return;

  }

  let html = "";

  if (
    evaluacion.habilidadMasDebil
  ) {

    html += `
      <div class="mensaje">

        <strong>
          🎯 Habilidad más débil:
        </strong>

        <br>

        ${evaluacion.habilidadMasDebil.nombre}

        (${evaluacion.habilidadMasDebil.puntaje}/100)

      </div>
    `;

  }

  if (evaluacion.habilidades) {

    html += "<h3>Habilidades</h3>";

    html +=
      '<div class="skill-grid">';

    const habilidades = {

      preparacion:
        "Preparación",

      anclaje:
        "Anclaje",

      preguntas:
        "Preguntas",

      argumentacion:
        "Argumentación",

      manejoPresion:
        "Manejo de presión",

      concesiones:
        "Concesiones",

      cierre:
        "Cierre"

    };

    for (
      const clave in habilidades
    ) {

      const valor =
        evaluacion.habilidades[clave] ?? 0;

      const debil =
        evaluacion.habilidadMasDebil &&
        evaluacion.habilidadMasDebil.clave ===
          clave;

      html += `
        <div class="skill ${
          debil ? "debil" : ""
        }">

          <strong>
            ${habilidades[clave]}
          </strong>

          ${valor}/100

          ${debil ? " 🎯" : ""}

        </div>
      `;

    }

    html += "</div>";

  }

  if (
    evaluacion.queHizoBien?.length
  ) {

    html += `
      <h3>✅ Qué hiciste bien</h3>
      <ul>
    `;

    evaluacion.queHizoBien.forEach(
      item => {

        html +=
          `<li>${item}</li>`;

      }
    );

    html += "</ul>";

  }

  if (
    evaluacion.queHizoMal?.length
  ) {

    html += `
      <h3>❌ Qué debes mejorar</h3>
      <ul>
    `;

    evaluacion.queHizoMal.forEach(
      item => {

        html +=
          `<li>${item}</li>`;

      }
    );

    html += "</ul>";

  }

  if (evaluacion.mayorError) {

    html += `
      <h3>⚠️ Mayor error</h3>
      <p>${evaluacion.mayorError}</p>
    `;

  }

  if (evaluacion.deberiaMejorar) {

    html += `
      <h3>📈 Debes mejorar</h3>
      <p>${evaluacion.deberiaMejorar}</p>
    `;

  }

  if (evaluacion.consejo) {

    html += `
      <h3>💡 Consejo</h3>
      <p>${evaluacion.consejo}</p>
    `;

  }

  contenedor.innerHTML =
    html;

}

/* =========================
   EVALUAR EJERCICIO
========================= */

async function evaluarEjercicio() {

  if (!sessionId) {
    return;
  }

  const textarea =
    document.getElementById(
      "respuestaEjercicio"
    );

  const respuesta =
    textarea.value.trim();

  if (!respuesta) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML = `
      <div class="mensaje">
        Escribe una respuesta.
      </div>
    `;

    return;

  }

  const ejercicios =
    entrenamientoActual.ejercicios || [];

  const ejercicio =
    ejercicios[ejercicioActual];

  const btn =
    document.getElementById(
      "btnResponderEjercicio"
    );

  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";

  try {

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=ejercicio" +
        "&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            numeroEjercicio:
              Number(
                ejercicio.numero
              ),

            respuesta:
              respuesta,

            idioma:
              idiomaActual

          })
        }
      );

    const datos =
      await respuestaAPI.json();

    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el ejercicio."
      );

    }

    const resultado =
      datos.resultado;

    resultadosEjercicios.push(
      resultado
    );

    /*
      XP POR EJERCICIO

      Cada ejercicio evaluado
      correctamente otorga 15 XP.
    */

    const identificador =
      "ejercicio_" +
      sessionId +
      "_" +
      Number(
        ejercicio.numero ||
        ejercicioActual + 1
      );

    const xpGanado =
      agregarXP(
        XP_POR_EJERCICIO,
        "ejercicio",
        identificador
      );

    mostrarFeedbackEjercicio(
      resultado,
      xpGanado
    );

  } catch (error) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML = `
      <div class="mensaje">
        Error: ${error.message}
      </div>
    `;

    btn.disabled = false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}

function mostrarResumenEntrenamiento() {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );

  let promedio = 0;

  if (
    resultadosEjercicios.length
  ) {

    const suma =
      resultadosEjercicios.reduce(
        (total, resultado) =>
          total +
          Number(
            resultado.puntaje || 0
          ),
        0
      );

    promedio =
      Math.round(
        (
          suma /
          resultadosEjercicios.length
        ) * 10
      ) / 10;

  }

  let html = `
    <div class="success-message">

      <h3>
        🎉 Entrenamiento completado
      </h3>

      <p>
        Completaste
        ${resultadosEjercicios.length}
        ejercicios.
      </p>

      <p>

        <strong>
          Promedio:
        </strong>

        ${promedio}/100

      </p>

    </div>
  `;

  if (
    entrenamientoActual.retoFinal
  ) {

    const reto =
      entrenamientoActual.retoFinal;

    html += `
      <div class="challenge">

        <h2>🏆 Reto Final</h2>

        <h3>
          ${reto.titulo || ""}

        <p>

          <strong>
            Situación:

        </p>

        <p>

          <strong>
            Instrucción:
          </strong>

          <br>

          ${reto.instruccion || ""}

        </p>

        <p>

          <strong>
            Criterio de éxito:
          </strong>

          <br>

          ${reto.criterioExito || ""}

        </p>

        <label style="color:white;">
          Tu respuesta
        </label>

        <textarea
          id="respuestaRetoFinal"
          placeholder="Escribe tu respuesta..."
          onkeydown="manejarEnterReto(event)"

        <button
          id="btnRetoFinal"

        </strong>

        <br>

        ${resultado.consejo}

      </p>
    `;

  }

  html += "</div>";

  contenedor.innerHTML =
    html;

  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   ENTER RETO
========================= */

function manejarEnterReto(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarRetoFinal();

  }

}


/* =========================
   GUARDAR RETO
========================= */

function guardarRetoFinal(
  resultado
) {

  const retos =
    JSON.parse(
      localStorage.getItem(
        "retosFinales"
      ) || "[]"
    );

  retos.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      Number(
        resultado?.puntaje || 0
      ),

    superado:
      !!resultado?.superado

  });

  localStorage.setItem(
    "retosFinales",
    JSON.stringify(retos)
  );

}


/* =========================
   EVOLUCIÓN
========================= */

async function cargarEvolucion() {

  if (!sessionId) {
    return;
  }

  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evolucion" +
        "&sessionId=" +
        encodeURIComponent(sessionId)
      );

    const datos =
      await respuesta.json();

    if (!respuesta.ok) {
      return;
    }

    mostrarEvolucion(
      datos.evolucion
    );

  } catch (error) {

    console.log(
      "No se pudo cargar evolución:",
      error
    );

  }

}


/* =========================
   MOSTRAR EVOLUCIÓN
========================= */

function mostrarEvolucion(
  evolucion
) {

  const contenedor =
    document.getElementById(
      "contenidoEvolucion"
    );

  if (
    !evolucion ||
    !Object.keys(evolucion).length
  ) {

    contenedor.innerHTML = `
      <div class="mensaje">
        Todavía no hay suficiente historial
        para mostrar evolución.
      </div>
    `;

    document.getElementById(
      "evolucion"
    ).classList.remove("hidden");

    return;
  }

  const nombres = {

    preparacion:
      "Preparación",

    anclaje:
      "Anclaje",

    preguntas:
      "Preguntas",

    argumentacion:
      "Argumentación",

    manejoPresion:
      "Manejo de presión",

    concesiones:
      "Concesiones",

    cierre:
      "Cierre"

  };

  let html = "";

  for (
    const clave in evolucion
  ) {

    const valores =
      evolucion[clave];

    if (
      !Array.isArray(valores) ||
      !valores.length
    ) {
      continue;
    }

    const numeros =
      valores.map(
        item =>
          Number(
            item.puntaje || 0
          )
      );

    html += `
      <div class="evolution-item">

        <strong>
          ${nombres[clave] || clave}
        </strong>

        <div class="evolution-values">
          ${numeros.join(" → ")}
        </div>

      </div>
    `;

  }

  if (!html) {

    html = `
      <div class="mensaje">
        Todavía no hay evolución registrada.
      </div>
    `;

  }

  contenedor.innerHTML =
    html;

  document.getElementById(
    "evolucion"
  ).classList.remove("hidden");

}


/* =========================
   GUARDAR RESULTADO
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );

  resultados.push({

  );

  );

  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );

  const retos =
    JSON.parse(
      localStorage.getItem(
        "retosFinales"
      ) || "[]"
    );

  const nivel =
    obtenerNivel(xp);

  const rango =
    obtenerRango(nivel);

  let html = `

    <div class="xp-grid">

      <div class="xp-stat">

        <strong>
          ⭐ XP total
        </strong>

        ${xp} XP

      </div>

      <div class="xp-stat">

        <strong>
          🆙 Nivel
        </strong>

        ${nivel}

      </div>

      <div class="xp-stat">

        <strong>
          🏆 Rango
        </strong>

        ${rango}

      </div>

      <div class="xp-stat">

        <strong>
          🎯 Actividades con XP
        </strong>

        ${
          negociacionesXP +
          ejerciciosXP +
          retosXP
        }

      </div>

    </div>

  `;

  if (!resultados.length) {

    html += `

      <br>

      <strong>
        Negociaciones:
      </strong>

      0

      <br>

      <strong>
        Promedio:
      </strong>

      0/100

      <br>

      <strong>
        Retos finales:
      </strong>

      ${retos.length}

    `;

    document.getElementById(
      "estadisticas"
    ).innerHTML =
      html;

    return;

  }

  const suma =
    resultados.reduce(
      (
        total,
        resultado
      ) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );

  const promedio =
    Math.round(
      (
        suma /
        resultados.length
      ) * 10
    ) / 10;

  const superados =
    retos.filter(
      reto =>
        reto.superado
    ).length;

  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        resultado =>
          resultado.puntaje
      )
      .join(", ");

  html += `

    <br>

    <strong>
      Negociaciones:
    </strong>

    ${resultados.length}

    <br>

    <strong>
      Promedio:
    </strong>

    ${promedio}/100

    <br>

    <strong>
      Últimos resultados:
    </strong>

    ${ultimos}

    <br>

    <strong>
      Retos finales:
    </strong>

    ${retos.length}

    <br>

    <strong>
      Retos superados:
    </strong>

    ${superados}

  `;

  document.getElementById(
    "estadisticas"
  ).innerHTML =
    html;

}
