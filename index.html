<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia de Negociación</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
  padding: 40px 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1,
h2,
h3 {
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #3E63C7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.secondary {
  background: #555;
}

.training-button {
  background: #111;
}

.danger {
  background: #b42318;
}

.hidden {
  display: none;
}

.mensaje {
  padding: 12px;
  border-radius: 8px;
  background: #eee;
  margin-top: 15px;
}

.chat {
  margin-top: 20px;
}

.oponente {
  background: #eeeeee;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.usuario {
  background: #dfe8ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.score {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.skill {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
}

.skill strong {
  display: block;
  margin-bottom: 5px;
}

.debil {
  border: 3px solid #3E63C7;
  background: #eef2ff;
}

.training-exercise {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
  border-left: 5px solid #3E63C7;
}

.training-exercise h3 {
  text-align: left;
  margin-top: 0;
}

.training-progress {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.exercise-feedback {
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  background: #eef2ff;
}

.exercise-feedback h3 {
  text-align: left;
  margin-top: 0;
}

.improvement {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.success-message {
  background: #e8f5e9;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.challenge {
  background: #111;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.challenge textarea {
  background: white;
  color: #222;
  margin-top: 10px;
}

.challenge-result {
  background: white;
  color: #222;
  padding: 18px;
  border-radius: 12px;
  margin-top: 20px;
}

.challenge-success {
  background: #e8f5e9;
  color: #1b5e20;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.challenge-failed {
  background: #fff3f3;
  color: #8a1c1c;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.evolution {
  margin-top: 20px;
}

.evolution-item {
  background: #f7f7f7;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.evolution-values {
  font-weight: bold;
  margin-top: 6px;
}

.small {
  font-size: 14px;
  color: #666;
}

ul {
  padding-left: 20px;
}

@media (max-width: 600px) {

  .skill-grid {
    grid-template-columns: 1fr;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 Academia de Negociación</h1>

<!-- CONFIGURACIÓN -->

<div class="card" id="configuracion">

<h2>Configura tu negociación</h2>

<label>Idioma</label>

<select id="idioma">
  <option value="auto">Automático</option>
  <option value="es">Español</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="pt">Português</option>
</select>

<label>¿Qué quieres conseguir?</label>

<input
  id="objetivo"
  placeholder="Ejemplo: Comprar por $1,000"
>

<label>¿Qué estás negociando?</label>

<input
  id="articulo"
  placeholder="Ejemplo: Una computadora"
>

<label>Dificultad</label>

<select id="dificultad">
  <option value="facil">Fácil</option>
  <option value="media" selected>Media</option>
  <option value="dificil">Difícil</option>
  <option value="experto">Experto</option>
</select>

<label>Tipo de negociación</label>

<input
  id="tipo"
  placeholder="Compra, venta, salario, negocio..."
>

<label>Presupuesto</label>

<input
  id="presupuesto"
  placeholder="Opcional"
>

<label>Cantidad</label>

<input
  id="cantidad"
  placeholder="Opcional"
>

<label>Contexto</label>

<textarea
  id="contexto"
  placeholder="Opcional"
></textarea>

<label>Condiciones</label>

<textarea
  id="condiciones"
  placeholder="Opcional"
></textarea>

<button
  id="btnIniciar"
  onclick="iniciarNegociacion()"
>
Comenzar negociación
</button>

<div id="mensajeInicio"></div>

</div>


<!-- NEGOCIACIÓN -->

<div class="card hidden" id="negociacion">

<h2>💬 Negociación</h2>

<div id="chat" class="chat"></div>

<label>Tu respuesta</label>

<textarea
  id="respuesta"
  placeholder="Escribe lo que responderías..."
  onkeydown="manejarEnter(event)"
></textarea>

<button
  id="btnEnviar"
  onclick="enviarRespuesta()"
>
Enviar respuesta
</button>

<button
  id="btnFinalizar"
  class="secondary"
  onclick="finalizarNegociacion()"
>
Finalizar negociación
</button>

<div id="mensajeRespuesta"></div>

</div>


<!-- RESULTADO -->

<div class="card hidden" id="resultado">

<h2>📊 Resultado</h2>

<div class="score" id="puntaje"></div>

<div id="feedback"></div>

<div id="evaluacion"></div>

<button
  id="btnEntrenamiento"
  class="training-button hidden"
  onclick="obtenerEntrenamiento()"
>
🎯 Entrenar mi habilidad más débil
</button>

<div id="mensajeEntrenamiento"></div>

</div>


<!-- ENTRENAMIENTO -->

<div class="card hidden" id="entrenamiento">

<h2>🎯 Entrenamiento personalizado</h2>

<div id="contenidoEntrenamiento"></div>

</div>


<!-- EVOLUCIÓN -->

<div class="card hidden" id="evolucion">

<h2>📈 Evolución de habilidades</h2>

<div id="contenidoEvolucion"></div>

</div>


<!-- PROGRESO -->

<div class="card">

<h2>🏆 Mi progreso</h2>

<div id="estadisticas"></div>

<button
  class="danger"
  onclick="reiniciar()"
>
Reiniciar progreso
</button>

</div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";


let historial = [];
let contador = 0;

let sessionId = null;

let idiomaActual = "es";

let entrenamientoActual = null;

let ejercicioActual = 0;

let resultadosEjercicios = [];


/* =========================
   PROGRESO LOCAL
========================= */

historial =
JSON.parse(
  localStorage.getItem("historial") || "[]"
);

contador =
Number(
  localStorage.getItem("contador") || 0
);

actualizarEstadisticas();


/* =========================
   IDIOMA
========================= */

function obtenerIdioma() {

  const selector =
    document.getElementById("idioma");

  const idioma =
    selector.value;

  if (idioma === "auto") {

    const navegador =
      navigator.language
        .split("-")[0]
        .toLowerCase();

    if (
      ["es","en","fr","de","pt"]
      .includes(navegador)
    ) {
      return navegador;
    }

    return "es";
  }

  return idioma;
}


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  const objetivo =
    document.getElementById("objetivo")
      .value.trim();

  const articulo =
    document.getElementById("articulo")
      .value.trim();

  const dificultad =
    document.getElementById("dificultad")
      .value;

  const tipo =
    document.getElementById("tipo")
      .value.trim();

  const presupuesto =
    document.getElementById("presupuesto")
      .value.trim();

  const cantidad =
    document.getElementById("cantidad")
      .value.trim();

  const contexto =
    document.getElementById("contexto")
      .value.trim();

  const condiciones =
    document.getElementById("condiciones")
      .value.trim();


  if (!objetivo || !articulo) {

    document.getElementById(
      "mensajeInicio"
    ).innerHTML =

    `<div class="mensaje">
      Escribe el objetivo y lo que estás negociando.
    </div>`;

    return;
  }


  idiomaActual =
    obtenerIdioma();


  const btn =
    document.getElementById(
      "btnIniciar"
    );

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";


  try {

    const url =
      API_URL +
      "?accion=frase" +
      "&objetivo=" +
      encodeURIComponent(objetivo) +
      "&articulo=" +
      encodeURIComponent(articulo) +
      "&dificultad=" +
      encodeURIComponent(dificultad) +
      "&tipo=" +
      encodeURIComponent(tipo) +
      "&presupuesto=" +
      encodeURIComponent(presupuesto) +
      "&cantidad=" +
      encodeURIComponent(cantidad) +
      "&contexto=" +
      encodeURIComponent(contexto) +
      "&condiciones=" +
      encodeURIComponent(condiciones) +
      "&idioma=" +
      encodeURIComponent(idiomaActual);


    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo iniciar la negociación."
      );

    }


    sessionId =
      datos.sessionId;

    historial = [];


    document.getElementById(
      "chat"
    ).innerHTML = "";


    agregarOponente(
      datos.respuesta
    );


    document.getElementById(
      "configuracion"
    ).classList.add("hidden");


    document.getElementById(
      "resultado"
    ).classList.add("hidden");


    document.getElementById(
      "entrenamiento"
    ).classList.add("hidden");


    document.getElementById(
      "evolucion"
    ).classList.add("hidden");


    document.getElementById(
      "negociacion"
    ).classList.remove("hidden");


  } catch (error) {

    document.getElementById(
      "mensajeInicio"
    ).innerHTML =

    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   OPONENTE
========================= */

function agregarOponente(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=

  `<div class="oponente">
    <strong>🤖 Oponente:</strong><br>
    ${texto}
  </div>`;

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   USUARIO
========================= */

function agregarUsuario(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=

  `<div class="usuario">
    <strong>🧑 Tú:</strong><br>
    ${texto}
  </div>`;

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  const textarea =
    document.getElementById(
      "respuesta"
    );

  const texto =
    textarea.value.trim();


  if (!texto) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =

    `<div class="mensaje">
      Por favor escribe algo antes de enviar.
    </div>`;

    return;
  }


  if (!sessionId) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =

    `<div class="mensaje">
      No hay una negociación activa.
    </div>`;

    return;
  }


  agregarUsuario(texto);


  historial.push({
    rol: "usuario",
    texto: texto
  });


  textarea.value = "";


  const btn =
    document.getElementById(
      "btnEnviar"
    );

  btn.disabled = true;

  btn.textContent =
    "El oponente está respondiendo...";


  try {

    const respuesta =
      await fetch(

        API_URL +
        "?accion=continuar&sessionId=" +
        encodeURIComponent(sessionId),

        {

          method: "POST",

          headers: {
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            historial:
              historial,

            idioma:
              idiomaActual

          })

        }

      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo continuar."
      );

    }


    historial.push({

      rol:
        "oponente",

      texto:
        datos.respuesta

    });


    agregarOponente(
      datos.respuesta
    );


  } catch (error) {

    document.getElementById(
      "mensajeRespuesta"
    ).innerHTML =

    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion() {

  if (!sessionId) {
    return;
  }


  const btn =
    document.getElementById(
      "btnFinalizar"
    );

  btn.disabled = true;

  btn.textContent =
    "Evaluando negociación...";


  try {

    const respuesta =
      await fetch(

        API_URL +
        "?accion=evaluar&sessionId=" +
        encodeURIComponent(sessionId),

        {

          method: "POST",

          headers: {
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            historial:
              historial,

            idioma:
              idiomaActual

          })

        }

      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar."
      );

    }


    mostrarResultado(
      datos.puntaje,
      datos.feedback,
      datos.evaluacion
    );


  } catch (error) {

    alert(
      "Error al evaluar: " +
      error.message
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   RESULTADO
========================= */

function mostrarResultado(
  puntaje,
  feedback,
  evaluacion
) {

  document.getElementById(
    "negociacion"
  ).classList.add("hidden");


  document.getElementById(
    "resultado"
  ).classList.remove("hidden");


  document.getElementById(
    "puntaje"
  ).textContent =
    puntaje + "/100";


  document.getElementById(
    "feedback"
  ).innerHTML =

  `<div class="mensaje">
    ${feedback || ""}
  </div>`;


  mostrarEvaluacion(
    evaluacion
  );


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );


  if (
    evaluacion &&
    evaluacion.habilidadMasDebil
  ) {

    boton.classList.remove(
      "hidden"
    );

    boton.textContent =
      "🎯 Entrenar " +
      evaluacion
        .habilidadMasDebil
        .nombre;

  }


  contador++;


  historialResultadosGuardar(
    puntaje,
    evaluacion
  );


  actualizarEstadisticas();

}


/* =========================
   EVALUACIÓN
========================= */

function mostrarEvaluacion(
  evaluacion
) {

  const contenedor =
    document.getElementById(
      "evaluacion"
    );


  if (!evaluacion) {

    contenedor.innerHTML = "";

    return;
  }


  let html = "";


  if (
    evaluacion.habilidadMasDebil
  ) {

    html +=

    `<div class="mensaje">

      <strong>
        🎯 Habilidad más débil:
      </strong>

      <br>

      ${
        evaluacion
          .habilidadMasDebil
          .nombre
      }

      (
      ${
        evaluacion
          .habilidadMasDebil
          .puntaje
      }/100
      )

    </div>`;

  }


  if (evaluacion.habilidades) {

    html +=
      "<h3>Habilidades</h3>";

    html +=
      `<div class="skill-grid">`;


    const habilidades = {

      preparacion:
        "Preparación",

      anclaje:
        "Anclaje",

      preguntas:
        "Preguntas",

      argumentacion:
        "Argumentación",

      manejoPresion:
        "Manejo de presión",

      concesiones:
        "Concesiones",

      cierre:
        "Cierre"

    };


    for (
      const clave in habilidades
    ) {

      const valor =
        evaluacion
          .habilidades[clave] ?? 0;


      const debil =
        evaluacion
          .habilidadMasDebil &&
        evaluacion
          .habilidadMasDebil
          .clave === clave;


      html +=

      `<div class="skill ${
        debil ? "debil" : ""
      }">

        <strong>
          ${habilidades[clave]}
        </strong>

        ${valor}/100

        ${debil ? " 🎯" : ""}

      </div>`;

    }


    html += "</div>";

  }


  if (
    evaluacion.queHizoBien?.length
  ) {

    html +=
      `<h3>✅ Qué hiciste bien</h3>
       <ul>`;


    evaluacion
      .queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (
    evaluacion.queHizoMal?.length
  ) {

    html +=
      `<h3>❌ Qué debes mejorar</h3>
       <ul>`;


    evaluacion
      .queHizoMal
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (evaluacion.mayorError) {

    html +=

    `<h3>
      ⚠️ Mayor error
    </h3>

    <p>
      ${evaluacion.mayorError}
    </p>`;

  }


  if (evaluacion.deberiaMejorar) {

    html +=

    `<h3>
      📈 Debes mejorar
    </h3>

    <p>
      ${evaluacion.deberiaMejorar}
    </p>`;

  }


  if (evaluacion.consejo) {

    html +=

    `<h3>
      💡 Consejo
    </h3>

    <p>
      ${evaluacion.consejo}
    </p>`;

  }


  contenedor.innerHTML =
    html;

}


/* =========================
   ENTRENAMIENTO
========================= */

async function obtenerEntrenamiento() {

  if (!sessionId) {
    return;
  }


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );

  const mensaje =
    document.getElementById(
      "mensajeEntrenamiento"
    );


  boton.disabled = true;

  boton.textContent =
    "🎯 Creando entrenamiento...";


  mensaje.innerHTML =

  `<div class="mensaje">
    Creando entrenamiento personalizado...
  </div>`;


  try {

    const respuesta =
      await fetch(

        API_URL +
        "?accion=entrenamiento&sessionId=" +
        encodeURIComponent(sessionId),

        {

          method: "POST",

          headers: {
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            idioma:
              idiomaActual

          })

        }

      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo crear el entrenamiento."
      );

    }


    mostrarEntrenamiento(
      datos.entrenamiento
    );


    mensaje.innerHTML = "";


  } catch (error) {

    mensaje.innerHTML =

    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================
   MOSTRAR ENTRENAMIENTO
========================= */

function mostrarEntrenamiento(
  entrenamiento
) {

  if (!entrenamiento) {
    return;
  }


  entrenamientoActual =
    entrenamiento;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  document.getElementById(
    "entrenamiento"
  ).classList.remove("hidden");


  mostrarEjercicioActual();


  document.getElementById(
    "entrenamiento"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   EJERCICIO
========================= */

function mostrarEjercicioActual() {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  const ejercicios =
    entrenamientoActual
      .ejercicios || [];


  if (
    ejercicioActual >=
    ejercicios.length
  ) {

    mostrarResumenEntrenamiento();

    return;
  }


  const ejercicio =
    ejercicios[ejercicioActual];


  let html = "";


  html +=

  `<div class="mensaje">

    <strong>
      Habilidad:
    </strong>

    ${
      entrenamientoActual
        .nombreHabilidad ||
      entrenamientoActual
        .habilidad ||
      ""
    }

    <br><br>

    <strong>
      Puntaje actual:
    </strong>

    ${
      entrenamientoActual
        .puntajeActual || 0
    }/100

  </div>`;


  if (
    entrenamientoActual
      .objetivo
  ) {

    html +=

    `<h3>
      🎯 Objetivo
    </h3>

    <p>
      ${
        entrenamientoActual
          .objetivo
      }
    </p>`;

  }


  if (
    entrenamientoActual
      .explicacion &&
    ejercicioActual === 0
  ) {

    html +=

    `<h3>
      📚 Aprende primero
    </h3>

    <p>
      ${
        entrenamientoActual
          .explicacion
      }
    </p>`;

  }


  html +=

  `<div class="training-progress">
    Ejercicio
    ${ejercicioActual + 1}
    de
    ${ejercicios.length}
  </div>

  <div class="training-exercise">

    <h3>
      🥊
      ${
        ejercicio.titulo ||
        "Ejercicio"
      }
    </h3>

    <p>
      <strong>
        Instrucción:
      </strong>
      <br>
      ${
        ejercicio.instruccion ||
        ""
      }
    </p>

    <p>
      <strong>
        Situación:
      </strong>
      <br>
      ${
        ejercicio.situacion ||
        ""
      }
    </p>

    <p>
      <strong>
        Qué debes hacer:
      </strong>
      <br>
      ${
        ejercicio.queDebeHacer ||
        ""
      }
    </p>

    <label>
      Tu respuesta
    </label>

    <textarea
      id="respuestaEjercicio"
      placeholder="Escribe exactamente lo que responderías..."
      onkeydown="manejarEnterEjercicio(event)"
    ></textarea>

    <button
      id="btnResponderEjercicio"
      onclick="evaluarEjercicio()"
    >
      Evaluar mi respuesta
    </button>

    <div id="mensajeEjercicio"></div>

  </div>`;


  contenedor.innerHTML =
    html;

}


/* =========================
   EVALUAR EJERCICIO
========================= */

async function evaluarEjercicio() {

  if (!sessionId) {
    return;
  }


  const textarea =
    document.getElementById(
      "respuestaEjercicio"
    );


  const respuesta =
    textarea.value.trim();


  if (!respuesta) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML =

    `<div class="mensaje">
      Escribe una respuesta.
    </div>`;

    return;
  }


  const ejercicios =
    entrenamientoActual
      .ejercicios || [];


  const ejercicio =
    ejercicios[ejercicioActual];


  const btn =
    document.getElementById(
      "btnResponderEjercicio"
    );


  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";


  try {

    const respuestaAPI =
      await fetch(

        API_URL +
        "?accion=ejercicio&sessionId=" +
        encodeURIComponent(sessionId),

        {

          method: "POST",

          headers: {
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            numeroEjercicio:
              Number(
                ejercicio.numero
              ),

            respuesta:
              respuesta,

            idioma:
              idiomaActual

          })

        }

      );


    const datos =
      await respuestaAPI.json();


    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el ejercicio."
      );

    }


    const resultado =
      datos.resultado;


    resultadosEjercicios.push(
      resultado
    );


    mostrarFeedbackEjercicio(
      resultado
    );


  } catch (error) {

    document.getElementById(
      "mensajeEjercicio"
    ).innerHTML =

    `<div class="mensaje">
      Error: ${error.message}
    </div>`;


    btn.disabled = false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}


/* =========================
   FEEDBACK EJERCICIO
========================= */

function mostrarFeedbackEjercicio(
  resultado
) {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  let html =

  `<div class="exercise-feedback">

    <h3>
      📊 Resultado
    </h3>

    <div class="score">
      ${
        resultado.puntaje || 0
      }/100
    </div>

    <p>
      <strong>
        Evaluación:
      </strong>
      <br>
      ${
        resultado.evaluacion ||
        ""
      }
    </p>`;


  if (
    resultado.queHizoBien?.length
  ) {

    html +=

    `<h3>
      ✅ Qué hiciste bien
    </h3>

    <ul>`;


    resultado
      .queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (
    resultado.queDebeMejorar?.length
  ) {

    html +=

    `<h3>
      📈 Qué debes mejorar
    </h3>

    <ul>`;


    resultado
      .queDebeMejorar
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (
    resultado.errorPrincipal
  ) {

    html +=

    `<p>
      <strong>
        ⚠️ Error principal:
      </strong>
      <br>
      ${
        resultado.errorPrincipal
      }
    </p>`;

  }


  if (
    resultado.mejorVersion
  ) {

    html +=

    `<div class="improvement">

      <strong>
        💡 Versión más fuerte:
      </strong>

      <p>
        ${
          resultado.mejorVersion
        }
      </p>

    </div>`;

  }


  if (resultado.consejo) {

    html +=

    `<p>
      <strong>
        🎯 Consejo:
      </strong>
      <br>
      ${
        resultado.consejo
      }
    </p>`;

  }


  const ultimo =
    ejercicioActual + 1 >=
    (
      entrenamientoActual
        .ejercicios || []
    ).length;


  html +=

  `<button
    onclick="siguienteEjercicio()"
  >
    ${
      ultimo
        ? "Ver Reto Final →"
        : "Siguiente ejercicio →"
    }
  </button>

  </div>`;


  contenedor.innerHTML =
    html;


  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   SIGUIENTE
========================= */

function siguienteEjercicio() {

  ejercicioActual++;

  mostrarEjercicioActual();

}


/* =========================
   ENTER EJERCICIO
========================= */

function manejarEnterEjercicio(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarEjercicio();

  }

}


/* =========================
   RESUMEN + RETO FINAL
========================= */

function mostrarResumenEntrenamiento() {

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  let promedio = 0;


  if (
    resultadosEjercicios.length
  ) {

    const suma =
      resultadosEjercicios
        .reduce(
          (total, resultado) =>
            total +
            Number(
              resultado.puntaje || 0
            ),
          0
        );


    promedio =
      Math.round(
        (
          suma /
          resultadosEjercicios.length
        ) * 10
      ) / 10;

  }


  let html =

  `<div class="success-message">

    <h3>
      🎉 Entrenamiento completado
    </h3>

    <p>
      Completaste
      ${
        resultadosEjercicios.length
      }
      ejercicios.
    </p>

    <p>
      <strong>
        Promedio:
      </strong>
      ${promedio}/100
    </p>

  </div>`;


  if (
    entrenamientoActual
      .retoFinal
  ) {

    const reto =
      entrenamientoActual
        .retoFinal;


    html +=

    `<div class="challenge">

      <h2>
        🏆 Reto Final
      </h2>

      <h3>
        ${
          reto.titulo || ""
        }
      </h3>

      <p>
        <strong>
          Situación:
        </strong>
        <br>
        ${
          reto.situacion || ""
        }
      </p>

      <p>
        <strong>
          Instrucción:
        </strong>
        <br>
        ${
          reto.instruccion || ""
        }
      </p>

      <p>
        <strong>
          Criterio de éxito:
        </strong>
        <br>
        ${
          reto.criterioExito || ""
        }
      </p>

      <label style="color:white;">
        Tu respuesta
      </label>

      <textarea
        id="respuestaRetoFinal"
        placeholder="Escribe tu respuesta..."
        onkeydown="manejarEnterReto(event)"
      ></textarea>

      <button
        id="btnRetoFinal"
        onclick="evaluarRetoFinal()"
      >
        🏆 Evaluar Reto Final
      </button>

      <div id="mensajeRetoFinal"></div>

      <div id="resultadoRetoFinal"></div>

    </div>`;

  }


  contenedor.innerHTML =
    html;


  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   EVALUAR RETO FINAL
========================= */

async function evaluarRetoFinal() {

  if (!sessionId) {
    return;
  }


  const textarea =
    document.getElementById(
      "respuestaRetoFinal"
    );


  const respuesta =
    textarea.value.trim();


  if (!respuesta) {

    document.getElementById(
      "mensajeRetoFinal"
    ).innerHTML =

    `<div class="mensaje">
      Escribe una respuesta antes de evaluar.
    </div>`;

    return;
  }


  const btn =
    document.getElementById(
      "btnRetoFinal"
    );


  const mensaje =
    document.getElementById(
      "mensajeRetoFinal"
    );


  btn.disabled = true;

  btn.textContent =
    "Evaluando Reto Final...";


  mensaje.innerHTML =

  `<div class="mensaje">
    Analizando tu desempeño final...
  </div>`;


  try {

    const respuestaAPI =
      await fetch(

        API_URL +
        "?accion=retoFinal&sessionId=" +
        encodeURIComponent(sessionId),

        {

          method: "POST",

          headers: {
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            respuesta:
              respuesta,

            idioma:
              idiomaActual

          })

        }

      );


    const datos =
      await respuestaAPI.json();


    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el Reto Final."
      );

    }


    const resultado =
      datos.resultado;


    guardarRetoFinal(
      resultado
    );


    mostrarResultadoRetoFinal(
      resultado
    );


    await cargarEvolucion();


    mensaje.innerHTML = "";


  } catch (error) {

    mensaje.innerHTML =

    `<div class="mensaje">
      Error: ${error.message}
    </div>`;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "🏆 Evaluar Reto Final";

  }

}


/* =========================
   RESULTADO RETO
========================= */

      Evaluación
    </h3>

    <p>
      ${

      }
    </p>`;

  }


  if (
    resultado.queHizoBien?.length
  ) {

    html +=

    `<h3>
      ✅ Qué hiciste bien
    </h3>

    <ul>`;


    resultado
      .queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (
    resultado.queDebeMejorar?.length
  ) {

    html +=

    `<h3>
      📈 Qué debes mejorar
    </h3>

    <ul>`;


    resultado
      .queDebeMejorar
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });


    html += "</ul>";

  }


  if (
    resultado.errorPrincipal
  ) {

    html +=

    `<h3>
      ⚠️ Error principal
    </h3>

    <p>
      ${
        resultado.errorPrincipal
      }
    </p>`;

  }


  if (
    resultado.mejorVersion
  ) {

    html +=

    `<div class="improvement">

      <strong>
        💡 Versión más fuerte:
      </strong>

      <p>
        ${
          resultado.mejorVersion
        }
      </p>

    </div>`;

  }


  if (resultado.consejo) {

    html +=

    `<p>
      <strong>
        🎯 Consejo:
      </strong>
      <br>
      ${
        resultado.consejo
      }
    </p>`;

  }


  html += "</div>";


  contenedor.innerHTML =
    html;


  contenedor.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================
   ENTER RETO
========================= */

function manejarEnterReto(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarRetoFinal();

  }

}


/* =========================
   GUARDAR RETO
========================= */

function guardarRetoFinal(
  resultado
) {

  const retos =
    JSON.parse(
      localStorage.getItem(
        "retosFinales"
      ) || "[]"
    );


  retos.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      Number(
        resultado?.puntaje || 0
      ),

    superado:
      !!resultado?.superado

  });


  localStorage.setItem(
    "retosFinales",
    JSON.stringify(retos)
  );

}


/* =========================
   EVOLUCIÓN
========================= */

async function cargarEvolucion() {

  if (!sessionId) {
    return;
  }


  try {

    const respuesta =
      await fetch(

        API_URL +
        "?accion=evolucion&sessionId=" +
        encodeURIComponent(sessionId)

      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {
      return;
    }


    mostrarEvolucion(
      datos.evolucion
    );


  } catch (error) {

    console.log(
      "No se pudo cargar evolución:",
      error
    );

  }

}


/* =========================
   MOSTRAR EVOLUCIÓN
========================= */

function mostrarEvolucion(
  evolucion
) {

  const contenedor =
    document.getElementById(
      "contenidoEvolucion"
    );


  if (
    !evolucion ||
    !Object.keys(evolucion).length
  ) {

    contenedor.innerHTML =

    `<div class="mensaje">
      Todavía no hay suficiente historial para mostrar evolución.
    </div>`;

    document.getElementById(
      "evolucion"
    ).classList.remove("hidden");

    return;
  }


  const nombres = {

    preparacion:
      "Preparación",

    anclaje:
      "Anclaje",

    preguntas:
      "Preguntas",

    argumentacion:
      "Argumentación",

    manejoPresion:
      "Manejo de presión",

    concesiones:
      "Concesiones",

    cierre:
      "Cierre"

  };


  let html = "";


  for (
    const clave in evolucion
  ) {

    const valores =
      evolucion[clave];


    if (
      !Array.isArray(valores) ||
      !valores.length
    ) {
      continue;
    }


    const numeros =
      valores.map(
        item =>
          Number(
            item.puntaje || 0
          )
      );


    html +=

    `<div class="evolution-item">

      <strong>
        ${
          nombres[clave] ||
          clave
        }
      </strong>

      <div class="evolution-values">
        ${numeros.join(" → ")}
      </div>

    </div>`;

  }


  if (!html) {

    html =
      `<div class="mensaje">
        Todavía no hay evolución registrada.
      </div>`;

  }


  contenedor.innerHTML =
    html;


  document.getElementById(
    "evolucion"
  ).classList.remove(
    "hidden"
  );

}


/* =========================
   GUARDAR RESULTADO
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  resultados.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      Number(puntaje || 0),

    evaluacion:
      evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(resultados)
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(historial)
  );


  localStorage.setItem(
    "contador",
    contador
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  const retos =
    JSON.parse(
      localStorage.getItem(
        "retosFinales"
      ) || "[]"
    );


  if (!resultados.length) {

    document.getElementById(
      "estadisticas"
    ).innerHTML =

    `
    <strong>
      Negociaciones:
    </strong>
    0

    <br>

    <strong>
      Promedio:
    </strong>
    0/100

    <br>

    <strong>
      Retos finales:
    </strong>
    ${retos.length}

    `;

    return;
  }


  const suma =
    resultados.reduce(
      (total, resultado) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );


  const promedio =
    Math.round(
      (
        suma /
        resultados.length
      ) * 10
    ) / 10;


  const superados =
    retos.filter(
      reto =>
        reto.superado
    ).length;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        resultado =>
          resultado.puntaje
      )
      .join(", ");


  document.getElementById(
    "estadisticas"
  ).innerHTML =

  `
  <strong>
    Negociaciones:
  </strong>
  ${resultados.length}

  <br>

  <strong>
    Promedio:
  </strong>
  ${promedio}/100

  <br>

  <strong>
    Últimos resultados:
  </strong>
  ${ultimos}

  <br>

  <strong>
    Retos finales:
  </strong>
  ${retos.length}

  <br>

  <strong>
    Retos superados:
  </strong>
  ${superados}
  `;

}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar todo tu progreso?"
    );


  if (!confirmar) {
    return;
  }


  localStorage.removeItem(
    "historial"
  );

  localStorage.removeItem(
    "contador"
  );

  localStorage.removeItem(
    "resultados"
  );

  localStorage.removeItem(
    "ultimoEntrenamiento"
  );

  localStorage.removeItem(
    "retosFinales"
  );


  historial = [];

  contador = 0;

  sessionId = null;

  entrenamientoActual = null;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  actualizarEstadisticas();


  document.getElementById(
    "chat"
  ).innerHTML = "";


  document.getElementById(
    "configuracion"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "negociacion"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "resultado"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "entrenamiento"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "evolucion"
  ).classList.add(
    "hidden"
  );

}

</script>
