<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academia de Negociación</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
  padding:40px 20px;
}

.container{
  max-width:850px;
  margin:auto;
}

h1,h2,h3{
  text-align:center;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#3E63C7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.secondary{
  background:#555;
}

.training-button{
  background:#111;
}

.danger{
  background:#b42318;
}

.mensaje{
  padding:12px;
  border-radius:8px;
  background:#eee;
  margin-top:15px;
}

.chat{
  margin-top:20px;
}

.oponente{
  background:#eeeeee;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.usuario{
  background:#dfe8ff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.score{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:20px 0;
}

.skill-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}

.skill{
  background:#f5f5f5;
  padding:15px;
  border-radius:10px;
}

.skill strong{
  display:block;
  margin-bottom:5px;
}

.debil{
  border:3px solid #3E63C7;
  background:#eef2ff;
}

ul{
  padding-left:20px;
}

.training-exercise{
  background:#f7f7f7;
  padding:18px;
  border-radius:12px;
  margin-top:15px;
  border-left:5px solid #3E63C7;
}

.training-exercise h3{
  text-align:left;
  margin-top:0;
}

.challenge{
  background:#111;
  color:white;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.challenge textarea{
  background:white;
  color:#222;
  margin-top:10px;
}

.challenge-result{
  background:white;
  color:#222;
  padding:18px;
  border-radius:12px;
  margin-top:20px;
}

.challenge-success{
  background:#e8f5e9;
  color:#1b5e20;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.challenge-failed{
  background:#fff3f3;
  color:#8a1c1c;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.hidden{
  display:none;
}

.small{
  font-size:14px;
  color:#666;
}

.training-interactive{
  margin-top:20px;
}

.training-progress{
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.exercise-feedback{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:#eef2ff;
}

.exercise-feedback h3{
  text-align:left;
  margin-top:0;
}

.improvement{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.success-message{
  background:#e8f5e9;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

/* =========================
   XP
========================= */

.xp-card{
  background:#111;
  color:white;
}

.xp-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.xp-level{
  font-size:28px;
  font-weight:bold;
}

.xp-rank{
  font-size:18px;
  opacity:.85;
}

.xp-total{
  text-align:right;
  font-size:16px;
}

.xp-bar-container{
  width:100%;
  height:18px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:18px;
}

.xp-bar{
  height:100%;
  width:0%;
  background:#fff;
  transition:width .5s ease;
}

.xp-info{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
  opacity:.85;
}

.xp-gain{
  background:#eef2ff;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-weight:bold;
  text-align:center;
}

.rank-badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#3E63C7;
  color:white;
  font-weight:bold;
  margin-top:8px;
}

@media(max-width:600px){

  .skill-grid{
    grid-template-columns:1fr;
  }

  body{
    padding:20px 12px;
  }

  .xp-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .xp-total{
    text-align:left;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>🎯 Academia de Negociación</h1>

<!-- =========================
     XP / NIVEL
========================= -->

<div class="card xp-card">

  <div class="xp-header">

    <div>
      <div class="xp-level" id="nivelXP">
        Nivel 1
      </div>

      <div class="xp-rank" id="rangoXP">
        Novato
      </div>

      <div class="rank-badge" id="badgeRango">
        🥉 Novato
      </div>
    </div>

    <div class="xp-total">
      ⭐ <span id="xpTotal">0</span> XP
    </div>

  </div>

  <div class="xp-bar-container">
    <div
      class="xp-bar"
      id="barraXP"
    ></div>
  </div>

  <div class="xp-info">

    <span id="xpActualNivel">
      0 XP
    </span>

    <span id="xpSiguienteNivel">
      100 XP
    </span>

  </div>

  <div
    id="mensajeXP"
    class="xp-gain hidden"
  ></div>

</div>


<!-- =========================
     CONFIGURACIÓN
========================= -->

<div class="card" id="configuracion">

<h2>Configura tu negociación</h2>

<label>Idioma</label>

<select id="idioma">
  <option value="es" selected>Español</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="pt">Português</option>
</select>

<label>¿Qué quieres conseguir?</label>

<input
  id="objetivo"
  placeholder="Ejemplo: Comprar por $1,000"
>

<label>¿Qué estás negociando?</label>

<input
  id="articulo"
  placeholder="Ejemplo: Una computadora"
>

<label>Dificultad</label>

<select id="dificultad">

  <option value="facil">
    Fácil
  </option>

  <option value="media" selected>
    Media
  </option>

  <option value="dificil">
    Difícil
  </option>

  <option value="experto">
    Experto
  </option>

</select>

<label>Tipo de negociación</label>

<input
  id="tipo"
  placeholder="Ejemplo: Compra, venta, salario, negocio"
>

<label>Presupuesto</label>

<input
  id="presupuesto"
  placeholder="Opcional"
>

<label>Cantidad</label>

<input
  id="cantidad"
  placeholder="Opcional"
>

<label>Contexto</label>

<textarea
  id="contexto"
  placeholder="Opcional"
></textarea>

<label>Condiciones</label>

<textarea
  id="condiciones"
  placeholder="Opcional"
></textarea>

<button
  id="btnIniciar"
  onclick="iniciarNegociacion()"
>
  Comenzar negociación
</button>

<div id="mensajeInicio"></div>

</div>


<!-- =========================
     NEGOCIACIÓN
========================= -->

<div
  class="card hidden"
  id="negociacion"
>

<h2>Negociación</h2>

<div
  id="chat"
  class="chat"
></div>

<label>Tu respuesta</label>

<textarea
  id="respuesta"
  placeholder="Escribe lo que responderías..."
  onkeydown="manejarEnter(event)"
></textarea>

<button
  id="btnEnviar"
  onclick="enviarRespuesta()"
>
  Enviar respuesta
</button>

<button
  id="btnFinalizar"
  class="secondary"
  onclick="finalizarNegociacion()"
>
  Finalizar negociación
</button>

<div id="mensajeRespuesta"></div>

</div>


<!-- =========================
     RESULTADO
========================= -->

<div
  class="card hidden"
  id="resultado"
>

<h2>Resultado</h2>

<div
  class="score"
  id="puntaje"
></div>

<div id="feedback"></div>

<div id="evaluacion"></div>

<button
  id="btnEntrenamiento"
  class="training-button hidden"
  onclick="obtenerEntrenamiento()"
>
  🎯 Entrenar mi habilidad más débil
</button>

<div id="mensajeEntrenamiento"></div>

</div>


<!-- =========================
     ENTRENAMIENTO
========================= -->

<div
  class="card hidden"
  id="entrenamiento"
>

<h2>🎯 Entrenamiento personalizado</h2>

<div
  id="contenidoEntrenamiento"
></div>

</div>


<!-- =========================
     PROGRESO
========================= -->

<div class="card">

<h2>📊 Mi progreso</h2>

<p id="estadisticas"></p>

<button
  class="danger"
  onclick="reiniciar()"
>
  Reiniciar progreso
</button>

</div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";


/* =========================
   ESTADO
========================= */

let historial = [];

let contador = 0;

let sessionId = null;

let ultimaFrase = "";

let idiomaActual = "es";

let entrenamientoActual = null;

let ejercicioActual = 0;

let resultadosEjercicios = [];


/* =========================
   XP
========================= */

const XP_NIVELES = [
  0,
  100,
  250,
  450,
  700,
  1000,
  1400,
  1850,
  2400,
  3000
];


const XP_NEGOCIACION = 50;

const XP_EJERCICIO = 15;

const XP_RETO_SUPERADO = 100;

const XP_RETO_FALLADO = 40;


/* =========================
   CARGAR PROGRESO
========================= */

historial =
  JSON.parse(
    localStorage.getItem("historial") || "[]"
  );

contador =
  Number(
    localStorage.getItem("contador") || 0
  );

idiomaActual =
  localStorage.getItem("idioma") || "es";

document.getElementById("idioma").value =
  idiomaActual;

actualizarXP();

actualizarEstadisticas();


/* =========================
   XP - NIVEL
========================= */

function obtenerDatosNivel(xp){

  xp = Number(xp) || 0;

  let nivel = 1;

  let inicioNivel = 0;

  let siguienteNivel = XP_NIVELES[1];

  for(let i = 0; i < XP_NIVELES.length; i++){

    if(xp >= XP_NIVELES[i]){

      nivel = i + 1;

      inicioNivel = XP_NIVELES[i];

      siguienteNivel =
        XP_NIVELES[i + 1] ?? null;

    }

  }

  /*
    Después del nivel 10:
    cada nivel requiere 600 XP.
  */

  if(xp >= XP_NIVELES[XP_NIVELES.length - 1]){

    const xpDespues =
      xp -
      XP_NIVELES[XP_NIVELES.length - 1];

    const nivelesExtra =
      Math.floor(xpDespues / 600);

    nivel =
      10 + nivelesExtra;

    inicioNivel =
      XP_NIVELES[XP_NIVELES.length - 1]
      + nivelesExtra * 600;

    siguienteNivel =
      inicioNivel + 600;

  }

  return {
    nivel,
    inicioNivel,
    siguienteNivel
  };

}


/* =========================
   RANGO
========================= */

function obtenerRango(nivel){

  if(nivel <= 1){
    return "Novato";
  }

  if(nivel <= 2){
    return "Aprendiz";
  }

  if(nivel <= 4){
    return "Negociador";
  }

  if(nivel <= 6){
    return "Estratega";
  }

  if(nivel <= 8){
    return "Experto";
  }

  if(nivel <= 10){
    return "Maestro";
  }

  return "Élite";

}


/* =========================
   ACTUALIZAR XP
========================= */

function actualizarXP(){

  const xp =
    Number(
      localStorage.getItem("xpTotal") || 0
    );

  const datos =
    obtenerDatosNivel(xp);

  const rango =
    obtenerRango(datos.nivel);

  document.getElementById("xpTotal")
    .textContent = xp;

  document.getElementById("nivelXP")
    .textContent =
      "Nivel " + datos.nivel;

  document.getElementById("rangoXP")
    .textContent =
      rango;

  document.getElementById("badgeRango")
    .textContent =
      "🏆 " + rango;

  const xpDentroNivel =
    xp - datos.inicioNivel;

  const xpNecesaria =
    datos.siguienteNivel -
    datos.inicioNivel;

  let porcentaje =
    (xpDentroNivel / xpNecesaria) * 100;

  porcentaje =
    Math.max(
      0,
      Math.min(100, porcentaje)
    );

  document.getElementById("barraXP")
    .style.width =
      porcentaje + "%";

  document.getElementById("xpActualNivel")
    .textContent =
      xpDentroNivel +
      " XP";

  document.getElementById("xpSiguienteNivel")
    .textContent =
      xpNecesaria +
      " XP";

}


/* =========================
   DAR XP
========================= */

function ganarXP(cantidad, motivo){

  cantidad =
    Number(cantidad) || 0;

  if(cantidad <= 0){
    return;
  }

  const xpAnterior =
    Number(
      localStorage.getItem("xpTotal") || 0
    );

  const datosAntes =
    obtenerDatosNivel(xpAnterior);

  const xpNuevo =
    xpAnterior + cantidad;

  localStorage.setItem(
    "xpTotal",
    xpNuevo
  );

  actualizarXP();

  const datosDespues =
    obtenerDatosNivel(xpNuevo);

  const mensaje =
    document.getElementById("mensajeXP");

  mensaje.innerHTML =
    `⭐ +${cantidad} XP — ${motivo}`;

  mensaje.classList.remove("hidden");

  setTimeout(() => {

    mensaje.classList.add("hidden");

  }, 5000);

  if(
    datosDespues.nivel >
    datosAntes.nivel
  ){

    setTimeout(() => {

      alert(
        "🎉 ¡Subiste al nivel " +
        datosDespues.nivel +
        "!\n\n" +
        "Nuevo rango: " +
        obtenerRango(datosDespues.nivel)
      );

    }, 300);

  }

}


/* =========================
   EVITAR XP DUPLICADO
========================= */

function yaRecibioXP(clave){

  const eventos =
    JSON.parse(
      localStorage.getItem("xpEventos") || "[]"
    );

  return eventos.includes(clave);

}


function registrarXPEvento(clave){

  const eventos =
    JSON.parse(
      localStorage.getItem("xpEventos") || "[]"
    );

  if(!eventos.includes(clave)){

    eventos.push(clave);

    localStorage.setItem(
      "xpEventos",
      JSON.stringify(eventos)
    );

    return true;

  }

  return false;

}


function otorgarXPUnico(
  clave,
  cantidad,
  motivo
){

  if(
    registrarXPEvento(clave)
  ){

    ganarXP(
      cantidad,
      motivo
    );

    return true;

  }

  return false;

}


/* =========================
   IDIOMA
========================= */

document.getElementById("idioma")
  .addEventListener(
    "change",
    function(){

      idiomaActual =
        this.value;

      localStorage.setItem(
        "idioma",
        idiomaActual
      );

    }
  );


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion(){

  const objetivo =
    document
      .getElementById("objetivo")
      .value
      .trim();

  const articulo =
    document
      .getElementById("articulo")
      .value
      .trim();

  const dificultad =
    document
      .getElementById("dificultad")
      .value;

  const tipo =
    document
      .getElementById("tipo")
      .value
      .trim();

  const presupuesto =
    document
      .getElementById("presupuesto")
      .value
      .trim();

  const cantidad =
    document
      .getElementById("cantidad")
      .value
      .trim();

  const contexto =
    document
      .getElementById("contexto")
      .value
      .trim();

  const condiciones =
    document
      .getElementById("condiciones")
      .value
      .trim();


  if(!objetivo || !articulo){

    document
      .getElementById("mensajeInicio")
      .innerHTML =
      `<div class="mensaje">
        Escribe el objetivo y lo que estás negociando.
      </div>`;

    return;

  }


  const btn =
    document
      .getElementById("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";


  try{

    const url =
      API_URL +
      "?accion=frase" +
      "&objetivo=" +
      encodeURIComponent(objetivo) +
      "&articulo=" +
      encodeURIComponent(articulo) +
      "&dificultad=" +
      encodeURIComponent(dificultad) +
      "&tipo=" +
      encodeURIComponent(tipo) +
      "&presupuesto=" +
      encodeURIComponent(presupuesto) +
      "&cantidad=" +
      encodeURIComponent(cantidad) +
      "&contexto=" +
      encodeURIComponent(contexto) +
      "&condiciones=" +
      encodeURIComponent(condiciones) +
      "&idioma=" +
      encodeURIComponent(idiomaActual);


    const respuesta =
      await fetch(url);

    const datos =
      await respuesta.json();


    if(!respuesta.ok){

      throw new Error(
        datos.error ||
        "No se pudo iniciar la negociación."
      );

    }


    sessionId =
      datos.sessionId;

    historial = [];

    ultimaFrase = "";


    document
      .getElementById("chat")
      .innerHTML = "";


    agregarOponente(
      datos.respuesta
    );


    document
      .getElementById("configuracion")
      .classList.add("hidden");

    document
      .getElementById("resultado")
      .classList.add("hidden");

    document
      .getElementById("entrenamiento")
      .classList.add("hidden");

    document
      .getElementById("negociacion")
      .classList.remove("hidden");


  }catch(error){

    document
      .getElementById("mensajeInicio")
      .innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  }finally{

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   OPONENTE
========================= */

function agregarOponente(texto){

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
    `<div class="oponente">
      <strong>🤖 Oponente:</strong><br>
      ${texto}
    </div>`;

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   USUARIO
========================= */

function agregarUsuario(texto){

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
    `<div class="usuario">
      <strong>🧑 Tú:</strong><br>
      ${texto}
    </div>`;

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta(){

  const textarea =
    document.getElementById("respuesta");

  const texto =
    textarea.value.trim();


  if(!texto){

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `<div class="mensaje">
        Por favor escribe algo antes de enviar.
      </div>`;

    return;

  }


  if(!sessionId){

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `<div class="mensaje">
        No hay una negociación activa.
      </div>`;

    return;

  }


  document
    .getElementById("mensajeRespuesta")
    .innerHTML = "";


  agregarUsuario(texto);


  historial.push({
    rol:"usuario",
    texto:texto
  });


  textarea.value = "";


  const btn =
    document.getElementById("btnEnviar");

  btn.disabled = true;

  btn.textContent =
    "El oponente está respondiendo...";


  try{

    const respuesta =
      await fetch(
        API_URL +
        "?accion=continuar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            historial:historial,
            idioma:idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if(!respuesta.ok){

      throw new Error(
        datos.error ||
        "No se pudo continuar."
      );

    }


    historial.push({
      rol:"oponente",
      texto:datos.respuesta
    });


    agregarOponente(
      datos.respuesta
    );


  }catch(error){

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  }finally{

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion(){

  if(!sessionId){
    return;
  }


  const btn =
    document.getElementById("btnFinalizar");

  btn.disabled = true;

  btn.textContent =
    "Evaluando negociación...";


  try{

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evaluar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            historial:historial,
            idioma:idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if(!respuesta.ok){

      throw new Error(
        datos.error ||
        "No se pudo evaluar."
      );

    }


    mostrarResultado(
      datos.puntaje,
      datos.feedback,
      datos.evaluacion
    );


  }catch(error){

    alert(
      "Error al evaluar: " +
      error.message
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   RESULTADO
========================= */

function mostrarResultado(
  puntaje,
  feedback,
  evaluacion
){

  document
    .getElementById("negociacion")
    .classList.add("hidden");

  document
    .getElementById("resultado")
    .classList.remove("hidden");


  document
    .getElementById("puntaje")
    .textContent =
    puntaje + "/100";


  document
    .getElementById("feedback")
    .innerHTML =
    `<div class="mensaje">
      ${feedback || ""}
    </div>`;


  mostrarEvaluacion(
    evaluacion
  );


  const botonEntrenamiento =
    document.getElementById(
      "btnEntrenamiento"
    );


  if(
    evaluacion &&
    evaluacion.habilidadMasDebil &&
    sessionId
  ){

    botonEntrenamiento
      .classList
      .remove("hidden");

    botonEntrenamiento.textContent =
      "🎯 Entrenar " +
      evaluacion.habilidadMasDebil.nombre;

  }else{

    botonEntrenamiento
      .classList
      .add("hidden");

  }


  contador++;


  historialResultadosGuardar(
    puntaje,
    evaluacion
  );


  actualizarEstadisticas();


  /*
    +50 XP por terminar negociación.
  */

  otorgarXPUnico(
    "negociacion-" + sessionId,
    XP_NEGOCIACION,
    "Negociación completada"
  );

}


/* =========================
   EVALUACIÓN
========================= */

function mostrarEvaluacion(
  evaluacion
){

  const contenedor =
    document.getElementById(
      "evaluacion"
    );


  if(!evaluacion){

    contenedor.innerHTML = "";

    return;

  }


  let html = "";


  if(
    evaluacion.habilidadMasDebil
  ){

    html +=
      `<div class="mensaje">
        <strong>
          🎯 Tu habilidad más débil:
        </strong><br>

        ${evaluacion.habilidadMasDebil.nombre}

        (${evaluacion.habilidadMasDebil.puntaje}/100)

      </div>`;

  }


  if(evaluacion.habilidades){

    html +=
      `<h3>Habilidades</h3>`;

    html +=
      `<div class="skill-grid">`;


    const habilidades = {

      preparacion:"Preparación",

      anclaje:"Anclaje",

      preguntas:"Preguntas",

      argumentacion:"Argumentación",

      manejoPresion:"Manejo de presión",

      concesiones:"Concesiones",

      cierre:"Cierre"

    };


    for(
      const clave in habilidades
    ){

      const puntaje =
        evaluacion
          .habilidades[clave] ?? 0;


      const esDebil =
        evaluacion
          .habilidadMasDebil &&
        evaluacion
          .habilidadMasDebil
          .clave === clave;


      html +=
        `<div class="skill ${
          esDebil ? "debil" : ""
        }">

          <strong>
            ${habilidades[clave]}
          </strong>

          ${puntaje}/100

          ${esDebil ? " 🎯" : ""}

        </div>`;

    }


    html +=
      `</div>`;

  }


  if(
    evaluacion.queHizoBien?.length
  ){

    html +=
      `<h3>✅ Qué hiciste bien</h3>
       <ul>`;

    evaluacion
      .queHizoBien
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html +=
      `</ul>`;

  }


  if(
    evaluacion.queHizoMal?.length
  ){

    html +=
      `<h3>❌ Qué hiciste mal</h3>
       <ul>`;

    evaluacion
      .queHizoMal
      .forEach(item => {

        html +=
          `<li>${item}</li>`;

      });

    html +=
      `</ul>`;

  }


  if(evaluacion.mayorError){

    html +=
      `<h3>⚠️ Tu mayor error</h3>
       <p>
         ${evaluacion.mayorError}
       </p>`;

  }


  if(evaluacion.deberiaMejorar){

    html +=
      `<h3>📈 Qué debes mejorar</h3>
       <p>
         ${evaluacion.deberiaMejorar}
       </p>`;

  }


  if(evaluacion.consejo){

    html +=
      `<h3>💡 Consejo para la siguiente</h3>
       <p>
         ${evaluacion.consejo}
       </p>`;

  }


  contenedor.innerHTML =
    html;

}

async function obtenerEntrenamiento(){

  if(!sessionId){

    alert(
      "No se encontró la sesión de esta negociación."
    );

    return;

  }


  const boton =
    document.getElementById(
      "btnEntrenamiento"
    );

  const mensaje =
    document.getElementById(
      "mensajeEntrenamiento"
    );


  boton.disabled = true;

  boton.textContent =
    "🎯 Creando entrenamiento...";


  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu desempeño y creando ejercicios personalizados...
    </div>`;


  try{

    const respuesta =
      await fetch(
        API_URL +
        "?accion=entrenamiento&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            idioma:idiomaActual
          })
        }
      );


    const datos =
      await respuesta.json();


    if(!respuesta.ok){

      throw new Error(
        datos.error ||
        "No se pudo generar el entrenamiento."
      );

    }


    mostrarEntrenamiento(

      )
    );

    mensaje.innerHTML =

      </div>`;

  }finally{

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================

========================= */

function mostrarEntrenamiento(
  entrenamiento
){

  if(!entrenamiento){
    return;
  }


  entrenamientoActual =
    entrenamiento;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  localStorage.setItem(
    "ultimoEntrenamiento",
    JSON.stringify(entrenamiento)
  );


  document
    .getElementById("entrenamiento")
    .classList
    .remove("hidden");


  mostrarEjercicioActual();


  document
    .getElementById("entrenamiento")
    .scrollIntoView({

/* =========================
   EVALUAR EJERCICIO
========================= */

async function evaluarEjercicio(){

  if(!sessionId){

    alert(
      "No se encontró la sesión."
    );

    return;

  }


  if(!entrenamientoActual){
    return;
  }


  const textarea =
    document.getElementById(
      "respuestaEjercicio"
    );


  const respuesta =
    textarea.value.trim();


  if(!respuesta){

    document
      .getElementById("mensajeEjercicio")
      .innerHTML =
      `<div class="mensaje">
        Escribe una respuesta antes de continuar.
      </div>`;

    return;

  }


  const ejercicios =
    entrenamientoActual
      .ejercicios || [];


  const ejercicio =
    ejercicios[
      ejercicioActual
    ];


  const btn =
    document.getElementById(
      "btnResponderEjercicio"
    );


  const mensaje =
    document.getElementById(
      "mensajeEjercicio"
    );


  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";


  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu respuesta...
    </div>`;


  try{

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=ejercicio&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            numeroEjercicio:
              Number(
                ejercicio.numero
              ),

            respuesta:
              respuesta,

            idioma:
              idiomaActual

          })
        }
      );


    const datos =
      await respuestaAPI.json();


    if(!respuestaAPI.ok){

      throw new Error(
        datos.error ||
        "No se pudo evaluar el ejercicio."
      );

    }


    const resultado =
      datos.resultado;


    resultadosEjercicios.push(
      resultado
    );


    mostrarFeedbackEjercicio(
      resultado
    );


    /*
      +15 XP por ejercicio.
      La clave usa sesión + número
      de ejercicio para evitar duplicados.
    */

    otorgarXPUnico(

      "ejercicio-" +
      sessionId +
      "-" +
      ejercicio.numero,

      XP_EJERCICIO,

      "Ejercicio " +
      ejercicio.numero +
      " completado"

    );


  }catch(error){

    mensaje.innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

    btn.disabled = false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}

function mostrarResumenEntrenamiento(){

  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  const resultados =
    resultadosEjercicios;


  let promedio = 0;


  if(resultados.length){

    const suma =
      resultados.reduce(
        (total, resultado) =>
          total +
          Number(
            resultado.puntaje || 0
          ),
        0
      );


    promedio =
      Math.round(
        (
          suma /
          resultados.length
        ) * 10
      ) / 10;

  }


  let html =
    `<div class="success-message">

      <h3>
        🎉 Ejercicios completados

      <p>
        <strong>

    entrenamientoActual.retoFinal

      entrenamientoActual

          id="mensajeRetoFinal"

/* =========================
   RETO FINAL
========================= */

async function evaluarRetoFinal(){

  if(!sessionId){

    alert(
      "No se encontró la sesión."
    );

    return;

  }


  const textarea =
    document.getElementById(
      "respuestaRetoFinal"
    );


  const respuesta =
    textarea.value.trim();


  const mensaje =
    document.getElementById(
      "mensajeRetoFinal"
    );


  const resultadoContenedor =
    document.getElementById(
      "resultadoRetoFinal"
    );


  const btn =
    document.getElementById(
      "btnRetoFinal"
    );


  if(!respuesta){

    mensaje.innerHTML =
      `<div class="mensaje">
        Escribe una respuesta antes de evaluar el reto.
      </div>`;

    return;

  }


  btn.disabled = true;

  btn.textContent =
    "Evaluando reto final...";


  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu negociación final...
    </div>`;


  resultadoContenedor.innerHTML = "";


  try{

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=retoFinal&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            respuesta:
              respuesta,

            idioma:
              idiomaActual

          })
        }
      );


    const datos =
      await respuestaAPI.json();


    if(!respuestaAPI.ok){

      throw new Error(
        datos.error ||
        "No se pudo evaluar el reto final."
      );

    }


    mostrarResultadoRetoFinal(
      datos.resultado
    );


    let retos =
      JSON.parse(
        localStorage.getItem(
          "retosFinales"
        ) || "[]"
      );


    retos.push({

      fecha:
        new Date().toISOString(),

      puntaje:
        datos.resultado?.puntaje || 0,

      superado:
        !!datos.resultado?.superado

    });


    localStorage.setItem(
      "retosFinales",
      JSON.stringify(retos)
    );


    /*
      XP del reto final.
      Se da una sola vez por sesión.
    */

    const xpReto =
      datos.resultado?.superado
        ? XP_RETO_SUPERADO
        : XP_RETO_FALLADO;


    otorgarXPUnico(

      "reto-final-" +
      sessionId,

      xpReto,

      datos.resultado?.superado
        ? "Reto final superado"
        : "Reto final completado"

    );


    mensaje.innerHTML = "";


  }catch(error){

    mensaje.innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  }finally{

    btn.disabled = false;

    btn.textContent =
      "🏆 Evaluar reto final";

  }

}

/* =========================
   GUARDAR RESULTADOS
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
){

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  resultados.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      Number(puntaje || 0),

    evaluacion:
      evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(resultados)
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(historial)
  );


  localStorage.setItem(
    "contador",
    contador
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas(){

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  const retos =
    JSON.parse(
      localStorage.getItem(
        "retosFinales"
      ) || "[]"
    );


  const retosSuperados =
    retos.filter(
      reto => reto.superado
    ).length;


  if(!resultados.length){

    document
      .getElementById("estadisticas")
      .innerHTML =
      `
      <strong>
        Negociaciones:
      </strong>
      0

      <br>

      <strong>
        Promedio:
      </strong>
      0/100

      <br>

      <strong>
        Retos finales:
      </strong>
      0

      <br>

      <strong>
        Retos superados:
      </strong>
      0
      `;

    return;

  }


  const suma =
    resultados.reduce(
      (total, resultado) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );


  const promedio =
    Math.round(
      (
        suma /
        resultados.length
      ) * 10
    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        r => r.puntaje
      )
      .join(", ");


  document
    .getElementById("estadisticas")
    .innerHTML =
    `

    <strong>
      Negociaciones:
    </strong>

    ${resultados.length}

    <br>

    <strong>
      Promedio:
    </strong>

    ${promedio}/100

    <br>

    <strong>
      Últimos resultados:
    </strong>

    ${ultimos}

    <br>

    <strong>
      Retos finales:
    </strong>

    ${retos.length}

    <br>

    <strong>
      Retos superados:
    </strong>

    ${retosSuperados}

    `;

}


/* =========================
   REINICIAR
========================= */

function reiniciar(){

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar todo tu progreso, incluyendo XP, niveles y rangos?"
    );


  if(!confirmar){
    return;
  }


  localStorage.removeItem(
    "historial"
  );

  localStorage.removeItem(
    "contador"
  );

  localStorage.removeItem(
    "resultados"
  );

  localStorage.removeItem(
    "ultimoEntrenamiento"
  );

  localStorage.removeItem(
    "retosFinales"
  );

  localStorage.removeItem(
    "xpTotal"
  );

  localStorage.removeItem(
    "xpEventos"
  );


  historial = [];

  contador = 0;

  sessionId = null;

  entrenamientoActual = null;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  actualizarXP();

  actualizarEstadisticas();


  document
    .getElementById("chat")
    .innerHTML = "";


  document
    .getElementById("configuracion")
    .classList
    .remove("hidden");


  document
    .getElementById("negociacion")
    .classList
    .add("hidden");


  document
    .getElementById("resultado")
    .classList
    .add("hidden");


  document
    .getElementById("entrenamiento")
    .classList
    .add("hidden");

}

</script>
