<script>

const API_URL =
  "https://academia-negociacion-api.aispuroalberto546.workers.dev/";


let historial = [];

let contador = 0;

let sessionId = null;

let idiomaActual = "es";

let entrenamientoActual = null;

let ejercicioActual = 0;

let resultadosEjercicios = [];


/* =========================
   IDIOMA
========================= */

function obtenerIdioma() {

  const seleccionado =
    document.getElementById("idioma").value;

  if (
    seleccionado &&
    seleccionado !== "auto"
  ) {
    return seleccionado;
  }

  const navegador =
    navigator.language || "es";

  const idioma =
    navegador
      .split("-")[0]
      .toLowerCase();

  if (
    ["es", "en", "fr", "de", "pt"]
      .includes(idioma)
  ) {
    return idioma;
  }

  return "es";
}


/* =========================
   CARGAR PROGRESO
========================= */

historial =
  JSON.parse(
    localStorage.getItem("historial") || "[]"
  );

contador =
  Number(
    localStorage.getItem("contador") || 0
  );

actualizarEstadisticas();


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  const objetivo =
    document
      .getElementById("objetivo")
      .value
      .trim();

  const articulo =
    document
      .getElementById("articulo")
      .value
      .trim();

  const dificultad =
    document
      .getElementById("dificultad")
      .value;

  const tipo =
    document
      .getElementById("tipo")
      .value
      .trim();

  const presupuesto =
    document
      .getElementById("presupuesto")
      .value
      .trim();

  const cantidad =
    document
      .getElementById("cantidad")
      .value
      .trim();

  const contexto =
    document
      .getElementById("contexto")
      .value
      .trim();

  const condiciones =
    document
      .getElementById("condiciones")
      .value
      .trim();


  if (
    !objetivo ||
    !articulo
  ) {

    document
      .getElementById("mensajeInicio")
      .innerHTML =
        `
        <div class="mensaje">
          Escribe el objetivo y lo que estás negociando.
        </div>
        `;

    return;
  }


  idiomaActual =
    obtenerIdioma();


  const btn =
    document
      .getElementById("btnIniciar");

  btn.disabled = true;

  btn.textContent =
    "Preparando negociación...";


  try {

    const url =
      API_URL +
      "?accion=frase" +
      "&idioma=" +
      encodeURIComponent(idiomaActual) +
      "&objetivo=" +
      encodeURIComponent(objetivo) +
      "&articulo=" +
      encodeURIComponent(articulo) +
      "&dificultad=" +
      encodeURIComponent(dificultad) +
      "&tipo=" +
      encodeURIComponent(tipo) +
      "&presupuesto=" +
      encodeURIComponent(presupuesto) +
      "&cantidad=" +
      encodeURIComponent(cantidad) +
      "&contexto=" +
      encodeURIComponent(contexto) +
      "&condiciones=" +
      encodeURIComponent(condiciones);


    const respuesta =
      await fetch(url);


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo iniciar la negociación."
      );

    }


    sessionId =
      datos.sessionId;


    historial = [];


    document
      .getElementById("chat")
      .innerHTML = "";


    agregarOponente(
      datos.frase || ""
    );


    if (
      datos.situacion
    ) {

      document
        .getElementById("chat")
        .innerHTML +=
        `
        <div class="mensaje">
          <strong>Situación:</strong><br>
          ${datos.situacion}
        </div>
        `;

    }


    document
      .getElementById("configuracion")
      .classList.add("hidden");


    document
      .getElementById("resultado")
      .classList.add("hidden");


    document
      .getElementById("entrenamiento")
      .classList.add("hidden");


    document
      .getElementById("negociacion")
      .classList.remove("hidden");


  } catch (error) {

    document
      .getElementById("mensajeInicio")
      .innerHTML =
      `
      <div class="mensaje">
        Error: ${error.message}
      </div>
      `;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Comenzar negociación";

  }

}


/* =========================
   MOSTRAR OPONENTE
========================= */

function agregarOponente(texto) {

  const chat =
    document
      .getElementById("chat");


  chat.innerHTML +=
    `
    <div class="oponente">
      <strong>🤖 Oponente:</strong><br>
      ${texto}
    </div>
    `;


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   MOSTRAR USUARIO
========================= */

function agregarUsuario(texto) {

  const chat =
    document
      .getElementById("chat");


  chat.innerHTML +=
    `
    <div class="usuario">
      <strong>🧑 Tú:</strong><br>
      ${texto}
    </div>
    `;


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  const textarea =
    document
      .getElementById("respuesta");


  const texto =
    textarea.value.trim();


  if (!texto) {

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `
      <div class="mensaje">
        Por favor escribe algo antes de enviar.
      </div>
      `;

    return;
  }


  if (!sessionId) {

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `
      <div class="mensaje">
        No hay una negociación activa.
      </div>
      `;

    return;
  }


  document
    .getElementById("mensajeRespuesta")
    .innerHTML = "";


  agregarUsuario(texto);


  const btn =
    document
      .getElementById("btnEnviar");


  btn.disabled = true;

  btn.textContent =
    "El oponente está respondiendo...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=continuar",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              sessionId:
                sessionId,

              respuesta:
                texto,

              idioma:
                idiomaActual
            })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo continuar."
      );

    }


    agregarOponente(
      datos.frase || ""
    );


    textarea.value = "";


  } catch (error) {

    document
      .getElementById("mensajeRespuesta")
      .innerHTML =
      `
      <div class="mensaje">
        Error: ${error.message}
      </div>
      `;

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion() {

  if (!sessionId) {
    return;
  }


  const btn =
    document
      .getElementById("btnFinalizar");


  btn.disabled = true;

  btn.textContent =
    "Evaluando negociación...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evaluar",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              sessionId:
                sessionId,

              idioma:
                idiomaActual
            })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar."
      );

    }


    mostrarResultado(
      datos.evaluacion,
      datos.habilidadDebil
    );


  } catch (error) {

    alert(
      "Error al evaluar: " +
      error.message
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Finalizar negociación";

  }

}


/* =========================
   MOSTRAR RESULTADO
========================= */

function mostrarResultado(
  evaluacion,
  habilidadDebil
) {

  document
    .getElementById("negociacion")
    .classList.add("hidden");


  document
    .getElementById("resultado")
    .classList.remove("hidden");


  if (!evaluacion) {
    return;
  }


  document
    .getElementById("puntaje")
    .textContent =
    (evaluacion.puntaje || 0) +
    "/100";


  document
    .getElementById("feedback")
    .innerHTML =
    `
    <div class="mensaje">
      ${evaluacion.consejo || ""}
    </div>
    `;


  mostrarEvaluacion(
    evaluacion,
    habilidadDebil
  );


  contador++;


  historialResultadosGuardar(
    evaluacion.puntaje,
    evaluacion
  );


  actualizarEstadisticas();

}


/* =========================
   EVALUACIÓN
========================= */

function mostrarEvaluacion(
  evaluacion,
  habilidadDebil
) {

  const contenedor =
    document
      .getElementById("evaluacion");


  let html = "";


  if (habilidadDebil) {

    html +=
      `
      <div class="mensaje">

        <strong>
          🎯 Tu habilidad más débil:
        </strong>

        <br>

        ${habilidadDebil.nombre}

        (${habilidadDebil.puntaje}/100)

      </div>
      `;

  }


  if (
    evaluacion.habilidades
  ) {

    html +=
      `
      <h3>Habilidades</h3>

      <div class="skill-grid">
      `;


    const habilidades = {

      preparacion:
        "Preparación",

      anclaje:
        "Anclaje",

      preguntas:
        "Preguntas",

      argumentacion:
        "Argumentación",

      manejoPresion:
        "Manejo de presión",

      concesiones:
        "Concesiones",

      cierre:
        "Cierre"

    };


    for (
      const clave in habilidades
    ) {

      const puntaje =
        evaluacion
          .habilidades[clave] ??
        0;


      const esDebil =
        habilidadDebil &&
        habilidadDebil.clave ===
          clave;


      html +=
        `
        <div class="skill ${
          esDebil
            ? "debil"
            : ""
        }">

          <strong>
            ${habilidades[clave]}
          </strong>

          ${puntaje}/100

          ${
            esDebil
              ? " 🎯"
              : ""
          }

        </div>
        `;

    }


    html +=
      `</div>`;

  }


  if (
    evaluacion.queHizoBien
  ) {

    html +=
      `
      <h3>
        ✅ Qué hiciste bien
      </h3>

      <p>
        ${evaluacion.queHizoBien}
      </p>
      `;

  }


  if (
    evaluacion.queHizoMal
  ) {

    html +=
      `
      <h3>
        ❌ Qué hiciste mal
      </h3>

      <p>
        ${evaluacion.queHizoMal}
      </p>
      `;

  }


  if (
    evaluacion.mayorError
  ) {

    html +=
      `
      <h3>
        ⚠️ Tu mayor error
      </h3>

      <p>
        ${evaluacion.mayorError}
      </p>
      `;

  }


  if (
    evaluacion.deberiaMejorar
  ) {

    html +=
      `
      <h3>
        📈 Qué debes mejorar
      </h3>

      <p>
        ${evaluacion.deberiaMejorar}
      </p>
      `;

  }


  if (
    evaluacion.consejo
  ) {

    html +=
      `
      <h3>
        💡 Consejo
      </h3>

      <p>
        ${evaluacion.consejo}
      </p>
      `;

  }


  contenedor.innerHTML =
    html;

}


/* =========================
   ENTRENAMIENTO
========================= */

async function obtenerEntrenamiento() {

  if (!sessionId) {

    alert(
      "No se encontró la sesión de esta negociación."
    );

    return;
  }


  const boton =
    document
      .getElementById(
        "btnEntrenamiento"
      );


  const mensaje =
    document
      .getElementById(
        "mensajeEntrenamiento"
      );


  boton.disabled = true;

  boton.textContent =
    "🎯 Creando entrenamiento...";


  mensaje.innerHTML =
    `
    <div class="mensaje">
      Analizando tu desempeño y creando ejercicios personalizados...
    </div>
    `;


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=entrenamiento",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              sessionId:
                sessionId,

              idioma:
                idiomaActual
            })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo generar el entrenamiento."
      );

    }


    entrenamientoActual = {

      ejercicios:
        datos.ejercicios || [],

      habilidad:
        datos.habilidad || null

    };


    ejercicioActual = 0;

    resultadosEjercicios = [];


    mostrarEjercicioActual();


    document
      .getElementById(
        "entrenamiento"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "entrenamiento"
      )
      .scrollIntoView({
        behavior: "smooth"
      });


    mensaje.innerHTML = "";


  } catch (error) {

    mensaje.innerHTML =
      `
      <div class="mensaje">
        Error: ${error.message}
      </div>
      `;

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================
   MOSTRAR EJERCICIO
========================= */

function mostrarEjercicioActual() {

  const contenedor =
    document
      .getElementById(
        "contenidoEntrenamiento"
      );


  if (!entrenamientoActual) {
    return;
  }


  const ejercicios =
    entrenamientoActual.ejercicios ||
    [];


  if (
    ejercicioActual >=
    ejercicios.length
  ) {

    mostrarResumenEntrenamiento();

    return;
  }


  const ejercicio =
    ejercicios[
      ejercicioActual
    ];


  let html = "";


  if (
    entrenamientoActual.habilidad
  ) {

    html +=
      `
      <div class="mensaje">

        <strong>
          Habilidad:
        </strong>

        ${entrenamientoActual
          .habilidad
          .nombre || ""}

        <br><br>

        <strong>
          Puntaje actual:
        </strong>

        ${
          entrenamientoActual
            .habilidad
            .puntaje || 0
        }/100

      </div>
      `;

  }


  html +=
    `
    <div class="training-exercise">

      <div>
        <strong>
          Ejercicio
          ${ejercicioActual + 1}
          de
          ${ejercicios.length}
        </strong>
      </div>

      <h3>
        🥊
        ${ejercicio.titulo || "Ejercicio"}
      </h3>

      <p>
        <strong>
          Instrucción:
        </strong>
        <br>
        ${
          ejercicio.instruccion ||
          ""
        }
      </p>

      <p>
        <strong>
          Situación:
        </strong>
        <br>
        ${
          ejercicio.situacion ||
          ""
        }
      </p>

      <p>
        <strong>
          Qué debes hacer:
        </strong>
        <br>
        ${
          ejercicio.queDebeHacer ||
          ejercicio.respuestaEsperada ||
          ""
        }
      </p>

      <label>
        Tu respuesta
      </label>

      <textarea
        id="respuestaEjercicio"
        placeholder="Escribe exactamente lo que responderías..."
        onkeydown="manejarEnterEjercicio(event)"
      ></textarea>

      <button
        id="btnResponderEjercicio"
        onclick="evaluarEjercicio()"
      >
        Evaluar mi respuesta
      </button>

      <div id="mensajeEjercicio"></div>

    </div>
    `;


  contenedor.innerHTML =
    html;

}


/* =========================
   EVALUAR EJERCICIO
========================= */

async function evaluarEjercicio() {

  if (!sessionId) {
    return;
  }


  const textarea =
    document
      .getElementById(
        "respuestaEjercicio"
      );


  const respuesta =
    textarea.value.trim();


  if (!respuesta) {

    document
      .getElementById(
        "mensajeEjercicio"
      )
      .innerHTML =
      `
      <div class="mensaje">
        Escribe una respuesta antes de continuar.
      </div>
      `;

    return;
  }


  const ejercicio =
    entrenamientoActual
      .ejercicios[
        ejercicioActual
      ];


  const btn =
    document
      .getElementById(
        "btnResponderEjercicio"
      );


  const mensaje =
    document
      .getElementById(
        "mensajeEjercicio"
      );


  btn.disabled = true;

  btn.textContent =
    "Gemini está evaluando...";


  mensaje.innerHTML =
    `
    <div class="mensaje">
      Analizando tu respuesta...
    </div>
    `;


  try {

    const respuestaAPI =
      await fetch(
        API_URL +
        "?accion=ejercicio",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              sessionId:
                sessionId,

              respuesta:
                respuesta,

              ejercicio:
                ejercicio,

              idioma:
                idiomaActual

            })
        }
      );


    const datos =
      await respuestaAPI.json();


    if (!respuestaAPI.ok) {

      throw new Error(
        datos.error ||
        "No se pudo evaluar el ejercicio."
      );

    }


    const resultado =
      datos.resultado;


    resultadosEjercicios.push(
      resultado
    );


    mostrarFeedbackEjercicio(
      resultado
    );


  } catch (error) {

    mensaje.innerHTML =
      `
      <div class="mensaje">
        Error: ${error.message}
      </div>
      `;

    btn.disabled = false;

    btn.textContent =
      "Evaluar mi respuesta";

  }

}


/* =========================
   FEEDBACK EJERCICIO
========================= */

function mostrarFeedbackEjercicio(
  resultado
) {

  const contenedor =
    document
      .getElementById(
        "contenidoEntrenamiento"
      );


  let html =
    `
    <div class="exercise-feedback">

      <h3>
        📊 Tu resultado
      </h3>

      <div class="score">
        ${
          resultado.puntaje ||
          0
        }/100
      </div>

      <p>
        <strong>
          Qué hiciste bien:
        </strong>
        <br>
        ${

        }
      </p>

      <p>
        <strong>
          Qué debes mejorar:
        </strong>
        <br>
        ${

          ""
        }
      </p>

      <div class="improvement">

        <strong>
          💡 Una versión más fuerte:
        </strong>

        <p>
          ${
            resultado.mejorVersion ||
            ""
          }
        </p>

      </div>

      <p>
        <strong>
          🎯 Consejo:
        </strong>
        <br>
        ${

        }

  });

}


/* =========================
   SIGUIENTE EJERCICIO
========================= */

function siguienteEjercicio() {

  ejercicioActual++;

  mostrarEjercicioActual();

}


/* =========================
   ENTER EJERCICIO
========================= */

function manejarEnterEjercicio(
  event
) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    evaluarEjercicio();

  }

}


/* =========================
   RESUMEN ENTRENAMIENTO
========================= */

function mostrarResumenEntrenamiento() {

  const contenedor =
    document
      .getElementById(
        "contenidoEntrenamiento"
      );


  let promedio = 0;


  if (
    resultadosEjercicios.length
  ) {

    const suma =
      resultadosEjercicios.reduce(
        (
          total,
          resultado
        ) =>
          total +
          Number(
            resultado.puntaje || 0
          ),
        0
      );


    promedio =
      Math.round(
        (
          suma /
          resultadosEjercicios.length
        ) * 10
      ) / 10;

  }


  contenedor.innerHTML =
    `
    <div class="success-message">

      <h3>
        🎉 Entrenamiento completado
      </h3>

      <p>
        Terminaste los
        ${resultadosEjercicios.length}
        ejercicios.
      </p>

      <p>
        <strong>
          Promedio:
        </strong>

        ${promedio}/100
      </p>

    </div>

    <div class="challenge">

      <h3>
        🏆 Siguiente etapa
      </h3>

      <p>
        El entrenamiento ha terminado.
        El siguiente paso será convertir
        este entrenamiento en un reto final
        completamente interactivo.
      </p>

    </div>
    `;

}


/* =========================
   GUARDAR RESULTADOS
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  let resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  resultados.push({

    fecha:
      new Date().toISOString(),

    puntaje:
      puntaje,

    evaluacion:
      evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(
      resultados
    )
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(
      historial
    )
  );


  localStorage.setItem(
    "contador",
    contador
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem(
        "resultados"
      ) || "[]"
    );


  if (!resultados.length) {

    document
      .getElementById(
        "estadisticas"
      )
      .innerHTML =
      "Negociaciones: 0<br>Promedio: 0/100";

    return;
  }


  const suma =
    resultados.reduce(
      (
        total,
        resultado
      ) =>
        total +
        Number(
          resultado.puntaje || 0
        ),
      0
    );


  const promedio =
    Math.round(
      (
        suma /
        resultados.length
      ) * 10
    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(
        r => r.puntaje
      )
      .join(", ");


  document
    .getElementById(
      "estadisticas"
    )
    .innerHTML =
    `
    <strong>
      Negociaciones:
    </strong>

    ${resultados.length}

    <br>

    <strong>
      Promedio:
    </strong>

    ${promedio}/100

    <br>

    <strong>
      Últimos resultados:
    </strong>

    ${ultimos}
    `;

}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar todo tu progreso?"
    );


  if (!confirmar) {
    return;
  }


  localStorage.removeItem(
    "historial"
  );

  localStorage.removeItem(
    "contador"
  );

  localStorage.removeItem(
    "resultados"
  );


  historial = [];

  contador = 0;

  sessionId = null;

  entrenamientoActual = null;

  ejercicioActual = 0;

  resultadosEjercicios = [];


  actualizarEstadisticas();


  document
    .getElementById(
      "chat"
    )
    .innerHTML = "";


  document
    .getElementById(
      "configuracion"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "negociacion"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "resultado"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "entrenamiento"
    )
    .classList.add(
      "hidden"
    );

}

</script>
