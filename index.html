<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica de Negociación</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
  padding: 40px 20px;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1, h2, h3 {
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #3E63C7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.secondary {
  background: #555;
}

.training-button {
  background: #111;
}

.danger {
  background: #b42318;
}

.mensaje {
  padding: 12px;
  border-radius: 8px;
  background: #eee;
  margin-top: 15px;
}

.chat {
  margin-top: 20px;
}

.oponente {
  background: #eeeeee;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.usuario {
  background: #dfe8ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.score {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.skill {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
}

.skill strong {
  display: block;
  margin-bottom: 5px;
}

.debil {
  border: 3px solid #3E63C7;
  background: #eef2ff;
}

ul {
  padding-left: 20px;
}

.training-exercise {
  background: #f7f7f7;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
  border-left: 5px solid #3E63C7;
}

.training-exercise h3 {
  text-align: left;
  margin-top: 0;
}

.challenge {
  background: #111;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.hidden {
  display: none;
}

.small {
  font-size: 14px;
  color: #666;
}

@media (max-width: 600px) {
  .skill-grid {
    grid-template-columns: 1fr;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Práctica de Negociación</h1>

  <!-- CONFIGURACIÓN -->
  <div class="card" id="configuracion">

    <h2>Configura tu negociación</h2>

    <label>¿Qué quieres conseguir?</label>
    <input id="objetivo" placeholder="Ejemplo: Comprar por $1,000">

    <label>¿Qué estás negociando?</label>
    <input id="articulo" placeholder="Ejemplo: Una computadora">

    <label>Dificultad</label>
    <select id="dificultad">
      <option value="facil">Fácil</option>
      <option value="media" selected>Media</option>
      <option value="dificil">Difícil</option>
      <option value="experto">Experto</option>
    </select>

    <label>Tipo de negociación</label>
    <input id="tipo" placeholder="Ejemplo: Compra, venta, salario, negocio">

    <label>Presupuesto</label>
    <input id="presupuesto" placeholder="Opcional">

    <label>Cantidad</label>
    <input id="cantidad" placeholder="Opcional">

    <label>Contexto</label>
    <textarea id="contexto" placeholder="Opcional"></textarea>

    <label>Condiciones</label>
    <textarea id="condiciones" placeholder="Opcional"></textarea>

    <button id="btnIniciar" onclick="iniciarNegociacion()">
      Comenzar negociación
    </button>

    <div id="mensajeInicio"></div>

  </div>


  <!-- NEGOCIACIÓN -->
  <div class="card hidden" id="negociacion">

    <h2>Negociación</h2>

    <div id="chat" class="chat"></div>

    <label>Tu respuesta</label>

    <textarea
      id="respuesta"
      placeholder="Escribe lo que responderías..."
      onkeydown="manejarEnter(event)"
    ></textarea>

    <button id="btnEnviar" onclick="enviarRespuesta()">
      Enviar respuesta
    </button>

    <button
      id="btnFinalizar"
      class="secondary"
      onclick="finalizarNegociacion()"
    >
      Finalizar negociación
    </button>

    <div id="mensajeRespuesta"></div>

  </div>


  <!-- RESULTADO -->
  <div class="card hidden" id="resultado">

    <h2>Resultado</h2>

    <div class="score" id="puntaje"></div>

    <div id="feedback"></div>

    <div id="evaluacion"></div>

    <button
      id="btnEntrenamiento"
      class="training-button hidden"
      onclick="obtenerEntrenamiento()"
    >
      🎯 Entrenar mi habilidad más débil
    </button>

    <div id="mensajeEntrenamiento"></div>

  </div>


  <!-- ENTRENAMIENTO -->
  <div class="card hidden" id="entrenamiento">

    <h2>🎯 Entrenamiento personalizado</h2>

    <div id="contenidoEntrenamiento"></div>

  </div>


  <!-- PROGRESO -->
  <div class="card">

    <h2>Mi progreso</h2>

    <p id="estadisticas"></p>

    <button class="danger" onclick="reiniciar()">
      Reiniciar progreso
    </button>

  </div>

</div>


<script>

const API_URL =
"https://academia-negociacion-api.aispuroalberto546.workers.dev/";

let historial = [];
let contador = 0;

let sessionId = null;

let ultimaFrase = "";


/* =========================
   CARGAR PROGRESO
========================= */

historial = JSON.parse(
  localStorage.getItem("historial") || "[]"
);

contador = Number(
  localStorage.getItem("contador") || 0
);

actualizarEstadisticas();


/* =========================
   INICIAR NEGOCIACIÓN
========================= */

async function iniciarNegociacion() {

  const objetivo =
    document.getElementById("objetivo").value.trim();

  const articulo =
    document.getElementById("articulo").value.trim();

  const dificultad =
    document.getElementById("dificultad").value;

  const tipo =
    document.getElementById("tipo").value.trim();

  const presupuesto =
    document.getElementById("presupuesto").value.trim();

  const cantidad =
    document.getElementById("cantidad").value.trim();

  const contexto =
    document.getElementById("contexto").value.trim();

  const condiciones =
    document.getElementById("condiciones").value.trim();


  if (!objetivo || !articulo) {

    document.getElementById("mensajeInicio").innerHTML =
      `<div class="mensaje">
        Escribe el objetivo y lo que estás negociando.
      </div>`;

    return;
  }


  const btn =
    document.getElementById("btnIniciar");

  btn.disabled = true;
  btn.textContent = "Preparando negociación...";


  try {

    const url =
      API_URL +
      "?accion=frase" +
      "&objetivo=" + encodeURIComponent(objetivo) +
      "&articulo=" + encodeURIComponent(articulo) +
      "&dificultad=" + encodeURIComponent(dificultad) +
      "&tipo=" + encodeURIComponent(tipo) +
      "&presupuesto=" + encodeURIComponent(presupuesto) +
      "&cantidad=" + encodeURIComponent(cantidad) +
      "&contexto=" + encodeURIComponent(contexto) +
      "&condiciones=" + encodeURIComponent(condiciones);


    const respuesta =
      await fetch(url);

    const datos =
      await respuesta.json();


    if (!respuesta.ok) {
      throw new Error(
        datos.error || "No se pudo iniciar la negociación."
      );
    }


    sessionId = datos.sessionId;

    historial = [];

    ultimaFrase = "";


    document.getElementById("chat").innerHTML = "";

    agregarOponente(datos.respuesta);


    document.getElementById("configuracion")
      .classList.add("hidden");

    document.getElementById("resultado")
      .classList.add("hidden");

    document.getElementById("entrenamiento")
      .classList.add("hidden");

    document.getElementById("negociacion")
      .classList.remove("hidden");


  } catch (error) {

    document.getElementById("mensajeInicio").innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  } finally {

    btn.disabled = false;
    btn.textContent = "Comenzar negociación";

  }

}


/* =========================
   MOSTRAR OPONENTE
========================= */

function agregarOponente(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
    `<div class="oponente">
      <strong>🤖 Oponente:</strong><br>
      ${texto}
    </div>`;

  chat.scrollTop = chat.scrollHeight;
}


/* =========================
   MOSTRAR USUARIO
========================= */

function agregarUsuario(texto) {

  const chat =
    document.getElementById("chat");

  chat.innerHTML +=
    `<div class="usuario">
      <strong>🧑 Tú:</strong><br>
      ${texto}
    </div>`;

  chat.scrollTop = chat.scrollHeight;
}


/* =========================
   ENVIAR RESPUESTA
========================= */

async function enviarRespuesta() {

  const textarea =
    document.getElementById("respuesta");

  const texto =
    textarea.value.trim();


  if (!texto) {

    document.getElementById("mensajeRespuesta").innerHTML =
      `<div class="mensaje">
        Por favor escribe algo antes de enviar.
      </div>`;

    return;
  }


  if (!sessionId) {

    document.getElementById("mensajeRespuesta").innerHTML =
      `<div class="mensaje">
        No hay una negociación activa.
      </div>`;

    return;
  }


  document.getElementById("mensajeRespuesta").innerHTML = "";

  agregarUsuario(texto);

  historial.push({
    rol: "usuario",
    texto: texto
  });

  textarea.value = "";


  const btn =
    document.getElementById("btnEnviar");

  btn.disabled = true;
  btn.textContent = "El oponente está respondiendo...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=continuar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            historial: historial
          })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {
      throw new Error(
        datos.error || "No se pudo continuar."
      );
    }


    historial.push({
      rol: "oponente",
      texto: datos.respuesta
    });


    agregarOponente(datos.respuesta);


  } catch (error) {

    document.getElementById("mensajeRespuesta").innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  } finally {

    btn.disabled = false;
    btn.textContent = "Enviar respuesta";

  }

}


/* =========================
   ENTER
========================= */

function manejarEnter(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    enviarRespuesta();

  }

}


/* =========================
   FINALIZAR
========================= */

async function finalizarNegociacion() {

  if (!sessionId) {
    return;
  }


  const btn =
    document.getElementById("btnFinalizar");

  btn.disabled = true;
  btn.textContent = "Evaluando negociación...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=evaluar&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            historial: historial
          })
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {
      throw new Error(
        datos.error || "No se pudo evaluar."
      );
    }


    mostrarResultado(
      datos.puntaje,
      datos.feedback,
      datos.evaluacion
    );


  } catch (error) {

    alert(
      "Error al evaluar: " +
      error.message
    );

  } finally {

    btn.disabled = false;
    btn.textContent = "Finalizar negociación";

  }

}


/* =========================
   MOSTRAR RESULTADO
========================= */

function mostrarResultado(
  puntaje,
  feedback,
  evaluacion
) {

  document.getElementById("negociacion")
    .classList.add("hidden");

  document.getElementById("resultado")
    .classList.remove("hidden");


  document.getElementById("puntaje").textContent =
    puntaje + "/100";


  document.getElementById("feedback").innerHTML =
    `<div class="mensaje">
      ${feedback || ""}
    </div>`;


  mostrarEvaluacion(evaluacion);


  const botonEntrenamiento =
    document.getElementById("btnEntrenamiento");


  if (
    evaluacion &&
    evaluacion.habilidadMasDebil &&
    sessionId
  ) {

    botonEntrenamiento.classList.remove("hidden");

    botonEntrenamiento.textContent =
      "🎯 Entrenar " +
      evaluacion.habilidadMasDebil.nombre;

  } else {

    botonEntrenamiento.classList.add("hidden");

  }


  contador++;

  historialResultadosGuardar(
    puntaje,
    evaluacion
  );

  actualizarEstadisticas();

}


/* =========================
   EVALUACIÓN
========================= */

function mostrarEvaluacion(evaluacion) {

  const contenedor =
    document.getElementById("evaluacion");


  if (!evaluacion) {

    contenedor.innerHTML = "";

    return;
  }


  let html = "";


  if (evaluacion.habilidadMasDebil) {

    html +=
      `<div class="mensaje">
        <strong>🎯 Tu habilidad más débil:</strong><br>
        ${evaluacion.habilidadMasDebil.nombre}
        (${evaluacion.habilidadMasDebil.puntaje}/100)
      </div>`;

  }


  if (evaluacion.habilidades) {

    html += `<h3>Habilidades</h3>`;

    html += `<div class="skill-grid">`;


    const habilidades = {

      preparacion: "Preparación",

      anclaje: "Anclaje",

      preguntas: "Preguntas",

      argumentacion: "Argumentación",

      manejoPresion: "Manejo de presión",

      concesiones: "Concesiones",

      cierre: "Cierre"

    };


    for (const clave in habilidades) {

      const puntaje =
        evaluacion.habilidades[clave] ?? 0;


      const esDebil =
        evaluacion.habilidadMasDebil &&
        evaluacion.habilidadMasDebil.clave === clave;


      html +=
        `<div class="skill ${esDebil ? "debil" : ""}">
          <strong>
            ${habilidades[clave]}
          </strong>
          ${puntaje}/100
          ${esDebil ? " 🎯" : ""}
        </div>`;

    }


    html += `</div>`;

  }


  if (evaluacion.queHizoBien?.length) {

    html +=
      `<h3>✅ Qué hiciste bien</h3>
       <ul>`;

    evaluacion.queHizoBien.forEach(item => {

      html += `<li>${item}</li>`;

    });

    html += `</ul>`;

  }


  if (evaluacion.queHizoMal?.length) {

    html +=
      `<h3>❌ Qué hiciste mal</h3>
       <ul>`;

    evaluacion.queHizoMal.forEach(item => {

      html += `<li>${item}</li>`;

    });

    html += `</ul>`;

  }


  if (evaluacion.mayorError) {

    html +=
      `<h3>⚠️ Tu mayor error</h3>
       <p>${evaluacion.mayorError}</p>`;

  }


  if (evaluacion.deberiaMejorar) {

    html +=
      `<h3>📈 Qué debes mejorar</h3>
       <p>${evaluacion.deberiaMejorar}</p>`;

  }


  if (evaluacion.consejo) {

    html +=
      `<h3>💡 Consejo para la siguiente</h3>
       <p>${evaluacion.consejo}</p>`;

  }


  contenedor.innerHTML = html;

}


/* =========================
   ENTRENAMIENTO
========================= */

async function obtenerEntrenamiento() {

  if (!sessionId) {

    alert(
      "No se encontró la sesión de esta negociación."
    );

    return;
  }


  const boton =
    document.getElementById("btnEntrenamiento");

  const mensaje =
    document.getElementById("mensajeEntrenamiento");


  boton.disabled = true;
  boton.textContent =
    "🎯 Creando entrenamiento...";

  mensaje.innerHTML =
    `<div class="mensaje">
      Analizando tu desempeño y creando ejercicios personalizados...
    </div>`;


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=entrenamiento&sessionId=" +
        encodeURIComponent(sessionId),
        {
          method: "POST"
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "No se pudo generar el entrenamiento."
      );

    }


    mostrarEntrenamiento(
      datos.entrenamiento
    );


    localStorage.setItem(
      "ultimoEntrenamiento",
      JSON.stringify(datos.entrenamiento)
    );


    mensaje.innerHTML = "";


  } catch (error) {

    mensaje.innerHTML =
      `<div class="mensaje">
        Error: ${error.message}
      </div>`;

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🎯 Entrenar mi habilidad más débil";

  }

}


/* =========================
   MOSTRAR ENTRENAMIENTO
========================= */

function mostrarEntrenamiento(entrenamiento) {

  if (!entrenamiento) {
    return;
  }


  const contenedor =
    document.getElementById(
      "contenidoEntrenamiento"
    );


  let html = "";


  html +=
    `<div class="mensaje">
      <strong>
        Habilidad:
      </strong>
      ${entrenamiento.nombreHabilidad || entrenamiento.habilidad}
      <br><br>

      <strong>
        Puntaje actual:
      </strong>
      ${entrenamiento.puntajeActual}/100
    </div>`;


  if (entrenamiento.objetivo) {

    html +=
      `<h3>🎯 Objetivo</h3>
       <p>
        ${entrenamiento.objetivo}
       </p>`;

  }


  if (entrenamiento.explicacion) {

    html +=
      `<h3>📚 Aprende primero</h3>
       <p>
        ${entrenamiento.explicacion}
       </p>`;

  }


  if (
    entrenamiento.ejercicios &&
    entrenamiento.ejercicios.length
  ) {

    html +=
      `<h3>🥊 Ejercicios</h3>`;


    entrenamiento.ejercicios.forEach(
      ejercicio => {

        html +=
          `<div class="training-exercise">

            <h3>
              Ejercicio ${ejercicio.numero}:
              ${ejercicio.titulo}
            </h3>

            <p>
              <strong>Instrucción:</strong><br>
              ${ejercicio.instruccion}
            </p>

            <p>
              <strong>Situación:</strong><br>
              ${ejercicio.situacion}
            </p>

            <p>
              <strong>Qué debes hacer:</strong><br>
              ${ejercicio.queDebeHacer}
            </p>

          </div>`;

      }
    );

  }


  if (entrenamiento.retoFinal) {

    const reto =
      entrenamiento.retoFinal;


    html +=
      `<div class="challenge">

        <h3>
          🏆 Reto final
        </h3>

        <h3>
          ${reto.titulo}
        </h3>

        <p>
          <strong>Situación:</strong><br>
          ${reto.situacion}
        </p>

        <p>
          <strong>Instrucción:</strong><br>
          ${reto.instruccion}
        </p>

        <p>
          <strong>Criterio de éxito:</strong><br>
          ${reto.criterioExito}
        </p>

      </div>`;

  }


  contenedor.innerHTML = html;


  document.getElementById("entrenamiento")
    .classList.remove("hidden");


  document.getElementById("entrenamiento")
    .scrollIntoView({
      behavior: "smooth"
    });

}


/* =========================
   GUARDAR RESULTADOS
========================= */

function historialResultadosGuardar(
  puntaje,
  evaluacion
) {

  let resultados =
    JSON.parse(
      localStorage.getItem("resultados") || "[]"
    );


  resultados.push({

    fecha: new Date().toISOString(),

    puntaje: puntaje,

    evaluacion: evaluacion

  });


  localStorage.setItem(
    "resultados",
    JSON.stringify(resultados)
  );


  localStorage.setItem(
    "historial",
    JSON.stringify(historial)
  );


  localStorage.setItem(
    "contador",
    contador
  );

}


/* =========================
   ESTADÍSTICAS
========================= */

function actualizarEstadisticas() {

  const resultados =
    JSON.parse(
      localStorage.getItem("resultados") || "[]"
    );


  if (!resultados.length) {

    document.getElementById("estadisticas").innerHTML =
      "Negociaciones: 0<br>Promedio: 0/100";

    return;
  }


  const suma =
    resultados.reduce(
      (total, resultado) =>
        total + Number(resultado.puntaje || 0),
      0
    );


  const promedio =
    Math.round(
      (suma / resultados.length) * 10
    ) / 10;


  const ultimos =
    resultados
      .slice(-6)
      .reverse()
      .map(r => r.puntaje)
      .join(", ");


  document.getElementById("estadisticas").innerHTML =
    `
    <strong>Negociaciones:</strong>
    ${resultados.length}
    <br>

    <strong>Promedio:</strong>
    ${promedio}/100
    <br>

    <strong>Últimos resultados:</strong>
    ${ultimos}
    `;

}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

  const confirmar =
    confirm(
      "¿Seguro que quieres borrar todo tu progreso?"
    );


  if (!confirmar) {
    return;
  }


  localStorage.removeItem("historial");
  localStorage.removeItem("contador");
  localStorage.removeItem("resultados");
  localStorage.removeItem("ultimoEntrenamiento");


  historial = [];
  contador = 0;
  sessionId = null;


  actualizarEstadisticas();


  document.getElementById("chat").innerHTML = "";

  document.getElementById("configuracion")
    .classList.remove("hidden");

  document.getElementById("negociacion")
    .classList.add("hidden");

  document.getElementById("resultado")
    .classList.add("hidden");

  document.getElementById("entrenamiento")
    .classList.add("hidden");

}


/* =========================
   FIN
========================= */

</script>

</body>
</html>
