<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Business Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 7px 0 0;
      color: #bbb;
      font-size: 14px;
    }

    .contenedor {
      max-width: 850px;
      margin: 0 auto;
      padding: 35px 18px 60px;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-principal {
      width: 100%;
      background: #111;
      color: white;
      font-size: 17px;
      padding: 16px;
      margin-top: 22px;
    }

    .btn-secundario {
      background: #eee;
      color: #111;
    }

    .btn-finalizar {
      background: #d9e4ff;
      color: #183b87;
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .mensaje {
      padding: 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .oponente {
      align-self: flex-start;
      background: #eee;
    }

    .usuario {
      align-self: flex-end;
      background: #111;
      color: white;
    }

    .oculto {
      display: none;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .resultado {
      background: #f5f7ff;
      border-radius: 14px;
      padding: 18px;
      margin-top: 18px;
    }

    .puntaje {
      font-size: 42px;
      font-weight: bold;
      margin: 5px 0 10px;
    }

    .estado {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      min-height: 18px;
    }

    .personalizar {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .link-config {
      background: transparent;
      color: #555;
      padding: 5px 0;
      font-size: 14px;
    }

    .feedback-estrellas {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .estrella {
      background: #eee;
      font-size: 20px;
      padding: 8px 11px;
    }

    .estrella.activa {
      background: #111;
      color: white;
    }

    .historial-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .fila {
        grid-template-columns: 1fr;
      }

      .contenedor {
        padding: 20px 12px 50px;
      }

      .tarjeta {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AI Business Academy</h1>
  <p>Aprende · Practica · Compite · Mejora · Crea · Ejecuta</p>
</header>

<div class="contenedor">

  <!-- INICIO -->
  <section id="pantallaInicio" class="tarjeta">

    <h2>🤝 Negociar</h2>

    <label for="objetivo">
      ¿Qué quieres conseguir?
    </label>

    <input
      id="objetivo"
      type="text"
      placeholder="Ej. Conseguir el mejor precio posible"
    >

    <label for="articulo">
      ¿Qué quieres negociar?
    </label>

    <input
      id="articulo"
      type="text"
      placeholder="Ej. Comprar 100 relojes"
    >

    <label for="dificultad">
      Dificultad
    </label>

    <select id="dificultad">
      <option value="facil">Fácil</option>
      <option value="medio" selected>Medio</option>
      <option value="dificil">Difícil</option>
    </select>

    <button
      id="btnPersonalizar"
      class="link-config"
      onclick="mostrarPersonalizacion()"
    >
      ⚙️ Personalizar más
    </button>

    <div id="personalizacion" class="personalizar oculto">

      <div class="fila">

        <div>
          <label for="tipo">
            Tipo de negociación
          </label>

          <input
            id="tipo"
            type="text"
            placeholder="Ej. Compra"
          >
        </div>

        <div>
          <label for="presupuesto">
            Presupuesto
          </label>

          <input
            id="presupuesto"
            type="text"
            placeholder="Ej. $7,000"
          >
        </div>

      </div>

      <div class="fila">

        <div>
          <label for="cantidad">
            Cantidad
          </label>

          <input
            id="cantidad"
            type="text"
            placeholder="Ej. 100 unidades"
          >
        </div>

        <div>
          <label for="contexto">
            Contexto
          </label>

          <select id="contexto">
            <option value="todos">
              General
            </option>

            <option value="Negociación de precio">
              Negociación de precio
            </option>

            <option value="Buscando acuerdo">
              Buscando acuerdo
            </option>

            <option value="Cerrando el trato">
              Cerrando el trato
            </option>
          </select>
        </div>

      </div>

      <label for="condiciones">
        Condiciones o límites
      </label>

      <textarea
        id="condiciones"
        placeholder="Ej. Necesito entrega en 30 días"
      ></textarea>

    </div>

    <button
      id="btnIniciar"
      class="btn-principal"
      onclick="iniciarNegociacion()"
    >
      🚀 Empezar negociación
    </button>

    <div id="estadoInicio" class="estado"></div>

  </section>


  <!-- NEGOCIACIÓN -->
  <section id="pantallaNegociacion" class="tarjeta oculto">

    <h2>🤝 Negociación</h2>

    <div id="chat" class="chat"></div>

    <textarea
      id="respuestaUsuario"
      placeholder="Escribe tu respuesta..."
    ></textarea>

    <button
      id="btnEnviar"
      class="btn-principal"
      onclick="enviarMensaje()"
    >
      Enviar respuesta
    </button>

    <button
      id="btnFinalizar"
      class="btn-finalizar"
      onclick="finalizarNegociacion()"
    >
      Finalizar negociación
    </button>

    <div id="estadoChat" class="estado"></div>

  </section>


  <!-- RESULTADO -->
  <section id="pantallaResultado" class="tarjeta oculto">

    <h2>🎓 Resultado</h2>

    <div class="resultado">

      <div>Puntaje</div>

      <div id="puntaje" class="puntaje">
        -
      </div>

      <div id="feedback">
        Evaluando...
      </div>

    </div>

    <button
      class="btn-principal"
      onclick="nuevaNegociacion()"
    >
      🔄 Nueva negociación
    </button>

  </section>


  <!-- FEEDBACK -->
  <section id="pantallaFeedback" class="tarjeta oculto">

    <h2>⭐ ¿Qué te pareció?</h2>

    <p>
      Tu opinión nos ayuda a mejorar la academia.
    </p>

    <div class="feedback-estrellas">

      <button
        class="estrella"
        onclick="seleccionarEstrella(1)"
      >
        ★
      </button>

      <button
        class="estrella"
        onclick="seleccionarEstrella(2)"
      >
        ★
      </button>

      <button
        class="estrella"
        onclick="seleccionarEstrella(3)"
      >
        ★
      </button>

      <button
        class="estrella"
        onclick="seleccionarEstrella(4)"
      >
        ★
      </button>

      <button
        class="estrella"
        onclick="seleccionarEstrella(5)"
      >
        ★
      </button>

    </div>

    <textarea
      id="comentarioFeedback"
      placeholder="¿Qué mejorarías?"
    ></textarea>

    <button
      class="btn-principal"
      onclick="enviarFeedback()"
    >
      Enviar opinión
    </button>

    <div id="estadoFeedback" class="estado"></div>

  </section>


  <!-- HISTORIAL -->
  <section class="tarjeta">

    <h2>📚 Tu progreso</h2>

    <p>
      Negociaciones completadas:
      <strong id="contadorNegociaciones">0</strong>
    </p>

    <p>
      Promedio:
      <strong id="promedioPuntaje">-</strong>
    </p>

    <div id="historialResultados"></div>

    <button
      class="btn-secundario"
      onclick="reiniciarProgreso()"
    >
      Reiniciar progreso
    </button>

  </section>

</div>


<script>

  // =========================================================
  // CONFIGURACIÓN
  // =========================================================

  const API =
    "https://academia-negociacion-api.aispuroalberto546.workers.dev/";

  let sessionId = "";

  let historial = [];

  let puntajes =
    JSON.parse(
      localStorage.getItem("puntajes") || "[]"
    );

  let historialResultados =
    JSON.parse(
      localStorage.getItem("historialResultados") || "[]"
    );

  let negociacionActiva = false;

  let negociacionFinalizada = false;

  let estrellasSeleccionadas = 0;


  // =========================================================
  // INICIO
  // =========================================================

  function mostrarPersonalizacion() {

    const elemento =
      document.getElementById("personalizacion");

    elemento.classList.toggle("oculto");

  }


  function obtenerEscenario() {

    return {

      contexto:
        document.getElementById("contexto").value,

      dificultad:
        document.getElementById("dificultad").value,

      objetivo:
        document.getElementById("objetivo").value.trim(),

      tipo:
        document.getElementById("tipo").value.trim(),

      articulo:
        document.getElementById("articulo").value.trim(),

      presupuesto:
        document.getElementById("presupuesto").value.trim(),

      cantidad:
        document.getElementById("cantidad").value.trim(),

      condiciones:
        document.getElementById("condiciones").value.trim()

    };

  }


  function construirParametrosEscenario() {

    const escenario =
      obtenerEscenario();

    const params =
      new URLSearchParams();

    params.set(
      "contexto",
      escenario.contexto
    );

    params.set(
      "dificultad",
      escenario.dificultad
    );

    params.set(
      "objetivo",
      escenario.objetivo
    );

    params.set(
      "tipo",
      escenario.tipo
    );

    params.set(
      "articulo",
      escenario.articulo
    );

    params.set(
      "presupuesto",
      escenario.presupuesto
    );

    params.set(
      "cantidad",
      escenario.cantidad
    );

    params.set(
      "condiciones",
      escenario.condiciones
    );

    return params;

  }


  // =========================================================
  // INICIAR NEGOCIACIÓN
  // =========================================================

  async function iniciarNegociacion() {

    const objetivo =
      document.getElementById("objetivo")
        .value.trim();

    const articulo =
      document.getElementById("articulo")
        .value.trim();

    if (!objetivo) {

      alert(
        "Escribe qué quieres conseguir."
      );

      return;

    }

    if (!articulo) {

      alert(
        "Escribe qué quieres negociar."
      );

      return;

    }


    const btn =
      document.getElementById("btnIniciar");

    const estado =
      document.getElementById("estadoInicio");


    btn.disabled = true;

    estado.textContent =
      "Creando negociación...";


    try {

      const params =
        construirParametrosEscenario();

      const respuesta =
        await fetch(
          API + "?" + params.toString()
        );


      if (!respuesta.ok) {

        throw new Error(
          "El servidor respondió con error."
        );

      }


      const datos =
        await respuesta.json();


      if (!datos.respuesta) {

        throw new Error(
          datos.error ||
          "No se recibió respuesta."
        );

      }


      // Guardamos el ID secreto de la sesión
      sessionId =
        datos.sessionId || "";


      if (!sessionId) {

        throw new Error(
          "El servidor no devolvió sessionId."
        );

      }


      historial = [

        {
          rol: "oponente",
          texto: datos.respuesta
        }

      ];


      negociacionActiva = true;

      negociacionFinalizada = false;


      document
        .getElementById("pantallaInicio")
        .classList.add("oculto");


      document
        .getElementById("pantallaResultado")
        .classList.add("oculto");


      document
        .getElementById("pantallaFeedback")
        .classList.add("oculto");


      document
        .getElementById("pantallaNegociacion")
        .classList.remove("oculto");


      renderizarChat();


      document
        .getElementById("respuestaUsuario")
        .focus();


    } catch (error) {

      console.error(error);

      estado.textContent =
        "No se pudo iniciar la negociación. Intenta nuevamente.";

    } finally {

      btn.disabled = false;

    }

  }


  // =========================================================
  // MOSTRAR CHAT
  // =========================================================

  function escaparHTML(texto) {

    const div =
      document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;

  }


  function renderizarChat() {

    const chat =
      document.getElementById("chat");

    chat.innerHTML = "";


    historial.forEach(mensaje => {

      const div =
        document.createElement("div");


      div.className =
        "mensaje " +
        (
          mensaje.rol === "usuario"
            ? "usuario"
            : "oponente"
        );


      div.innerHTML =
        escaparHTML(
          mensaje.texto
        );


      chat.appendChild(div);

    });


    chat.scrollTop =
      chat.scrollHeight;

  }


  // =========================================================
  // ENVIAR MENSAJE
  // =========================================================

  async function enviarMensaje() {

    if (!negociacionActiva) {
      return;
    }

    const textarea =
      document.getElementById(
        "respuestaUsuario"
      );

    const texto =
      textarea.value.trim();


    if (!texto) {

      alert(
        "Escribe una respuesta antes de enviar."
      );

      return;

    }


    const btn =
      document.getElementById(
        "btnEnviar"
      );

    const estado =
      document.getElementById(
        "estadoChat"
      );


    btn.disabled = true;

    estado.textContent =
      "El oponente está pensando...";


    historial.push({

      rol: "usuario",
      texto

    });


    renderizarChat();

    textarea.value = "";


    try {

      const params =
        construirParametrosEscenario();


      params.set(
        "accion",
        "continuar"
      );


      params.set(
        "sessionId",
        sessionId
      );


      params.set(
        "historial",
        JSON.stringify(historial)
      );


      const respuesta =
        await fetch(
          API + "?" + params.toString()
        );


      if (!respuesta.ok) {

        throw new Error(
          "Error del servidor."
        );

      }


      const datos =
        await respuesta.json();


      if (!datos.respuesta) {

        throw new Error(
          datos.error ||
          "No se recibió respuesta."
        );

      }


      historial.push({

        rol: "oponente",
        texto: datos.respuesta

      });


      renderizarChat();


    } catch (error) {

      console.error(error);

      estado.textContent =
        "No se pudo obtener respuesta. Intenta nuevamente.";


      // Quitamos el mensaje del usuario
      // para que pueda volver a enviarlo.
      historial.pop();

      renderizarChat();


    } finally {

      btn.disabled = false;

      estado.textContent = "";

      textarea.focus();

    }

  }


  // =========================================================
  // ENTER PARA ENVIAR
  // =========================================================

  document
    .getElementById("respuestaUsuario")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          enviarMensaje();

        }

      }
    );


  // =========================================================
  // FINALIZAR
  // =========================================================

  async function finalizarNegociacion() {

    if (
      !negociacionActiva ||
      negociacionFinalizada
    ) {

      return;

    }


    if (historial.length < 2) {

      alert(
        "Primero debes tener al menos un intercambio."
      );

      return;

    }


    const confirmar =
      confirm(
        "¿Quieres finalizar esta negociación?"
      );


    if (!confirmar) {
      return;
    }


    negociacionFinalizada = true;

    negociacionActiva = false;


    const btnFinalizar =
      document.getElementById(
        "btnFinalizar"
      );

    const btnEnviar =
      document.getElementById(
        "btnEnviar"
      );

    const estado =
      document.getElementById(
        "estadoChat"
      );


    btnFinalizar.disabled = true;

    btnEnviar.disabled = true;

    estado.textContent =
      "Evaluando tu negociación...";


    try {

      const params =
        construirParametrosEscenario();


      params.set(
        "accion",
        "evaluar"
      );


      params.set(
        "sessionId",
        sessionId
      );


      params.set(
        "historial",
        JSON.stringify(historial)
      );


      const respuesta =
        await fetch(
          API + "?" + params.toString()
        );


      if (!respuesta.ok) {

        throw new Error(
          "Error al evaluar."
        );

      }


      const datos =
        await respuesta.json();


      if (
        typeof datos.puntaje !==
        "number"
      ) {

        throw new Error(
          datos.error ||
          "No se recibió evaluación."
        );

      }


      mostrarResultado(
        datos.puntaje,
        datos.feedback
      );


    } catch (error) {

      console.error(error);

      alert(
        "No se pudo evaluar la negociación. Intenta nuevamente."
      );


      negociacionFinalizada = false;

      negociacionActiva = true;

      btnFinalizar.disabled = false;

      btnEnviar.disabled = false;

      estado.textContent = "";

    }

  }


  // =========================================================
  // RESULTADO
  // =========================================================

  function mostrarResultado(
    puntaje,
    feedback
  ) {

    document
      .getElementById("pantallaNegociacion")
      .classList.add("oculto");


    document
      .getElementById("pantallaResultado")
      .classList.remove("oculto");


    document
      .getElementById("pantallaFeedback")
      .classList.remove("oculto");


    document
      .getElementById("puntaje")
      .textContent =
      puntaje + "/10";


    document
      .getElementById("feedback")
      .textContent =
      feedback;


    puntajes.push(puntaje);


    localStorage.setItem(
      "puntajes",
      JSON.stringify(puntajes)
    );


    historialResultados.unshift({

      fecha:
        new Date().toLocaleString(),

      puntaje

    });


    historialResultados =
      historialResultados.slice(
        0,
        20
      );


    localStorage.setItem(
      "historialResultados",
      JSON.stringify(
        historialResultados
      )
    );


    actualizarProgreso();

  }


  // =========================================================
  // FEEDBACK
  // =========================================================

  function seleccionarEstrella(numero) {

    estrellasSeleccionadas =
      numero;


    const estrellas =
      document.querySelectorAll(
        ".estrella"
      );


    estrellas.forEach(
      (estrella, index) => {

        estrella.classList.toggle(
          "activa",
          index < numero
        );

      }
    );

  }


  async function enviarFeedback() {

    if (!estrellasSeleccionadas) {

      alert(
        "Selecciona una calificación."
      );

      return;

    }


    const comentario =
      document
        .getElementById(
          "comentarioFeedback"
        )
        .value.trim();


    const estado =
      document.getElementById(
        "estadoFeedback"
      );


    try {

      const respuesta =
        await fetch(
          API + "?accion=feedback",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              rating:
                estrellasSeleccionadas,

              comentario

            })

          }
        );


      const datos =
        await respuesta.json();


      if (!respuesta.ok) {

        throw new Error(
          datos.error ||
          "No se pudo guardar."
        );

      }


      estado.textContent =
        "Gracias por tu opinión.";

    } catch (error) {

      console.error(error);

      estado.textContent =
        "No se pudo enviar la opinión.";

    }

  }


  // =========================================================
  // NUEVA NEGOCIACIÓN
  // =========================================================

  function nuevaNegociacion() {

    sessionId = "";

    historial = [];

    negociacionActiva = false;

    negociacionFinalizada = false;

    estrellasSeleccionadas = 0;


    document
      .getElementById(
        "pantallaResultado"
      )
      .classList.add("oculto");


    document
      .getElementById(
        "pantallaFeedback"
      )
      .classList.add("oculto");


    document
      .getElementById(
        "pantallaNegociacion"
      )
      .classList.add("oculto");


    document
      .getElementById(
        "pantallaInicio"
      )
      .classList.remove("oculto");


    document
      .getElementById(
        "respuestaUsuario"
      )
      .value = "";


    document
      .getElementById(
        "comentarioFeedback"
      )
      .value = "";


    document
      .querySelectorAll(
        ".estrella"
      )
      .forEach(
        estrella =>
          estrella.classList.remove(
            "activa"
          )
      );

  }


  // =========================================================
  // PROGRESO
  // =========================================================

  function actualizarProgreso() {

    const contador =
      document.getElementById(
        "contadorNegociaciones"
      );


    const promedio =
      document.getElementById(
        "promedioPuntaje"
      );


    contador.textContent =
      puntajes.length;


    if (!puntajes.length) {

      promedio.textContent =
        "-";

    } else {

      const suma =
        puntajes.reduce(
          (a, b) => a + b,
          0
        );


      promedio.textContent =
        (
          suma / puntajes.length
        ).toFixed(1) + "/10";

    }


    const lista =
      document.getElementById(
        "historialResultados"
      );


    lista.innerHTML = "";


    historialResultados.forEach(
      resultado => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "historial-item";


        div.textContent =
          `${resultado.fecha} — ${resultado.puntaje}/10`;


        lista.appendChild(div);

      }
    );

  }


  // =========================================================
  // REINICIAR
  // =========================================================

  function reiniciarProgreso() {

    const confirmar =
      confirm(
        "¿Seguro que quieres borrar tu progreso?"
      );


    if (!confirmar) {
      return;
    }


    localStorage.removeItem(
      "puntajes"
    );

    localStorage.removeItem(
      "historialResultados"
    );


    puntajes = [];

    historialResultados = [];


    actualizarProgreso();

  }


  // =========================================================
  // INICIALIZAR
  // =========================================================

  actualizarProgreso();

</script>

</body>
</html>
