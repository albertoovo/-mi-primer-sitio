<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
      background-color: #f2f2f2;
    }
    button {
      background-color: #3E63C7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #b0b8d1;
      cursor: not-allowed;
    }
    #chat {
      max-width: 500px;
      margin: 20px auto;
      text-align: left;
      background: white;
      border-radius: 8px;
      padding: 15px;
      min-height: 100px;
    }
    .burbuja {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      margin: 8px 0;
      line-height: 1.4;
    }
    .cliente {
      background-color: #f0e0e0;
      color: #7a2020;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }
    .usuario {
      background-color: #dce4f7;
      color: #1f3a8a;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .escribiendo {
      font-style: italic;
      color: #888;
      margin: 8px 0;
    }
    #sugerencia {
      max-width: 500px;
      margin: 10px auto;
      font-size: 14px;
      color: #666;
    }
    #limiteDiario {
      max-width: 500px;
      margin: 10px auto;
      font-size: 14px;
      color: #555;
    }
    #limiteDiario.alcanzado {
      color: #b03030;
      font-weight: bold;
    }
    #resultado { max-width: 500px; margin: 15px auto; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Práctica de Negociación</h1>
  <p id="limiteDiario"></p>
  <select id="filtro">
    <option value="todos">Todos los contextos</option>
    <option value="Negociación de precio">Negociación de precio</option>
    <option value="Buscando acuerdo">Buscando acuerdo</option>
    <option value="Cerrando el trato">Cerrando el trato</option>
  </select>
  <select id="dificultad">
    <option value="facil">Fácil</option>
    <option value="medio" selected>Medio</option>
    <option value="dificil">Difícil</option>
  </select>
  <br>
  <button id="btnIniciar" onclick="iniciarNegociacion()">Iniciar negociación</button>

  <div id="chat"></div>
  <p id="sugerencia"></p>

  <textarea id="mensaje" placeholder="Escribe tu respuesta aquí..."></textarea><br>
  <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
  <button onclick="finalizarNegociacion()">Finalizar negociación</button>

  <p id="resultado"></p>
  <p id="promedio">Promedio: sin datos aún</p>
  <h3>Historial de negociaciones</h3>
  <ul id="historial"></ul>
  <button onclick="reiniciar()">Reiniciar progreso</button>

  <script>
    let conversacion = [];
    let puntajes = [];
    let historial = [];
    const WORKER = "https://academia-negociacion-api.aispuroalberto546.workers.dev/";
    const LIMITE_DIARIO = 15;

    function fechaHoy() {
      return new Date().toISOString().split("T")[0];
    }

    function obtenerUsoHoy() {
      const fechaGuardada = localStorage.getItem("fechaUso");
      if (fechaGuardada !== fechaHoy()) {
        localStorage.setItem("fechaUso", fechaHoy());
        localStorage.setItem("usoHoy", "0");
        return 0;
      }
      return parseInt(localStorage.getItem("usoHoy") || "0");
    }

    function mostrarLimiteDiario() {
      const usoHoy = obtenerUsoHoy();
      const elemento = document.getElementById("limiteDiario");
      const btnIniciar = document.getElementById("btnIniciar");

      if (usoHoy >= LIMITE_DIARIO) {
        elemento.innerText = "Alcanzaste tu límite diario de práctica (" + LIMITE_DIARIO + "). Vuelve mañana para seguir.";
        elemento.classList.add("alcanzado");
        btnIniciar.disabled = true;
      } else {
        elemento.innerText = "Negociaciones usadas hoy: " + usoHoy + "/" + LIMITE_DIARIO;
        elemento.classList.remove("alcanzado");
        btnIniciar.disabled = false;
      }
    }

    function registrarUso() {
      const usoHoy = obtenerUsoHoy();
      localStorage.setItem("usoHoy", (usoHoy + 1).toString());
      mostrarLimiteDiario();
    }

    function calcularYMostrarPromedio() {
      const validos = puntajes.filter(p => typeof p === "number" && !isNaN(p));
      if (validos.length === 0) {
        document.getElementById("promedio").innerText = "Promedio: sin datos aún";
        return;
      }
      const suma = validos.reduce((total, p) => total + p, 0);
      const promedio = (suma / validos.length).toFixed(1);
      document.getElementById("promedio").innerText = "Promedio: " + promedio + "/10 (" + validos.length + " negociaciones)";
    }

    function renderChat(escribiendo) {
      let html = conversacion.map(m =>
        `<div class="burbuja ${m.rol}"><strong>${m.rol === "cliente" ? "Cliente" : "Tú"}:</strong> ${m.texto}</div>`
      ).join("");
      if (escribiendo) {
        html += `<p class="escribiendo">El cliente está escribiendo...</p>`;
      }
      document.getElementById("chat").innerHTML = html;

      const turnosUsuario = conversacion.filter(m => m.rol === "usuario").length;
      document.getElementById("sugerencia").innerText = turnosUsuario >= 3
        ? "Si sientes que llegaron a un acuerdo o a un punto muerto, puedes finalizar la negociación."
        : "";
    }

    async function iniciarNegociacion() {
      if (obtenerUsoHoy() >= LIMITE_DIARIO) {
        mostrarLimiteDiario();
        return;
      }

      conversacion = [];
      document.getElementById("resultado").innerText = "";
      document.getElementById("sugerencia").innerText = "";
      document.getElementById("chat").innerHTML = `<p class="escribiendo">Iniciando negociación...</p>`;
      try {
        const contexto = document.getElementById("filtro").value;
        const dificultad = document.getElementById("dificultad").value;
        const respuesta = await fetch(WORKER + "?contexto=" + encodeURIComponent(contexto) + "&dificultad=" + encodeURIComponent(dificultad));
        const texto = await respuesta.text();
        conversacion.push({ rol: "cliente", texto: texto });
        renderChat(false);
        registrarUso();
      } catch (error) {
        document.getElementById("chat").innerText = "Hubo un error iniciando la negociación. Intenta de nuevo.";
      }
    }

    async function enviarMensaje() {
      const texto = document.getElementById("mensaje").value;
      if (texto.trim() === "") return;

      conversacion.push({ rol: "usuario", texto: texto });
      document.getElementById("mensaje").value = "";
      document.getElementById("btnEnviar").disabled = true;
      renderChat(true);

      try {
        const dificultad = document.getElementById("dificultad").value;
        const url = WORKER + "?accion=continuar&dificultad=" + encodeURIComponent(dificultad)
          + "&historial=" + encodeURIComponent(JSON.stringify(conversacion));
        const respuesta = await fetch(url);
        const respuestaCliente = await respuesta.text();
        conversacion.push({ rol: "cliente", texto: respuestaCliente });
        renderChat(false);
      } catch (error) {
        renderChat(false);
        document.getElementById("chat").innerHTML += "<p>Hubo un error continuando la negociación. Intenta de nuevo.</p>";
      } finally {
        document.getElementById("btnEnviar").disabled = false;
      }
    }

    async function finalizarNegociacion() {
      if (conversacion.length === 0) {
        document.getElementById("resultado").innerText = "Primero inicia una negociación.";
        return;
      }
      document.getElementById("resultado").innerText = "Evaluando negociación completa...";
      try {
        const dificultad = document.getElementById("dificultad").value;
        const url = WORKER + "?accion=evaluar&dificultad=" + encodeURIComponent(dificultad)
          + "&historial=" + encodeURIComponent(JSON.stringify(conversacion));
        const respuesta = await fetch(url);
        const datos = await respuesta.json();

        if (typeof datos.puntaje !== "number" || isNaN(datos.puntaje)) {
          document.getElementById("resultado").innerText = "No se pudo obtener un puntaje válido. Intenta de nuevo.";
          return;
        }

        document.getElementById("resultado").innerText = "Puntaje: " + datos.puntaje + "/10 — " + datos.feedback;

        puntajes.push(datos.puntaje);
        localStorage.setItem("puntajes", JSON.stringify(puntajes));
        calcularYMostrarPromedio();

        historial.push("Puntaje " + datos.puntaje + "/10: " + datos.feedback);
        document.getElementById("historial").innerHTML = historial.map(r => "<li>" + r + "</li>").join("");
        localStorage.setItem("historial", JSON.stringify(historial));
      } catch (error) {
        document.getElementById("resultado").innerText = "Hubo un error evaluando la negociación. Intenta de nuevo.";
      }
    }

    function reiniciar() {
      localStorage.removeItem("historial");
      localStorage.removeItem("puntajes");
      historial = [];
      puntajes = [];
      conversacion = [];
      document.getElementById("historial").innerHTML = "";
      document.getElementById("promedio").innerText = "Promedio: sin datos aún";
      document.getElementById("resultado").innerText = "";
      document.getElementById("chat").innerHTML = "";
      document.getElementById("sugerencia").innerText = "";
    }

    if (localStorage.getItem("historial")) {
      historial = JSON.parse(localStorage.getItem("historial"));
      document.getElementById("historial").innerHTML = historial.map(r => "<li>" + r + "</li>").join("");
    }
    if (localStorage.getItem("puntajes")) {
      puntajes = JSON.parse(localStorage.getItem("puntajes"));
      calcularYMostrarPromedio();
    }
    mostrarLimiteDiario();
  </script>
</body>
</html>
